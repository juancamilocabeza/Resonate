<style>:root {
    --bg: #0f1115;
    --fg: #e7e9ee;
    --muted: #9aa3af;
    --accent: #6ee7b7;
    --card: #171922;
    --btn: #1f2330;
    --error: #ff6b6b;
  }
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    overflow: hidden;
  }
  /* Contenedor principal */
  .app {
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 12px;
    padding-bottom: 80px;
    position: relative;
  }
  /* Header normal (no sticky) */
  header {
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: left;
    padding: 8px 0;
    margin-bottom: 10px;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    color: var(--accent);
    text-align: left;
  }
  /* Contenedor principal del contenido del reproductor */
  .player-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    min-height: 0;
    gap: 12px;
  }
  /* Contenido del reproductor con transparencia inicial */
  .player-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 0;
    opacity: 0.3;
    transition: opacity 0.5s ease;
    gap: 12px;
  }
  /* Cuando la app está activa, quitar transparencia del contenido */
  .app.active .player-content {
    opacity: 1;
  }
  .art {
    width: 220px;
    height: 220px;
    border-radius: 12px;
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
    position: relative;
  }
  .art img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: opacity 0.3s ease;
  }
  .art .hint {
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    padding: 0 10px;
  }
  .track-info {
    text-align: center;
    width: 100%;
    flex-shrink: 0;
  }
  .title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 16px;
  }
  .creator {
    color: var(--muted);
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 16px;
  }
  .progress-section {
    width: 100%;
    margin: 8px 0;
    flex-shrink: 0;
  }
  .progress-bar {
    width: 100%;
    height: 6px;
    background: var(--card);
    border-radius: 3px;
    overflow: hidden;
    cursor: pointer;
  }
  .progress {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    width: 0%;
    transition: width 0.1s;
  }
  .time-controls {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
  }
  .current-time, .total-time {
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    font-size: 12px;
  }
  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin: 12px 0;
    flex-shrink: 0;
  }
  button {
    height: 44px;
    border: none;
    border-radius: 12px;
    background: var(--btn);
    color: var(--fg);
    font-size: 14px;
    cursor: pointer;
    padding: 0 16px;
    transition: all 0.2s ease;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  button:active:not(:disabled) {
    transform: scale(0.95);
  }
  .play-btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent);
    color: #0a0f0c;
    font-weight: 700;
    font-size: 16px;
  }
  .prev-btn, .next-btn {
    min-width: 70px;
  }
  .favorite-btn {
    background: transparent;
    color: var(--muted);
    font-size: 20px;
    width: 36px;
    height: 36px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .favorite-btn.active {
    color: #ff6b6b;
  }
  .genre-section {
    margin: 8px 0;
    flex-shrink: 0;
    width: 100%;
  }
  .genre-label {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 6px;
  }
  select {
    width: 100%;
    height: 40px;
    border: none;
    border-radius: 12px;
    background: var(--btn);
    color: var(--fg);
    font-size: 14px;
    padding: 0 16px;
    cursor: pointer;
  }
  .favorites-section {
    margin: 8px 0;
    flex-shrink: 0;
    width: 100%;
  }
  .favorites-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .favorites-label {
    color: var(--muted);
    font-size: 14px;
  }
  .favorites-toggle {
    background: transparent;
    border: none;
    color: var(--accent);
    font-size: 14px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
  }
  .favorites-list {
    background: var(--card);
    border-radius: 12px;
    max-height: 150px;
    overflow-y: auto;
    display: none;
    margin-top: 6px;
  }
  .favorite-item {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    cursor: pointer;
    transition: background 0.2s ease;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .favorite-item:last-child {
    border-bottom: none;
  }
  .favorite-item:hover {
    background: rgba(255,255,255,0.05);
  }
  .favorite-info {
    flex: 1;
    min-width: 0;
  }
  .favorite-title {
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .favorite-creator {
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .favorite-actions {
    display: flex;
    gap: 6px;
  }
  .favorite-play {
    background: var(--accent);
    border: none;
    color: #0a0f0c;
    font-size: 11px;
    cursor: pointer;
    padding: 5px 8px;
    border-radius: 6px;
    font-weight: bold;
  }
  .favorite-remove {
    background: transparent;
    border: none;
    color: var(--error);
    font-size: 14px;
    cursor: pointer;
    padding: 5px;
    border-radius: 6px;
    transition: all 0.2s ease;
  }
  .favorite-remove:hover {
    background: rgba(255,107,107,0.1);
  }
  .search-section {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--bg);
    padding: 12px;
    border-top: 1px solid var(--card);
    z-index: 100;
  }
  .search-container {
    position: relative;
  }
  .search-input {
    width: 100%;
    height: 46px;
    background: var(--card);
    border: none;
    border-radius: 12px;
    color: var(--fg);
    font-size: 14px;
    padding: 0 16px;
    transition: all 0.3s ease;
  }
  .search-input:focus {
    outline: none;
    box-shadow: 0 0 0 2px var(--accent);
  }
  .search-input::placeholder {
    color: var(--muted);
  }
  .search-results {
    position: absolute;
    bottom: 100%;
    left: 0;
    right: 0;
    background: var(--card);
    border-radius: 12px;
    margin-bottom: 8px;
    max-height: 300px;
    overflow-y: auto;
    display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .search-result {
    padding: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    cursor: pointer;
    transition: background 0.2s ease;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .search-result:last-child {
    border-bottom: none;
  }
  .search-result:hover {
    background: rgba(255,255,255,0.05);
  }
  .result-info {
    flex: 1;
    min-width: 0;
  }
  .result-title {
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .result-creator {
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .result-favorite {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    padding: 6px;
    margin-left: 6px;
    border-radius: 6px;
    transition: all 0.2s ease;
  }
  .result-favorite:hover {
    background: rgba(255,255,255,0.1);
  }
  .result-favorite.active {
    color: #ff6b6b;
  }
  .no-results {
    padding: 16px;
    text-align: center;
    color: var(--muted);
  }
  .search-loading {
    padding: 16px;
    text-align: center;
    color: var(--muted);
  }
  .status-messages {
    margin: 8px 0;
    min-height: 18px;
    text-align: center;
  }
  .status-message {
    background: var(--card);
    border-radius: 8px;
    font-size: 13px;
    padding: 10px 12px;
    margin: 4px 0;
    animation: fadeIn 0.3s ease-in;
  }
  .status-info {
    border-left: 3px solid var(--accent);
  }
  .status-error {
    border-left: 3px solid var(--error);
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-5px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .loader {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--muted);
    border-radius: 50%;
    border-top-color: var(--accent);
    animation: spin 1s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  /* Vista de inicio - Botón centrado y prominente */
  .start-view {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(15, 17, 21, 0.95);
    z-index: 1000;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  .start-view.hidden {
    opacity: 0;
    visibility: hidden;
  }
  .start-title {
    font-size: 2rem;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 1rem;
    text-align: center;
  }
  .start-subtitle {
    font-size: 1rem;
    color: var(--muted);
    margin-bottom: 2rem;
    text-align: center;
    max-width: 80%;
  }
  .start-button {
    background: var(--accent);
    color: #0a0f0c;
    border: none;
    border-radius: 16px;
    padding: 0px 32px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 8px 25px rgba(110, 231, 183, 0.3);
  }
  .start-button:hover {
    transform: scale(1.05);
    box-shadow: 0 0px 30px rgba(110, 231, 183, 0.4);
  }
  .start-button:active {
    transform: scale(0.98);
  }
  /* Responsive para pantallas pequeñas */
  @media (max-height: 700px) {
    .art {
      width: 180px;
      height: 180px;
    }
    .player-content {
      gap: 10px;
    }
    .title {
      font-size: 16px;
    }
    .creator {
      font-size: 13px;
    }
    .progress-section {
      margin: 6px 0;
    }
    .controls {
      margin: 8px 0;
    }
  }
  @media (max-height: 600px) {
    .art {
      width: 140px;
      height: 140px;
    }
    .player-content {
      gap: 8px;
    }
    .progress-section {
      margin: 4px 0;
    }
    .controls {
      margin: 6px 0;
    }
    .genre-section, .favorites-section {
      margin: 6px 0;
    }
  }
  @media (max-width: 480px) {
    .app {
      padding: 10px;
      padding-bottom: 70px;
    }
    .art {
      width: 180px;
      height: 180px;
    }
    button {
      height: 40px;
      padding: 0 14px;
      font-size: 13px;
    }
    .play-btn {
      width: 48px;
      height: 48px;
    }
    .search-input {
      height: 42px;
      font-size: 13px;
    }
    header {
      margin-bottom: 8px;
    }
    h1 {
      font-size: 16px;
    }
  }</style>
<!-- Vista de inicio con botón prominente -->
<div id="start-view" class="start-view">
  <button id="start-button" class="start-button">Iniciar Resonate</button>
</div>
<!-- Aplicación principal -->
<div id="app" class="app">
  <header>
    <h1>resonate</h1>
  </header><!-- Contenedor para el contenido del reproductor -->
  <div class="player-container"><!-- Contenido del reproductor con transparencia inicial -->
    <div id="player-content" class="player-content">
      <div id="art" class="art">&nbsp;</div>
      <div class="track-info">
        <div id="title" class="title">&nbsp;</div>
        <div id="creator" class="creator">&nbsp;</div>
      </div>
      <div id="status-messages" class="status-messages">&nbsp;</div>
      <div class="progress-section">
        <div id="progress-bar" class="progress-bar">
          <div id="progress" class="progress">&nbsp;</div>
        </div>
        <div class="time-controls">
          <span id="current-time" class="current-time">0:00</span> 
          <span id="total-time" class="total-time">0:00</span>
        </div>
      </div>
      <div class="controls">
        <button id="prev-btn" class="prev-btn" disabled="disabled">Anterior</button> 
        <button id="play-btn" class="play-btn">▶</button> 
        <button id="next-btn" class="next-btn">Siguiente</button> 
        <button id="favorite-btn" class="favorite-btn">♡</button>
      </div>
      <div class="genre-section">
        <select id="genre-select">
          <option selected="selected" value="classical">Clásica</option>
          <option value="jazz">Jazz</option>
          <option value="rock">Rock</option>
          <option value="electronic">Electrónica</option>
          <option value="reggae">Reggae</option>
          <option value="blues">Blues</option>
          <option value="hiphop">Hip Hop</option>
          <option value="pop">Pop</option>
          <option value="metal">Metal</option>
          <option value="folk">Folk</option>
          <option value="country">Country</option>
          <option value="rnb">R&amp;B</option>
          <option value="latin">Latina</option>
          <option value="ambient">Ambient</option>
          <option value="punk">Punk</option>
          <option value="funk">Funk</option>
          <option value="soul">Soul</option>
          <option value="disco">Disco</option>
          <option value="indie">Indie</option>
          <option value="alternative">Alternativa</option>
        </select>
      </div>
      <div class="favorites-section">
        <div class="favorites-header">
          <div class="favorites-label">Favoritos</div>
          <button id="favorites-toggle" class="favorites-toggle">Mostrar</button>
        </div>
        <div id="favorites-list" class="favorites-list">&nbsp;</div>
      </div>
    </div>
  </div>
</div>
<div class="search-section">
  <div class="search-container">
    <input id="search-input" class="search-input" type="text" placeholder="Buscar ...">
    <div id="search-results" class="search-results">&nbsp;</div>
  </div>
</div>
<audio id="audio" crossorigin="anonymous" preload="none"></audio>
