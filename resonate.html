<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>resonate</title>
<style>
  :root {
    --bg: #0f1115;
    --fg: #e7e9ee;
    --muted: #9aa3af;
    --accent: #6ee7b7;
    --card: #171922;
    --btn: #1f2330;
    --error: #ff6b6b;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    overflow: hidden;
  }

/* Contenedor principal - AHORA CON SCROLL */
.app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 12px;
    position: relative;
    overflow: hidden;
}

  /* Header normal (no sticky) */
  header {
    flex-shrink: 0;
    display: flex;
    justify-content: left;
    align-items: center;
    text-align: center;
    padding: 8px 0;
    margin-bottom: 10px;
  }

  h1 {
    font-size: 18px;
    font-weight: 600;
    color: var(--accent);
    text-align: left;
  }

  /* Contenedor del reproductor CON SCROLL */
.player-container {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
}

/* Contenido del reproductor que se expande */
.player-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0; /* Importante para el scroll */
}

  /* Cuando la app está activa, quitar transparencia del contenido */
  .app.active .player-content {
    opacity: 1;
  }

  .art {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 60%;
    height: 60%;
    border-radius: 12px;
    background: var(--card);
    overflow: hidden;
    flex-shrink: 0;
  }

  .art img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: opacity 0.3s ease;
  }

  .art .hint {
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    padding: 0 10px;
  }

  .track-info {
    text-align: center;
    width: 100%;
    flex-shrink: 0;
  }

  .title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 16px;
  }

  .creator {
    color: var(--muted);
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 16px;
  }

  .progress-section {
    width: 100%;
    margin: 8px 0;
    flex-shrink: 0;
  }

  .progress-bar {
    width: 100%;
    height: 6px;
    background: var(--card);
    border-radius: 3px;
    overflow: hidden;
    cursor: pointer;
  }

  .progress {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    width: 0%;
    transition: width 0.1s;
  }

  .time-controls {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
  }

  .current-time, .total-time {
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    font-size: 12px;
  }

  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin: 12px 0;
    flex-shrink: 0;
  }

  button {
    height: 44px;
    border: none;
    border-radius: 12px;
    background: var(--btn);
    color: var(--fg);
    font-size: 14px;
    cursor: pointer;
    padding: 0 16px;
    transition: all 0.2s ease;
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  button:active:not(:disabled) {
    transform: scale(0.95);
  }

  .play-btn {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: var(--accent);
    color: #0a0f0c;
    font-weight: 700;
    font-size: 16px;
    font-style: bold;
  }

  .prev-btn, .next-btn {
    min-width: 70px;
  }

  .favorite-btn {
    background: transparent;
    color: var(--muted);
    font-size: 20px;
    width: 36px;
    height: 36px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .favorite-btn.active {
    color: #ff6b6b;
  }

  .genre-section {
    margin: 8px 0;
    flex-shrink: 0;
    width: 100%;
    padding: 0 10px;
  }

  .genre-label {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 6px;
  }

  select {
    width: 100%;
    height: 40px;
    border: none;
    border-radius: 12px;
    background: var(--btn);
    color: var(--fg);
    font-size: 14px;
    cursor: pointer;
    padding: 0 10px;
  }

  select:focus {
    outline: none;
    box-shadow: 0 0 0 2px var(--accent);
  }
  
  .favorites-section {
    flex-shrink: 0;
    width: 100%;
    margin-top: auto; /* Empuja la sección hacia abajo */
}


  .favorites-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .favorites-label {
    color: var(--muted);
    font-size: 12px;
  }

  .favorites-toggle {
    background: transparent;
    border: none;
    color: var(--accent);
    font-size: 14px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
  }

  .favorites-list {
    max-height: none; /* Elimina la altura máxima fija */
    overflow-y: auto;
    flex: 1; /* Ocupa el espacio disponible */
    /* min-height: 200px; /* Altura mínima */
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    margin-top: 8px;
}
  .favorite-item {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    cursor: pointer;
    transition: background 0.2s ease;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .favorite-item:last-child {
    border-bottom: none;
  }

  .favorite-item:hover {
    background: rgba(255,255,255,0.05);
  }

  .favorite-info {
    flex: 1;
    min-width: 0;
  }

  .favorite-title {
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .favorite-creator {
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .favorite-actions {
    display: flex;
    gap: 6px;
  }

  .favorite-play {
    background: var(--accent);
    border: none;
    color: #0a0f0c;
    font-size: 11px;
    cursor: pointer;
    padding: 5px 8px;
    border-radius: 6px;
    font-weight: bold;
  }

  .favorite-remove {
    background: transparent;
    border: none;
    color: var(--error);
    font-size: 14px;
    cursor: pointer;
    padding: 5px;
    border-radius: 6px;
    transition: all 0.2s ease;
  }

  .favorite-remove:hover {
    background: rgba(255,107,107,0.1);
  }

  .search-section {
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--bg);
    padding: 10px;
    border-top: 1px solid var(--card);
  }

  .search-container {
    position: relative;
  }

  .search-input {
    width: 100%;
    height: 40px;
    background: var(--card);
    border: none;
    border-radius: 12px;
    color: var(--fg);
    font-size: 14px;
    padding: 0 16px;
    transition: all 0.3s ease;
  }

  .search-input:focus {
    outline: none;
    box-shadow: 0 0 0 2px var(--accent);
  }

  .search-input::placeholder {
    color: var(--muted);
  }

  .search-results {
    position: absolute;
    left: 0;
    right: 0;
    background: black;
    border-radius: 12px;
    margin-bottom: 8px;
    max-height: 500px;
    overflow-y: auto;
    display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.1);
  }

  .search-result {
    padding: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .search-result:last-child {
    border-bottom: none;
  }

  .search-result:hover {
    background: black;
  }

  .result-info {
    flex: 1;
    min-width: 0;
  }

  .result-title {
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .result-creator {
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .result-favorite {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    padding: 6px;
    margin-left: 6px;
    border-radius: 6px;
    transition: all 0.2s ease;
  }

  .result-favorite:hover {
    background: rgba(255,255,255,0.1);
  }

  .result-favorite.active {
    color: #ff6b6b;
  }

  .no-results {
    padding: 16px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }

  .search-loading {
    padding: 16px;
    text-align: center;
    color: var(--muted);
  }

  .status-messages {
    margin: 0px 0;
    min-height: 10px;
    text-align: left;;
  }

  .status-message {
    display:none;
    background: var(--card);
    border-radius: 8px;
    font-size: 13px;
    padding: 10px 12px;
    margin: 4px 0;
    animation: fadeIn 0.3s ease-in;
  }

  .status-info {
    border-left: 3px solid var(--accent);
  }

  .status-error {
    border-left: 3px solid var(--error);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .loader {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--muted);
    border-radius: 50%;
    border-top-color: var(--accent);
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Vista de inicio - Botón centrado y prominente */
  .start-view {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: var(--bg);
    z-index: 1000;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }

  .start-view.hidden {
    opacity: 0;
    visibility: hidden;
  }

  .start-title {
    font-size: 2rem;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 1rem;
    text-align: center;
  }

  .start-subtitle {
    font-size: 1rem;
    color: var(--muted);
    margin-bottom: 2rem;
    text-align: center;
    max-width: 80%;
  }

  .start-button {
    background: var(--accent);
    color: #0a0f0c;
    border: none;
    border-radius: 16px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 8px 25px rgba(110, 231, 183, 0.3);
  }

  .start-button:hover {
    transform: scale(1.05);
    box-shadow: 0 12px 30px rgba(110, 231, 183, 0.4);
  }

  .start-button:active {
    transform: scale(0.98);
  }

  /* Responsive para pantallas pequeñas */
  @media (max-height: 700px) {
    .art {
      width: 180px;
      height: 180px;
    }
    
    .player-content {
      gap: 10px;
    }
    
    .title {
      font-size: 16px;
    }
    
    .creator {
      font-size: 13px;
    }
    
    .progress-section {
      margin: 6px 0;
    }
    
    .controls {
      margin: 8px 0;
    }
  }

  @media (max-height: 600px) {
    .art {
      width: 140px;
      height: 140px;
    }
    
    .player-content {
      gap: 8px;
    }
    
    .progress-section {
      margin: 4px 0;
    }
    
    .controls {
      margin: 6px 0;
    }
    
    .genre-section, .favorites-section {
      margin: 6px 0;
    }
  }

  @media (max-width: 480px) {
    .app {
      padding: 10px;
      padding-bottom: 70px;
    }
    
    .art {
      width: 180px;
      height: 180px;
    }
    
    button {
      height: 40px;
      padding: 0 14px;
      font-size: 13px;
    }
    
    .play-btn {
      width: 48px;
      height: 48px;
    }
    
    .search-input {
      height: 42px;
      font-size: 13px;
    }
    
    header {
      margin-bottom: 8px;
    }
    
    h1 {
      font-size: 16px;
    }
  }
</style>
</head>

<body>
<!-- Vista de inicio con botón prominente -->
<div class="start-view" id="start-view">
  <button class="start-button" id="start-button">Iniciar resonate</button>
</div>

<!-- Aplicación principal -->
<div class="app" id="app">
  <header>
      <h1 >resonate</h1>
  </header>

  <div id="status-messages"></div>
  
  <div class="search-section">
    <div class="search-container">
      <input type="text" id="search-input" class="search-input" placeholder="Buscar ...">
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <!-- Contenedor para el contenido del reproductor -->
  <div class="player-container">
    <!-- Contenido del reproductor con transparencia inicial -->

      <div class="art" id="art">

      <div class="progress-section">

      <div class="genre-section">
        <select id="genre-select">
            <option value="classical" selected>Clásica</option>
            <option value="jazz">Jazz</option>
            <option value="rock">Rock</option>

            <option value="pop">Pop</option>

            <option value="folk">Folk</option>

        </div>
        <div id="favorites-list" class="favorites-list"></div>
      </div>
    
    </div>
  </div>



</div>

<audio id="audio" crossorigin="anonymous" preload="none"></audio>

<script>
// ==================== CONFIGURACIÓN OPTIMIZADA DE GÉNEROS ====================
const GENRE_CONFIG_OPTIMIZED = {
  classical: {
    query: '(classical OR symphony OR concerto OR sonata) AND mediatype:audio',
    collections: ['78rpm', 'etree', 'georgeblood'],
    fileFilters: ['\\.mp3$', '\\.ogg$', '\\.flac$'],

  },
  reggae: {

  },
  pop: {
    query: '(pop OR single OR album) AND mediatype:audio',
    collections: ['netlabels', 'opensource_music'],
    fileFilters: ['\\.mp3$', '\\.ogg$'],
    minDuration: 120,
    maxDuration: 600
  },
  metal: {
    query: '(metal OR heavy OR thrash) AND mediatype:audio',
    collections: ['netlabels'],
    fileFilters: ['\\.mp3$', '\\.ogg$'],
    minDuration: 120,
    maxDuration: 600
  },
  folk: {
    query: '(folk OR traditional OR acoustic) AND mediatype:audio',
    collections: ['folkmusic', 'etree'],
    fileFilters: ['\\.mp3$', '\\.ogg$'],

    maxDuration: 600

  country: {
    query: '(country OR western OR bluegrass) AND mediatype:audio',
    collections: ['78rpm', 'etree'],
    fileFilters: ['\\.mp3$', '\\.ogg$'],
    minDuration: 120,
    maxDuration: 600
  },
  rnb: {
    query: '(rnb OR soul OR funk) AND mediatype:audio',
    collections: ['netlabels'],
    fileFilters: ['\\.mp3$', '\\.ogg$'],
    minDuration: 120,
    maxDuration: 600
  },
  latin: {

    collections: ['etree', 'netlabels'],

// ==================== SISTEMA DE CACHÉ MEJORADO ====================
const searchCache = new Map();
const metadataCache = new Map();

function getCacheKey(type, query) {
  return `${type}:${query.toLowerCase().trim()}`;
}

async function cachedSearch(query, searchFunction) {
  const cacheKey = getCacheKey('search', query);
  const cached = searchCache.get(cacheKey);
  
  if (cached && Date.now() - cached.timestamp < 300000) {
    return cached.data;
  }
  
  const results = await searchFunction(query);
  searchCache.set(cacheKey, {
    data: results,
    timestamp: Date.now()
  });
  
  return results;
}

// ==================== ELEMENTOS DOM ====================
const elements = {
  audio: document.getElementById('audio'),
  art: document.getElementById('art'),
  title: document.getElementById('title'),
  creator: document.getElementById('creator'),

  progress: document.getElementById('progress'),

  totalTime: document.getElementById('total-time'),
  playBtn: document.getElementById('play-btn'),

// ==================== SISTEMA DE REPRODUCCIÓN CONTINUA ====================
class ContinuousPlaybackManager {
  constructor() {
    this.currentContext = null;
    this.contextData = {
      genre: { currentIndex: -1, items: [] },
      search: { currentIndex: -1, items: [] },
      favorites: { currentIndex: -1, items: [] }
    };
  }
  
  setContext(context, items, startIndex = 0) {
    this.currentContext = context;
    this.contextData[context] = {
      currentIndex: startIndex,
      items: items || []
    };
  }
  
  getNextTrack() {
    if (!this.currentContext || !this.contextData[this.currentContext].items.length) {
      return null;
    }
    
    const context = this.contextData[this.currentContext];
    context.currentIndex = (context.currentIndex + 1) % context.items.length;
    return context.items[context.currentIndex];
  }
  
  getCurrentContext() {
    return this.currentContext;
  }
  
  hasNextTrack() {
    const context = this.contextData[this.currentContext];
    return context && context.items.length > 0;
  }
}

const playbackManager = new ContinuousPlaybackManager();

function isTrackFavorite(track) {

function toggleFavorite(track) {
  if (!track || !track.id) return;
  
  const isFavorite = isTrackFavorite(track);
  
  if (isFavorite) {
    state.favorites = state.favorites.filter(fav => fav.id !== track.id);
    showStatus('Eliminado de favoritos', 'info');

    const favoriteTrack = {

      creator: track.creator || 'Desconocido',
      url: track.url
    };
    state.favorites.push(favoriteTrack);
    showStatus('Agregado a favoritos', 'info');

function formatTime(seconds) {
  if (!isFinite(seconds) || seconds < 0) return '0:00';
  const minutes = Math.floor(seconds / 60);
  const remainingSeconds = Math.floor(seconds % 60);
  return `${minutes}:${String(remainingSeconds).padStart(2, '0')}`;
}

// ==================== BÚSQUEDA OPTIMIZADA ====================
async function optimizedSearchItems(query, genre = null) {
  // Consulta más simple y efectiva
  let searchQuery;
  if (genre && GENRE_CONFIG_OPTIMIZED[genre]) {
    // Usar términos específicos del género
    const genreTerms = query || genre;
    searchQuery = `(${genreTerms}) AND mediatype:audio AND format:("MP3" OR "Ogg Vorbis" OR "VBR MP3")`;
  } else {
    searchQuery = `(${query}) AND mediatype:audio AND format:("MP3" OR "Ogg Vorbis" OR "VBR MP3")`;
  }
  
  const encodedQuery = encodeURIComponent(searchQuery);
  const url = `https://archive.org/advancedsearch.php?q=${encodedQuery}&fl[]=identifier&fl[]=title&fl[]=creator&rows=100&output=json&sort[]=downloads+desc`;
  
  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error('Error de red');
    const data = await response.json();
    
    const validItems = (data.response?.docs || []).filter(item => 
      item.identifier && item.title
    );
    
    console.log(`Encontrados ${validItems.length} items para: ${query}`);
    return validItems;
    
  } catch (error) {
    console.error('Error en búsqueda optimizada:', error);
    return [];
  }
}

function isValidMusicItem(item, genre = null) {
  if (!item.identifier) return false;
  
  const title = (item.title || '').toLowerCase();
  const description = (item.description || '').toLowerCase();
  const creator = (item.creator || '').toLowerCase();
  
  const excludeTerms = [
    'podcast', 'audiobook', 'lecture', 'interview', 'speech',
    'sermon', 'documentary', 'radio show', 'talk', 'conference'
  ];
  
  const hasExcludedTerm = excludeTerms.some(term => 
    title.includes(term) || description.includes(term) || creator.includes(term)
  );
  
  if (hasExcludedTerm) return false;
  
  if (genre && GENRE_CONFIG_OPTIMIZED[genre]) {
    const config = GENRE_CONFIG_OPTIMIZED[genre];
    const genreTerms = config.query.toLowerCase().split(' OR ');
    const hasGenreTerm = genreTerms.some(term => 
      title.includes(term) || description.includes(term) || creator.includes(term)
    );
    
    if (!hasGenreTerm) return false;
  }
  
  return true;
}

// ==================== GESTIÓN DE ARCHIVOS DE AUDIO ====================
async function fetchOptimizedPlayableFiles(identifier, genre = null) {
  const cacheKey = getCacheKey('metadata', identifier);
  const cached = metadataCache.get(cacheKey);
  
  if (cached && Date.now() - cached.timestamp < 600000) {
    return cached.data;
  }
  
  const url = `https://archive.org/metadata/${identifier}`;
  
  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error('Error al cargar metadatos');
    const metadata = await response.json();
    
    if (!metadata?.files) {
      throw new Error('Metadatos inválidos');
    }
    
    // Encontrar el primer archivo de audio válido
    const audioFile = metadata.files.find(file => 
      isPlayableAudioFile(file, genre)
    );
    
    if (!audioFile) {
      throw new Error('No hay archivos de audio reproducibles');
    }
    
    const playableFile = {
      url: `https://archive.org/download/${identifier}/${encodeURIComponent(audioFile.name)}`,
      title: metadata.metadata?.title || audioFile.name || identifier,
      creator: metadata.metadata?.creator || 'Artista desconocido',
      id: identifier,
      format: audioFile.name.split('.').pop()?.toUpperCase() || 'MP3'
    };
    
    metadataCache.set(cacheKey, {
      data: [playableFile], // Devolver como array con un elemento
      timestamp: Date.now()
    });
    
    return [playableFile];
    
  } catch (error) {
    console.error('Error al cargar archivos optimizados:', error);
    throw error;
  }
}

function isPlayableAudioFile(file, genre = null) {
  if (!file.name || file.name.includes('_files.xml') || file.name.includes('_meta.xml')) {
    return false;
  }
  
  const audioFormats = ['.mp3', '.ogg', '.wav', '.flac', '.m4a'];
  const isAudioFile = audioFormats.some(format => 
    file.name.toLowerCase().endsWith(format)
  );
  
  if (!isAudioFile) return false;
  
  const fileSize = file.size || 0;
  if (fileSize < 100000) return false;
  if (fileSize > 500000000) return false;
  
  if (genre && GENRE_CONFIG_OPTIMIZED[genre]) {
    const config = GENRE_CONFIG_OPTIMIZED[genre];
    const duration = file.length || 0;
    
    if (duration < config.minDuration || duration > config.maxDuration) {
      return false;
    }
  }
  
  const excludePatterns = [
    /podcast/i, /audiobook/i, /lecture/i, /interview/i,
    /speech/i, /sermon/i, /documentary/i, /radio.*show/i
  ];
  
  const hasExcludedPattern = excludePatterns.some(pattern => 
    pattern.test(file.name)
  );
  
  return !hasExcludedPattern;
}

function getFileScore(file, genre = null) {
  let score = 0;
  
  const formatScores = {
    '.flac': 100,
    '.wav': 90,
    '.m4a': 80,
    '.mp3': 70,
    '.ogg': 60
  };
  
  const extension = '.' + file.name.split('.').pop()?.toLowerCase();
  score += formatScores[extension] || 50;
  
  const fileSize = file.size || 0;
  if (fileSize > 2000000 && fileSize < 50000000) {
    score += 30;
  }
  
  const fileName = file.name.toLowerCase();
  if (!/^\d+[-_]/.test(fileName)) {
    score += 20;
  }
  
  if (file.length) {
    const duration = file.length;
    if (duration > 120 && duration < 600) {
      score += 40;
    }
  }
  
  return score;
}

// ==================== FUNCIONES DE REPRODUCCIÓN OPTIMIZADAS - CORREGIDAS ====================
async function playOptimizedRandom(genre) {
  if (state.isLoading) return;
  
  state.isLoading = true;
  elements.playBtn.disabled = true;
  elements.playBtn.innerHTML = '<span class="loader"></span>';
  
  state.currentGenre = genre;
  state.isPlayingFavorites = false;
  
  try {
    showStatus(`Buscando música ${genre}...`, 'info', 0);
    
    const config = GENRE_CONFIG_OPTIMIZED[genre];
    if (!config) {
      throw new Error(`Configuración no encontrada para el género: ${genre}`);
    }
    
    // Búsqueda más simple y directa
    const simpleQuery = `${genre} music audio`;
    const items = await cachedSearch(
      `${genre} music`, 
      () => optimizedSearchItems(simpleQuery, genre)
    );
    
    if (items.length === 0) {
      // Segunda intento con búsqueda más amplia
      const fallbackItems = await cachedSearch(
        `${genre} audio`,
        () => optimizedSearchItems(`${genre}`, null) // Sin filtro de género
      );
      
      if (fallbackItems.length === 0) {
        throw new Error(`No se encontraron pistas de ${genre}. Intenta con otro género.`);
      }
      
      playbackManager.setContext('genre', fallbackItems);
    } else {
      playbackManager.setContext('genre', items);
    }
    
    await playNextInContext();
    
  } catch (error) {
    console.error('Error en playOptimizedRandom:', error);
    handlePlaybackError(error, genre);
  } finally {
    state.isLoading = false;
    elements.playBtn.disabled = false;
    elements.playBtn.textContent = '▶';
  }
}

async function playOptimizedSearchResult(result, index, allResults) {
  if (state.isLoading) return;
  
  state.isLoading = true;
  elements.playBtn.disabled = true;
  
  try {
    showStatus(`Cargando: ${result.title}`, 'info', 0);
    
    playbackManager.setContext('search', allResults, index);
    
    const files = await fetchOptimizedPlayableFiles(result.identifier);
    
    if (files.length > 0) {
      const track = files[0];
      await playAudioTrackOptimized(track, result.identifier);
      hideSearchResults();
    } else {
      throw new Error('No se encontraron archivos de audio reproducibles');
    }
    
  } catch (error) {
    console.error('Error en playOptimizedSearchResult:', error);
    showStatus(`Error: ${error.message}`, 'error');
  } finally {
    state.isLoading = false;
    elements.playBtn.disabled = false;
  }
}

async function playOptimizedFavorite(favoriteIndex = 0) {
  if (state.isLoading || state.favorites.length === 0) return;
  
  state.isLoading = true;
  elements.playBtn.disabled = true;
  elements.playBtn.innerHTML = '<span class="loader"></span>';
  
  state.isPlayingFavorites = true;
  
  try {
    playbackManager.setContext('favorites', state.favorites, favoriteIndex);
    
    const favorite = state.favorites[favoriteIndex];
    showStatus(`Cargando favorito: ${favorite.title}`, 'info', 0);
    
    const track = {
      url: favorite.url,
      title: favorite.title,
      creator: favorite.creator,
      id: favorite.id
    };
    
    await playAudioTrackOptimized(track, favorite.id);
    
  } catch (error) {
    console.error('Error en playOptimizedFavorite:', error);
    showStatus(`Error: ${error.message}`, 'error');
  } finally {
    state.isLoading = false;
    elements.playBtn.disabled = false;
    elements.playBtn.textContent = '▶';
  }
}

// ==================== REPRODUCCIÓN CONTINUA MEJORADA ====================
async function playNextInContext() {
  const context = playbackManager.getCurrentContext();
  
  if (!playbackManager.hasNextTrack()) {
    // Si no hay siguiente pista, buscar más del mismo género
    if (context === 'genre') {
      await playOptimizedRandom(state.currentGenre);
    }
    return;
  }
  
  const nextItem = playbackManager.getNextTrack();
  
  try {
    let files;
    
    if (context === 'genre' || context === 'search') {
      files = await fetchOptimizedPlayableFiles(nextItem.identifier, state.currentGenre);
    } else if (context === 'favorites') {
      // Para favoritos, usar la URL directamente
      const track = {
        url: nextItem.url,
        title: nextItem.title,
        creator: nextItem.creator,
        id: nextItem.id
      };
      await playAudioTrackOptimized(track, nextItem.id);
      return;
    }
    
    if (files && files.length > 0) {
      await playAudioTrackOptimized(files[0], nextItem.identifier);
    } else {
      // Si no se pueden cargar archivos, intentar con la siguiente pista
      await playNextInContext();
    }
    
  } catch (error) {
    console.error('Error al reproducir siguiente pista:', error);
    // Reintentar con la siguiente pista después de un breve delay
    setTimeout(() => playNextInContext(), 1000);
  }
}

async function playAudioTrackOptimized(track, identifier) {
  if (!track || !track.url) {
    throw new Error('Pista no disponible');
  }
  
  elements.audio.pause();
  elements.audio.currentTime = 0;
  elements.audio.src = '';
  
  elements.title.textContent = track.title;
  elements.creator.textContent = track.creator;
  
  await setArtwork(track, identifier);
  
  state.currentTrack = track;
  updateFavoriteButton();
  
  showStatus(`Cargando: ${track.title}`, 'info', 0);
  
  return new Promise((resolve, reject) => {
    const audio = elements.audio;
    
    const onCanPlay = () => {
      cleanup();
      audio.play().then(() => {
        showStatus(`Reproduciendo: ${track.title}`, 'info');
        resolve(true);
      }).catch(reject);
    };
    
    const onError = (e) => {
      cleanup();
      reject(new Error(`Error de audio: ${e.target.error?.message || 'Fuente no compatible'}`));
    };
    
    const cleanup = () => {
      audio.removeEventListener('canplay', onCanPlay);
      audio.removeEventListener('error', onError);
      clearTimeout(timeoutId);
    };
    
    const timeoutId = setTimeout(() => {
      cleanup();
      reject(new Error('Tiempo de espera agotado al cargar audio'));
    }, 15000);
    
    audio.addEventListener('canplay', onCanPlay, { once: true });
    audio.addEventListener('error', onError, { once: true });
    
    audio.src = track.url;
    audio.load();
  });
}

// ==================== MANEJO DE ERRORES MEJORADO ====================
function handlePlaybackError(error, context) {
  console.error(`Error de reproducción en ${context}:`, error);
  
  if (state.retryCount < state.maxRetries) {
    state.retryCount++;
    showStatus(`Reintentando... (${state.retryCount}/${state.maxRetries})`, 'info', 2000);
    
    setTimeout(() => {
      if (playbackManager.getCurrentContext() === 'genre') {
        playOptimizedRandom(state.currentGenre);
      } else {
        playNextInContext();
      }
    }, 2000);
  } else {
    showStatus(`Error: ${error.message}`, 'error');
    elements.title.textContent = 'Error al cargar';
    elements.creator.textContent = 'Intenta con otro género o busca manualmente';
    state.retryCount = 0;
    
    // Restablecer botón de reproducción
    elements.playBtn.disabled = false;
    elements.playBtn.textContent = '▶';
  }
}

// ==================== CONTROL DE REPRODUCCIÓN ====================
function togglePlay() {
  if (state.isLoading) return;
  
  state.userInteracted = true;
  
  if (elements.audio.paused) {
    if (!elements.audio.src) {
      forcePlay();
      return;
    }
    
    elements.audio.play().then(() => {
      elements.playBtn.textContent = '| |';
      showStatus('Reproduciendo', 'info');
    }).catch(error => {
      showStatus(`Error: ${error.message}`, 'error');
    });
  } else {
    elements.audio.pause();
    elements.playBtn.textContent = '▶';
    showStatus('Pausado', 'info');
  }
}

function playNext() {
  state.userInteracted = true;
  showStatus('Siguiente pista', 'info');
  playNextInContext();
}

function forcePlay() {
  if (!state.isInitialized) {
    state.isInitialized = true;
    showStatus('Iniciando Resonate...', 'info');
    elements.title.textContent = '';
    elements.creator.textContent = '';
  }
  
  state.userInteracted = true;
  playOptimizedRandom(state.currentGenre);
}

// ==================== BÚSQUEDA Y RESULTADOS ====================
async function performOptimizedSearch() {
  const query = elements.searchInput.value.trim();
  
  if (!query) {
    hideSearchResults();
    return;
  }
  
  elements.searchResults.innerHTML = '<div class="search-loading"><span class="loader"></span> Buscando música...</div>';
  elements.searchResults.style.display = 'block';
  
  try {
    const results = await cachedSearch(query, () => optimizedSearchItems(query));
    displaySearchResults(results);
  } catch (error) {
    elements.searchResults.innerHTML = '<div class="no-results">Error en la búsqueda</div>';
  }
}

function displaySearchResults(results) {
  elements.searchResults.innerHTML = '';
  state.searchResults = results;
  
  if (results.length === 0) {
    elements.searchResults.innerHTML = '<div class="no-results">No se encontraron resultados de música</div>';
    elements.searchResults.style.display = 'block';
    return;
  }
  
  results.forEach((result, index) => {
    const resultEl = document.createElement('div');
    resultEl.className = 'search-result';
    
    const isFavorite = state.favorites.some(fav => fav.id === result.identifier);
    
    resultEl.innerHTML = `
      <div class="result-info">
        <div class="result-title">${result.title || 'Sin título'}</div>
        <div class="result-creator">${result.creator || 'Desconocido'}</div>
      </div>
      <button class="result-favorite ${isFavorite ? 'active' : ''}">
        ${isFavorite ? '♥' : '♡'}
      </button>
    `;
    
    resultEl.addEventListener('click', async (e) => {
      if (!e.target.classList.contains('result-favorite')) {
        showStatus(`Cargando: ${result.title}`, 'info', 0);
        await playOptimizedSearchResult(result, index, results);
      }
    });
    
    const favoriteBtn = resultEl.querySelector('.result-favorite');
    favoriteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const track = {
        id: result.identifier,
        title: result.title,
        creator: result.creator
      };
      toggleFavorite(track);
      favoriteBtn.classList.toggle('active');
      favoriteBtn.textContent = favoriteBtn.classList.contains('active') ? '♥' : '♡';
    });
    
    elements.searchResults.appendChild(resultEl);
  });
  
  elements.searchResults.style.display = 'block';
}

function hideSearchResults() {
  elements.searchResults.style.display = 'none';
  elements.searchInput.blur();
}

// ==================== GESTIÓN DE FAVORITOS ====================
function updateFavoritesList() {
  const favoritesList = elements.favoritesList;
  favoritesList.innerHTML = '';
  
  if (state.favorites.length === 0) {
    favoritesList.innerHTML = '<div class="no-results" style="padding: 12px; text-align: center;">No hay favoritos</div>';
    return;
  }
  
  state.favorites.forEach((favorite, index) => {
    const favoriteItem = document.createElement('div');
    favoriteItem.className = 'favorite-item';
    
    favoriteItem.innerHTML = `
      <div class="favorite-info">
        <div class="favorite-title">${favorite.title || 'Sin título'}</div>
        <div class="favorite-creator">${favorite.creator || 'Desconocido'}</div>
      </div>
      <div class="favorite-actions">
        <button class="favorite-play" data-index="${index}">▶</button>
        <button class="favorite-remove" data-index="${index}">×</button>
      </div>
    `;
    
    const playBtn = favoriteItem.querySelector('.favorite-play');
    const removeBtn = favoriteItem.querySelector('.favorite-remove');
    
    playBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const index = parseInt(playBtn.getAttribute('data-index'));
      playOptimizedFavorite(index);
    });
    
    removeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const index = parseInt(removeBtn.getAttribute('data-index'));
      state.favorites.splice(index, 1);
      saveFavorites();
      updateFavoritesList();
      updateFavoriteButton();
      showStatus('Eliminado de favoritos', 'info');
    });
    
    favoritesList.appendChild(favoriteItem);
  });
}

function toggleFavoritesList() {
    state.favoritesVisible = !state.favoritesVisible;
    
    if (state.favoritesVisible) {
        elements.favoritesList.style.display = 'block';
        elements.favoritesToggle.textContent = 'Ocultar favoritos';
        
        // Ajustar altura máxima basada en el espacio disponible
        const availableHeight = window.innerHeight - elements.favoritesList.getBoundingClientRect().top - 100;
        elements.favoritesList.style.maxHeight = availableHeight + 'px';
        
        updateFavoritesList();
    } else {
        elements.favoritesList.style.display = 'none';
        elements.favoritesToggle.textContent = 'Mostrar favoritos';
        elements.favoritesList.style.maxHeight = 'none';
    }
}

// ==================== BARRA DE PROGRESO ====================
function updateProgressBar() {
  if (elements.audio.duration && isFinite(elements.audio.duration)) {
    const progressPercent = (elements.audio.currentTime / elements.audio.duration) * 100;
    elements.progress.style.width = `${progressPercent}%`;
    elements.currentTime.textContent = formatTime(elements.audio.currentTime);
    elements.totalTime.textContent = formatTime(elements.audio.duration);
  }
}

function seekAudio(event) {
  if (!elements.audio.duration || !isFinite(elements.audio.duration)) return;
  
  const progressBarRect = elements.progressBar.getBoundingClientRect();
  const clickPosition = (event.clientX - progressBarRect.left) / progressBarRect.width;
  const seekTime = clickPosition * elements.audio.duration;
  
  elements.audio.currentTime = seekTime;
}

// ==================== INICIALIZACIÓN ====================
function startApp() {
  state.appStarted = true;
  elements.startView.classList.add('hidden');
  elements.app.classList.add('active');
  forcePlay();
}

function onplay(callback) {
  state.onPlayCallback = callback;
}

function executeOnPlayCallback(trackInfo) {
  if (state.onPlayCallback && typeof state.onPlayCallback === 'function') {
    try {
      state.onPlayCallback(trackInfo);
    } catch (error) {
      console.error('Error ejecutando callback onplay:', error);
    }
  }
}

function initializeApp() {
  loadFavorites();
  
  elements.audio.addEventListener('timeupdate', updateProgressBar);
  elements.audio.addEventListener('loadedmetadata', updateProgressBar);
  elements.audio.addEventListener('play', () => {
    elements.playBtn.textContent = '| |';
    
    if (state.currentTrack) {
      const trackInfo = {
        title: state.currentTrack.title,
        creator: state.currentTrack.creator,
        genre: state.currentGenre,
        duration: elements.audio.duration,
        currentTime: elements.audio.currentTime,
        id: state.currentTrack.id
      };
      executeOnPlayCallback(trackInfo);
    }
  });
  
  elements.audio.addEventListener('pause', () => elements.playBtn.textContent = '▶');
  elements.audio.addEventListener('ended', playNext);
  elements.audio.addEventListener('error', (e) => {
    console.error('Error de audio:', e.target.error);
    showStatus('Error de reproducción', 'error');
  });
  
  elements.progressBar.addEventListener('click', seekAudio);
  elements.playBtn.addEventListener('click', togglePlay);
  elements.nextBtn.addEventListener('click', playNext);
  elements.favoriteBtn.addEventListener('click', () => toggleFavorite(state.currentTrack));
  
  elements.startButton.addEventListener('click', startApp);
  
  elements.searchInput.addEventListener('input', performOptimizedSearch);
  
  elements.genreSelect.addEventListener('change', (e) => {
    state.currentGenre = e.target.value;
    state.userInteracted = true;
    state.retryCount = 0;
    state.isPlayingFavorites = false;
    if (state.isInitialized) {
      playOptimizedRandom(state.currentGenre);
    }
  });
  
  elements.favoritesToggle.addEventListener('click', toggleFavoritesList);
  
  document.addEventListener('click', (e) => {
    if (!elements.searchInput.contains(e.target) && !elements.searchResults.contains(e.target)) {
      hideSearchResults();
    }
  });
  
  document.addEventListener('click', () => {
    state.userInteracted = true;
  });
  
  window.onplay = onplay;
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initializeApp);
} else {
  initializeApp();
}
</script>
</body>
</html>
