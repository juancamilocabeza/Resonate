<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fitcover" />
<title>resonate</title>
<style>
  :root {
    --bg: #0f1115;
    --fg: #e7e9ee;
    --muted: #9aa3af;
    --accent: #6ee7b7;
    --card: #171922;
    --btn: #1f2330;
    --error: #ff6b6b;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    overflow: hidden;
  }

  /* Contenedor principal */
  .app {
    display: flex;
    flex-direction: column;
    padding: 12px;
    padding-bottom: 80px;
    position: relative;
  }

  /* Header normal (no sticky) */
  header {
    flex-shrink: 0;
    display: flex;
    justify-content: left;
    align-items: center;
    text-align: center;
    padding: 8px 0;
    margin-bottom: 10px;
  }

  h1 {
    font-size: 18px;
    font-weight: 600;
    color: var(--accent);
    text-align: left;
  }

  /* Contenedor principal del contenido del reproductor */
  .player-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    min-height: 0;
    gap: 12px;
  }

  /* Contenido del reproductor con transparencia inicial */
  .player-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 0;
    opacity: 0.3;
    transition: opacity 0.5s ease;
    gap: 12px;
  }

  /* Cuando la app está activa, quitar transparencia del contenido */
  .app.active .player-content {
    opacity: 1;
  }

  .art {
    width: 220px;
    height: 220px;
    border-radius: 12px;
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
    position: relative;
  }

  .art img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: opacity 0.3s ease;
  }

  .art .hint {
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    padding: 0 10px;
  }

  .track-info {
    text-align: center;
    width: 100%;
    flex-shrink: 0;
  }

  .title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 16px;
  }

  .creator {
    color: var(--muted);
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 16px;
  }

  .progress-section {
    width: 100%;
    margin: 8px 0;
    flex-shrink: 0;
  }

  .progress-bar {
    width: 100%;
    height: 6px;
    background: var(--card);
    border-radius: 3px;
    overflow: hidden;
    cursor: pointer;
  }

  .progress {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    width: 0%;
    transition: width 0.1s;
  }

  .time-controls {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
  }

  .current-time, .total-time {
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    font-size: 12px;
  }

  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin: 12px 0;
    flex-shrink: 0;
  }

  button {
    height: 44px;
    border: none;
    border-radius: 12px;
    background: var(--btn);
    color: var(--fg);
    font-size: 14px;
    cursor: pointer;
    padding: 0 16px;
    transition: all 0.2s ease;
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  button:active:not(:disabled) {
    transform: scale(0.95);
  }

  .play-btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent);
    color: #0a0f0c;
    font-weight: 700;
    font-size: 16px;
  }

  .prev-btn, .next-btn {
    min-width: 70px;
  }

  .favorite-btn {
    background: transparent;
    color: var(--muted);
    font-size: 20px;
    width: 36px;
    height: 36px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .favorite-btn.active {
    color: #ff6b6b;
  }

  .genre-section {
    margin: 8px 0;
    flex-shrink: 0;
    width: 100%;
  }

  .genre-label {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 6px;
  }

  select {
    width: 100%;
    height: 40px;
    border: none;
    border-radius: 12px;
    background: var(--btn);
    color: var(--fg);
    font-size: 14px;
    padding: 0 16px;
    cursor: pointer;
  }

  .favorites-section {
    margin: 8px 0;
    flex-shrink: 0;
    width: 100%;
  }

  .favorites-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .favorites-label {
    color: var(--muted);
    font-size: 14px;
  }

  .favorites-toggle {
    background: transparent;
    border: none;
    color: var(--accent);
    font-size: 14px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
  }

  .favorites-list {
    background: var(--card);
    border-radius: 12px;
    max-height: 150px;
    overflow-y: auto;
    display: none;
    margin-top: 6px;
  }

  .favorite-item {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    cursor: pointer;
    transition: background 0.2s ease;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .favorite-item:last-child {
    border-bottom: none;
  }

  .favorite-item:hover {
    background: rgba(255,255,255,0.05);
  }

  .favorite-info {
    flex: 1;
    min-width: 0;
  }

  .favorite-title {
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .favorite-creator {
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .favorite-actions {
    display: flex;
    gap: 6px;
  }

  .favorite-play {
    background: var(--accent);
    border: none;
    color: #0a0f0c;
    font-size: 11px;
    cursor: pointer;
    padding: 5px 8px;
    border-radius: 6px;
    font-weight: bold;
  }

  .favorite-remove {
    background: transparent;
    border: none;
    color: var(--error);
    font-size: 14px;
    cursor: pointer;
    padding: 5px;
    border-radius: 6px;
    transition: all 0.2s ease;
  }

  .favorite-remove:hover {
    background: rgba(255,107,107,0.1);
  }

  .search-section {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--bg);
    padding: 12px;
    border-top: 1px solid var(--card);
    z-index: 100;
  }

  .search-container {
    position: relative;
  }

  .search-input {
    width: 100%;
    height: 46px;
    background: var(--card);
    border: none;
    border-radius: 12px;
    color: var(--fg);
    font-size: 14px;
    padding: 0 16px;
    transition: all 0.3s ease;
  }

  .search-input:focus {
    outline: none;
    box-shadow: 0 0 0 2px var(--accent);
  }

  .search-input::placeholder {
    color: var(--muted);
  }

  .search-results {
    position: absolute;
    bottom: 100%;
    left: 0;
    right: 0;
    background: var(--card);
    border-radius: 12px;
    margin-bottom: 8px;
    max-height: 300px;
    overflow-y: auto;
    display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.1);
  }

  .search-result {
    padding: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    cursor: pointer;
    transition: background 0.2s ease;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .search-result:last-child {
    border-bottom: none;
  }

  .search-result:hover {
    background: rgba(255,255,255,0.05);
  }

  .result-info {
    flex: 1;
    min-width: 0;
  }

  .result-title {
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .result-creator {
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .result-favorite {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    padding: 6px;
    margin-left: 6px;
    border-radius: 6px;
    transition: all 0.2s ease;
  }

  .result-favorite:hover {
    background: rgba(255,255,255,0.1);
  }

  .result-favorite.active {
    color: #ff6b6b;
  }

  .no-results {
    padding: 16px;
    text-align: center;
    color: var(--muted);
  }

  .search-loading {
    padding: 16px;
    text-align: center;
    color: var(--muted);
  }

  .status-messages {
    margin: 8px 0;
    min-height: 18px;
    text-align: center;
  }

  .status-message {
    background: var(--card);
    border-radius: 8px;
    font-size: 13px;
    padding: 10px 12px;
    margin: 4px 0;
    animation: fadeIn 0.3s ease-in;
  }

  .status-info {
    border-left: 3px solid var(--accent);
  }

  .status-error {
    border-left: 3px solid var(--error);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .loader {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--muted);
    border-radius: 50%;
    border-top-color: var(--accent);
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Vista de inicio - Botón centrado y prominente */
  .start-view {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(15, 17, 21, 0.95);
    z-index: 1000;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }

  .start-view.hidden {
    opacity: 0;
    visibility: hidden;
  }

  .start-title {
    font-size: 2rem;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 1rem;
    text-align: center;
  }

  .start-subtitle {
    font-size: 1rem;
    color: var(--muted);
    margin-bottom: 2rem;
    text-align: center;
    max-width: 80%;
  }

  .start-button {
    background: var(--accent);
    color: #0a0f0c;
    border: none;
    border-radius: 16px;
    padding: 0px 32px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 8px 25px rgba(110, 231, 183, 0.3);
  }

  .start-button:hover {
    transform: scale(1.05);
    box-shadow: 0 12px 30px rgba(110, 231, 183, 0.4);
  }

  .start-button:active {
    transform: scale(0.98);
  }

  /* Responsive para pantallas pequeñas */
  @media (max-height: 700px) {
    .art {
      width: 180px;
      height: 180px;
    }
    
    .player-content {
      gap: 10px;
    }
    
    .title {
      font-size: 16px;
    }
    
    .creator {
      font-size: 13px;
    }
    
    .progress-section {
      margin: 6px 0;
    }
    
    .controls {
      margin: 8px 0;
    }
  }

  @media (max-height: 600px) {
    .art {
      width: 140px;
      height: 140px;
    }
    
    .player-content {
      gap: 8px;
    }
    
    .progress-section {
      margin: 4px 0;
    }
    
    .controls {
      margin: 6px 0;
    }
    
    .genre-section, .favorites-section {
      margin: 6px 0;
    }
  }

  @media (max-width: 480px) {
    .app {
      padding: 10px;
      padding-bottom: 70px;
    }
    
    .art {
      width: 180px;
      height: 180px;
    }
    
    button {
      height: 40px;
      padding: 0 14px;
      font-size: 13px;
    }
    
    .play-btn {
      width: 48px;
      height: 48px;
    }
    
    .search-input {
      height: 42px;
      font-size: 13px;
    }
    
    header {
      margin-bottom: 8px;
    }
    
    h1 {
      font-size: 16px;
    }
  }
</style>
</head>

<body>
<!-- Vista de inicio con botón prominente -->
<div class="start-view" id="start-view">
  <button class="start-button" id="start-button">Iniciar resonate</button>
</div>

<!-- Aplicación principal -->
<div class="app" id="app">
  <header>
      <h1>resonate</h1>
  </header>

  <!-- Contenedor para el contenido del reproductor -->
  <div class="player-container">
    <!-- Contenido del reproductor con transparencia inicial -->
    <div class="player-content" id="player-content">
      <div class="art" id="art">
        <span class="hint"></span>
      </div>
      
      <div class="track-info">
        <div class="title" id="title"></div>
        <div class="creator" id="creator"></div>
      </div>

      <div class="status-messages" id="status-messages"></div>

      <div class="controls">
        <button id="prev-btn" class="prev-btn" disabled>Anterior</button>
        <button id="play-btn" class="play-btn">▶</button>
        <button id="next-btn" class="next-btn">Siguiente</button>
        <button id="favorite-btn" class="prev-btn">♡</button>
      </div>
      
      <div class="progress-section">
        <div class="progress-bar" id="progress-bar">
          <div class="progress" id="progress"></div>
        </div>
        <div class="time-controls">
          <span class="current-time" id="current-time">0:00</span>
          <span class="total-time" id="total-time">0:00</span>
        </div>
      </div>
      
      <div class="genre-section">
        <select id="genre-select">
            <option value="classical" selected>Clásica</option>
            <option value="jazz">Jazz</option>
            <option value="rock">Rock</option>
            <option value="electronic">Electrónica</option>
            <option value="reggae">Reggae</option>
            <option value="blues">Blues</option>
            <option value="hiphop">Hip Hop</option>
            <option value="pop">Pop</option>
            <option value="metal">Metal</option>
            <option value="folk">Folk</option>
            <option value="country">Country</option>
            <option value="rnb">R&B</option>
            <option value="latin">Latina</option>
            <option value="ambient">Ambient</option>
            <option value="punk">Punk</option>
            <option value="funk">Funk</option>
            <option value="soul">Soul</option>
            <option value="disco">Disco</option>
            <option value="indie">Indie</option>
            <option value="alternative">Alternativa</option>
        </select>
      </div>

    </div>
  </div>

  <div class="favorites-section">
    <div class="favorites-header">
        <button id="favorites-toggle" class="favorites-toggle">Mostrar favoritos</button>
    </div>
    <div id="favorites-list" class="favorites-list"></div>
  </div>

  <div class="search-section">
    <div class="search-container">
      <input type="text" id="search-input" class="search-input" placeholder="Buscar ...">
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

</div>

<audio id="audio" crossorigin="anonymous" preload="none"></audio>

<script>
// Colecciones específicas de música en Internet Archive
const MUSIC_COLLECTIONS = [
  '78rpm',           // Grabaciones históricas
  'etree',           // Música en vivo/conciertos
  'opensource_music', // Música de código abierto
  'folkmusic',       // Música folclórica
  'netlabels',       // Sellos discográficos en línea
  'GratefulDead',    // Bandas específicas
  'LiveMusicArchive' // Archivo de música en vivo
];

// Configuración de géneros - usando colecciones específicas
const GENRE_CONFIG = {
  classical: {
    query: 'classical',
    collections: ['78rpm', 'etree'],
    filters: ['symphony', 'concerto', 'sonata', 'opera']
  },
  jazz: {
    query: 'jazz',
    collections: ['78rpm', 'etree'],
    filters: ['swing', 'bebop', 'cooljazz', 'fusion']
  },
  rock: {
    query: 'rock',
    collections: ['etree', 'netlabels'],
    filters: ['rock', 'album', 'single']
  },
  electronic: {
    query: 'electronic',
    collections: ['netlabels', 'opensource_music'],
    filters: ['electronic', 'techno', 'house', 'ambient']
  },
  reggae: {
    query: 'reggae',
    collections: ['etree', 'netlabels'],
    filters: ['reggae', 'dub', 'ska']
  },
  blues: {
    query: 'blues',
    collections: ['78rpm', 'etree'],
    filters: ['blues', 'delta', 'chicago']
  },
  hiphop: {
    query: 'hiphop',
    collections: ['netlabels', 'opensource_music'],
    filters: ['hiphop', 'rap', 'beats']
  },
  pop: {
    query: 'pop',
    collections: ['netlabels', 'opensource_music'],
    filters: ['pop', 'single', 'album']
  },
  metal: {
    query: 'metal',
    collections: ['netlabels'],
    filters: ['metal', 'heavy', 'thrash']
  },
  folk: {
    query: 'folk',
    collections: ['folkmusic', 'etree'],
    filters: ['folk', 'traditional', 'acoustic']
  },
  country: {
    query: 'country',
    collections: ['78rpm', 'etree'],
    filters: ['country', 'western', 'bluegrass']
  },
  rnb: {
    query: 'rnb',
    collections: ['netlabels'],
    filters: ['rnb', 'soul', 'funk']
  },
  latin: {
    query: 'latin',
    collections: ['etree', 'netlabels'],
    filters: ['latin', 'salsa', 'merengue']
  },
  ambient: {
    query: 'ambient',
    collections: ['netlabels', 'opensource_music'],
    filters: ['ambient', 'drone', 'atmospheric']
  },
  punk: {
    query: 'punk',
    collections: ['netlabels'],
    filters: ['punk', 'hardcore', 'oi']
  },
  funk: {
    query: 'funk',
    collections: ['netlabels', 'etree'],
    filters: ['funk', 'disco', 'soul']
  },
  soul: {
    query: 'soul',
    collections: ['78rpm', 'netlabels'],
    filters: ['soul', 'motown', 'r&b']
  },
  disco: {
    query: 'disco',
    collections: ['netlabels'],
    filters: ['disco', 'funk', 'dance']
  },
  indie: {
    query: 'indie',
    collections: ['netlabels', 'opensource_music'],
    filters: ['indie', 'alternative', 'lo-fi']
  },
  alternative: {
    query: 'alternative',
    collections: ['netlabels', 'opensource_music'],
    filters: ['alternative', 'indie', 'college']
  }
};

// Elementos DOM
const elements = {
  audio: document.getElementById('audio'),
  art: document.getElementById('art'),
  title: document.getElementById('title'),
  creator: document.getElementById('creator'),
  proxyStatus: document.getElementById('proxy-status'),
  statusMessages: document.getElementById('status-messages'),
  progressBar: document.getElementById('progress-bar'),
  progress: document.getElementById('progress'),
  currentTime: document.getElementById('current-time'),
  totalTime: document.getElementById('total-time'),
  playBtn: document.getElementById('play-btn'),
  prevBtn: document.getElementById('prev-btn'),
  nextBtn: document.getElementById('next-btn'),
  favoriteBtn: document.getElementById('favorite-btn'),
  genreSelect: document.getElementById('genre-select'),
  searchInput: document.getElementById('search-input'),
  searchResults: document.getElementById('search-results'),
  favoritesToggle: document.getElementById('favorites-toggle'),
  favoritesList: document.getElementById('favorites-list'),
  startView: document.getElementById('start-view'),
  startButton: document.getElementById('start-button'),
  app: document.getElementById('app'),
  playerContent: document.getElementById('player-content')
};

// Estado de la aplicación
const state = {
  currentGenre: 'classical',
  currentTrack: null,
  isLoading: false,
  favorites: [],
  userInteracted: false,
  retryCount: 0,
  maxRetries: 5,
  searchResults: [],
  currentSearchIndex: -1,
  isPlayingFavorites: false,
  currentFavoriteIndex: -1,
  favoritesVisible: false,
  isInitialized: false,
  onPlayCallback: null,
  appStarted: false
};

// Sistema de almacenamiento local
function loadFavorites() {
  try {
    const favorites = localStorage.getItem('resonate_favorites');
    if (favorites) {
      state.favorites = JSON.parse(favorites);
    }
  } catch (e) {
    state.favorites = [];
  }
}

function saveFavorites() {
  try {
    localStorage.setItem('resonate_favorites', JSON.stringify(state.favorites));
  } catch (e) {
    console.log('Error guardando favoritos');
  }
}

function isTrackFavorite(track) {
  return state.favorites.some(fav => fav.id === track.id);
}

function toggleFavorite(track) {
  if (!track || !track.id) return;
  
  const isFavorite = isTrackFavorite(track);
  
  if (isFavorite) {
    state.favorites = state.favorites.filter(fav => fav.id !== track.id);
    showStatus('Eliminado de favoritos', 'info');
  } else {
    const favoriteTrack = {
      id: track.id,
      title: track.title || 'Sin título',
      creator: track.creator || 'Desconocido',
      url: track.url
    };
    state.favorites.push(favoriteTrack);
    showStatus('Agregado a favoritos', 'info');

// Utilidades
function formatTime(seconds) {
  if (!isFinite(seconds) || seconds < 0) return '0:00';
  const minutes = Math.floor(seconds / 60);
  const remainingSeconds = Math.floor(seconds % 60);
  return `${minutes}:${String(remainingSeconds).padStart(2, '0')}`;
}

// Nueva estrategia de búsqueda - usando colecciones específicas
async function searchItems(query) {
  // Buscar en colecciones de música específicas
  const musicCollections = MUSIC_COLLECTIONS.join('+OR+collection:');
  const encodedQuery = encodeURIComponent(query);
  
  // Consulta que busca en colecciones de música específicas
  const url = `https://archive.org/advancedsearch.php?q=${encodedQuery}+AND+(collection:${musicCollections})&fl[]=identifier&fl[]=title&fl[]=creator&rows=50&output=json&sort[]=downloads+desc`;
  
  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error('Error de red');
    const data = await response.json();
    
    // Si no hay resultados, intentar una búsqueda más amplia pero con filtros
    if (!data.response || data.response.docs.length === 0) {
      return await fallbackSearch(query);
    }
    
    return data.response.docs;
  } catch (error) {
    console.error('Error en búsqueda:', error);
    // Intentar búsqueda de respaldo
    return await fallbackSearch(query);
  }
}

// Búsqueda de respaldo - más amplia pero con filtros
async function fallbackSearch(query) {
  const encodedQuery = encodeURIComponent(`${query} AND mediatype:audio`);
  const url = `https://archive.org/advancedsearch.php?q=${encodedQuery}&fl[]=identifier&fl[]=title&fl[]=creator&rows=30&output=json&sort[]=downloads+desc`;
  
  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error('Error de red');
    const data = await response.json();
    
    // Filtrar resultados por nombre (excluir podcasts, audiolibros, etc.)
    const filteredResults = (data.response?.docs || []).filter(item => {
      const title = (item.title || '').toLowerCase();
      const creator = (item.creator || '').toLowerCase();
      
      // Excluir tipos de contenido no musical
      const excludeTerms = [
        'podcast', 'audiobook', 'lecture', 'interview', 
        'speech', 'sermon', 'documentary', 'radio', 'talk'
      ];
      
      return !excludeTerms.some(term => 
        title.includes(term) || creator.includes(term)
      );
    });
    
    return filteredResults;
  } catch (error) {
    console.error('Error en búsqueda de respaldo:', error);
    return [];
  }
}

// Función para obtener archivos reproducibles
async function fetchPlayableFiles(identifier) {
  const url = `https://archive.org/metadata/${identifier}`;
  
  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error('Error al cargar metadatos');
    const metadata = await response.json();
    
    if (!metadata || !metadata.files) {
      throw new Error('Metadatos inválidos');
    }
    
    // Buscar archivos de audio
    const audioFiles = metadata.files.filter(file => {
      if (!file.name || file.name.includes('_files.xml') || file.name.includes('_meta.xml')) {
        return false;
      }
      
      const lowerName = file.name.toLowerCase();
      const isAudioFile = lowerName.endsWith('.mp3') || 
             lowerName.endsWith('.ogg') || 
             lowerName.endsWith('.wav');
      
      // Excluir archivos que parecen ser podcasts o audiolibros
      const isLikelyMusic = !lowerName.includes('podcast') && 
                           !lowerName.includes('audiobook') &&
                           !lowerName.includes('lecture') &&
                           !lowerName.includes('interview');
      
      return isAudioFile && isLikelyMusic;
    });
    
    if (audioFiles.length === 0) {
      throw new Error('No hay archivos de audio reproducibles');
    }
    
    // Ordenar por tamaño (los archivos muy pequeños o muy grandes son menos probables de ser canciones)
    audioFiles.sort((a, b) => {
      const sizeA = a.size || 0;
      const sizeB = b.size || 0;
      
      // Preferir archivos entre 1MB y 20MB (tamaño típico de canciones)
      const idealMin = 1 * 1024 * 1024; // 1MB
      const idealMax = 20 * 1024 * 1024; // 20MB
      
      const scoreA = getFileScore(sizeA, idealMin, idealMax);
      const scoreB = getFileScore(sizeB, idealMin, idealMax);
      
      return scoreB - scoreA; // Orden descendente (mejor puntuación primero)
    });
    
    // Tomar los mejores archivos
    const playableFiles = audioFiles.slice(0, 3).map(file => ({
      url: `https://archive.org/download/${identifier}/${encodeURIComponent(file.name)}`,
      title: metadata.metadata?.title || file.name || identifier,
      creator: metadata.metadata?.creator || 'Artista desconocido',
      id: identifier,
      format: file.name.split('.').pop()?.toUpperCase() || 'MP3'
    }));
    
    return playableFiles;
    
  } catch (error) {
    console.error('Error al cargar archivos:', error);
    throw error;
  }
}

// Función auxiliar para puntuar archivos por tamaño
function getFileScore(size, idealMin, idealMax) {
  if (size < idealMin) return 0; // Muy pequeño
  if (size > idealMax) return size > (idealMax * 5) ? 0 : 0.5; // Muy grande
  
  // Dentro del rango ideal
  const idealCenter = (idealMin + idealMax) / 2;
  const distance = Math.abs(size - idealCenter);
  const maxDistance = idealMax - idealCenter;
  
  return 1 - (distance / maxDistance);
}

// Función principal para reproducir
async function playRandom(genre) {
  if (state.isLoading) return;
  
  state.isLoading = true;
  elements.playBtn.disabled = true;
  elements.playBtn.innerHTML = '<span class="loader"></span>';
  
  state.currentGenre = genre;
  state.isPlayingFavorites = false;
  
  try {
    showStatus(`Buscando música ${genre}...`, 'info', 0);
    const items = await queryItems(genre);
    
    if (items.length === 0) {
      throw new Error('No se encontraron pistas para este género');
    }
    
    // Intentar con varios ítems hasta encontrar uno que funcione
    let success = false;
    let attempts = 0;
    const maxAttempts = 5;
    
    // Mezclar los ítems para mayor variedad
    const shuffledItems = [...items].sort(() => Math.random() - 0.5);
    
    while (!success && attempts < maxAttempts && shuffledItems.length > 0) {
      const item = shuffledItems[attempts];
      
      try {
        showStatus(`Cargando: ${item.title}`, 'info', 0);
        const files = await fetchPlayableFiles(item.identifier);
        
        if (files.length > 0) {
          const track = files[0];
          success = await playAudioTrack(track, item.identifier);
          if (success) {
            state.retryCount = 0; // Resetear contador en éxito
            break;
          }
        }
      } catch (error) {
        console.error(`Error cargando ítem ${attempts + 1}:`, error);
        // Continuar con el siguiente ítem
      }
      
      attempts++;
    }
    
    if (!success) {
      throw new Error('No se pudo cargar ninguna pista después de varios intentos');
    }
    
  } catch (error) {
    console.error('Error en playRandom:', error);
    
    // Reintentar si no hemos excedido el máximo
    if (state.retryCount < state.maxRetries) {
      state.retryCount++;
      showStatus(`Reintentando... (${state.retryCount}/${state.maxRetries})`, 'info', 2000);
      setTimeout(() => playRandom(genre), 2000);
    } else {
      showStatus(`Error: ${error.message}`, 'error');
      elements.title.textContent = 'Error al cargar género';
      elements.creator.textContent = 'Intenta con otro género o busca manualmente';
    }
  } finally {
    state.isLoading = false;
    elements.playBtn.disabled = false;
    elements.playBtn.textContent = '▶';
  }
}

// Control de reproducción
async function playAudioTrack(track, identifier) {
  if (!track || !track.url) {
    showStatus('Error: Pista no disponible', 'error');
    return false;
  }
  
  // Limpiar estado anterior
  elements.audio.pause();
  elements.audio.currentTime = 0;
  elements.audio.src = '';
  
  // Actualizar UI
  elements.title.textContent = track.title;
  elements.creator.textContent = track.creator;
  
  // Cargar portada
  await setArtwork(track, identifier);
  
  state.currentTrack = track;
  updateFavoriteButton();
  
  showStatus(`Cargando: ${track.title}`, 'info', 0);
  
  try {
    // Configurar fuente de audio
    elements.audio.src = track.url;
    
    // Esperar a que el audio esté listo
    await new Promise((resolve, reject) => {
      const onCanPlay = () => {
        cleanup();
        resolve();
      };
      
      const onError = (e) => {
        cleanup();
        reject(new Error(`Error de audio: ${e.target.error?.message || 'Fuente no compatible'}`));
      };
      
      const cleanup = () => {
        elements.audio.removeEventListener('canplay', onCanPlay);
        elements.audio.removeEventListener('error', onError);
      };
      
      elements.audio.addEventListener('canplay', onCanPlay, { once: true });
      elements.audio.addEventListener('error', onError, { once: true });
      elements.audio.load();
    });
    
    // Reproducir automáticamente
    await elements.audio.play();
    showStatus(`Reproduciendo: ${track.title}`, 'info');
    
    return true;
    
  } catch (error) {
    console.error('Error en playAudioTrack:', error);
    showStatus(`Error: ${error.message}`, 'error');
    return false;
  }
}

function togglePlay() {
  if (state.isLoading) return;

}

  if (elements.audio.duration && isFinite(elements.audio.duration)) {
    const progressPercent = (elements.audio.currentTime / elements.audio.duration) * 100;
    elements.progress.style.width = `${progressPercent}%`;
    elements.currentTime.textContent = formatTime(elements.audio.currentTime);
    elements.totalTime.textContent = formatTime(elements.audio.duration);
  }
}

function seekAudio(event) {
  if (!elements.audio.duration || !isFinite(elements.audio.duration)) return;
  
  const progressBarRect = elements.progressBar.getBoundingClientRect();
  const clickPosition = (event.clientX - progressBarRect.left) / progressBarRect.width;
  const seekTime = clickPosition * elements.audio.duration;
  
  elements.audio.currentTime = seekTime;
}

// IMPLEMENTACIÓN DE ONPLAY
function onplay(callback) {
  state.onPlayCallback = callback;
  console.log('Callback onplay registrado:', callback);
}

// Función para ejecutar el callback onplay
function executeOnPlayCallback(trackInfo) {
  if (state.onPlayCallback && typeof state.onPlayCallback === 'function') {
    try {
      state.onPlayCallback(trackInfo);
      console.log('Callback onplay ejecutado con:', trackInfo);
    } catch (error) {
      console.error('Error ejecutando callback onplay:', error);
    }
  }
}

// Inicialización
function initializeApp() {
  loadFavorites();
  
  // Eventos de audio
  elements.audio.addEventListener('timeupdate', updateProgressBar);
  elements.audio.addEventListener('loadedmetadata', updateProgressBar);
  elements.audio.addEventListener('play', () => {
    elements.playBtn.textContent = '| |';
    
    // Ejecutar callback onplay cuando la reproducción comienza
    if (state.currentTrack) {
      const trackInfo = {
        title: state.currentTrack.title,
        creator: state.currentTrack.creator,
        genre: state.currentGenre,
        duration: elements.audio.duration,
        currentTime: elements.audio.currentTime,
        id: state.currentTrack.id
      };
      executeOnPlayCallback(trackInfo);
    }
  });
  
  elements.audio.addEventListener('pause', () => elements.playBtn.textContent = '▶');
  elements.audio.addEventListener('ended', playNext);
  elements.audio.addEventListener('error', (e) => {
    console.error('Error de audio:', e.target.error);
    showStatus('Error de reproducción', 'error');
  });
  
  // Eventos de controles
  elements.progressBar.addEventListener('click', seekAudio);
  elements.playBtn.addEventListener('click', togglePlay);
  elements.nextBtn.addEventListener('click', playNext);
  elements.favoriteBtn.addEventListener('click', () => toggleFavorite(state.currentTrack));
  
  // Evento del botón Iniciar Resonate
  elements.startButton.addEventListener('click', startApp);
  
  // Eventos de búsqueda
  elements.searchInput.addEventListener('input', performSearch);
  
  // Evento de género
  elements.genreSelect.addEventListener('change', (e) => {
    state.currentGenre = e.target.value;
    state.userInteracted = true;
    state.retryCount = 0;
    state.isPlayingFavorites = false;
    if (state.isInitialized) {
      playRandom(state.currentGenre);
    }
  });
  
  // Evento de favoritos
  elements.favoritesToggle.addEventListener('click', toggleFavoritesList);
  
  // Cerrar resultados al hacer clic fuera
  document.addEventListener('click', (e) => {
    if (!elements.searchInput.contains(e.target) && !elements.searchResults.contains(e.target)) {
      hideSearchResults();
    }
  });
  
  // Marcar interacción del usuario
  document.addEventListener('click', () => {
    state.userInteracted = true;
  });
  
  // Iniciar aplicación
  elements.proxyStatus.textContent = 'Conectado';
  
  // Hacer la función onplay globalmente accesible
  window.onplay = onplay;
}

// Inicializar
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initializeApp);
} else {
  initializeApp();
}
</script>
</body>
</html>
