<body>
  <header>
    <h1><a href="https://www.resonateplayer.com" style="text-decoration: none; color: inherit;">&nbsp;Resonate</a></h1>
    <!-- Search and Discovery Section -->
    <div class="stage">&nbsp;&nbsp;Early stage</div>
  </header>

  <!-- Search and Discovery Section -->
  <div class="discovery-section">
    <div class="search-section">
      <div class="search-container">
        <input type="text" id="search-input" class="search-input" placeholder="Buscar pistas">
      </div>
      <div id="search-results" class="search-results">
        <div id="search-loader" class="search-loader" style="display: none;">
          <span class="loader-text">Buscando...</span>
        </div>
        <div id="search-results-list" class="search-results-list"></div>
      </div>
    </div>
  </div>

  <div class="app" id="app">
    <!-- Favorites Section -->
    <div class="favorites-section">
      <div class="favorites-header">
        <div id="favorites-toggle" class="favorites-label" aria-label="Ver lista de favoritos">
          <span class="favorites-icon">❤️</span>
          <span class="favorites-text">Favoritos</span>
          <span class="favorites-count" id="favorites-count">(0)</span>
        </div>
      </div>
    </div>
    <div id="favorites-list" class="favorites-list"></div>

    <!-- Main Player Section -->
    <div class="main-player-section">
      <div class="player-container">
        <div class="player-content" id="player-content">
            <div class="art" id="art">
            <span class="hint"></span>
          </div>
          <div class="current-track-info">
            <div class="title" id="title"></div>
            <div class="creator" id="creator"></div>
            <div class="creator" id="quality-text" style="display: none;">auto</div>
          </div>
          <div class="progress-section">
            <div class="progress-bar" id="progress-bar">
              <span class="current-time" id="current-time">0:00</span>
              <div class="progress" id="progress"></div>
              <span class="total-time" id="total-time">0:00</span>
            </div>
          </div>
          <div class="controls">
            <button id="shuffle-favorites-btn" class="shuffle-favorites-btn">⇄</button>
            <button id="prev-btn" class="prev-btn" aria-label="Anterior">⏮</button>
            <button id="play-btn" class="play-btn" aria-label="Reproducir/Pausar">▶</button>
            <button id="next-btn" class="next-btn" aria-label="Siguiente">⏭</button>
            <button id="favorite-btn" class="favorite-btn" aria-label="Favorito">🩶</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Donation QR Tooltip -->
  <div id="donation-tooltip" class="donation-tooltip">
    <div class="tooltip-content">
      <button class="tooltip-close" aria-label="Cerrar">×</button>
      <h3>Apoya donando a Resonate</h3>
      <p>Escanea el código QR para donar desde Nequi (solo Colombia)</p>
      <img src="utils/nequi-qr.jpeg" alt="QR para donar desde Nequi" class="qr-code">
      <button class="download-qr-btn"><a href="utils/nequi-qr.jpeg" style="text-decoration: none;">Descargar QR</a></button>
    </div>
  </div>

  <footer class="footer">
    <div class="contact-section"> 
      <a href="https://wa.me/573126907942" target="_blank" aria-label="WhatsApp" style="color: #25d366; text-decoration: none;">&nbspWhatsApp</a><a href="#" aria-label="Donar" style="color: var(--accent-alt); text-decoration: none;">&nbspDonar</a>
    </div>

    <div>Todos los derechos reservados. Prohibida la reproducción total o parcial sin
      autorización.
    </div>
  </footer>
  
  <div id="status-messages"></div>
  
  <audio id="audio" preload="metadata"></audio>
  
  <!-- Logger JS -->
  <script src="js/logger.js"></script>

  <!-- Cache JS -->
  <script src="js/cache.js"></script>

  <!-- Playback JS -->
  <script src="js/playback.js"></script>

  <!-- Search JS -->
  <script src="js/search.js"></script>

  <!-- UI JS -->
  <script src="js/ui.js"></script>

  <!-- Initialization JS -->
  <script src="js/initialization.js"></script>

  <!-- Donation Tooltip Functionality -->
  <script>
    // Donation tooltip functionality
    let donationTooltipVisible = false;
    const donationTooltip = document.getElementById('donation-tooltip');
    const donateIconLink = document.querySelector('.contact-section a:nth-child(2)');
    const tooltipCloseBtn = document.querySelector('.tooltip-close');
    const downloadBtn = document.querySelector('.download-qr-btn');

    function toggleDonationTooltip() {
      donationTooltipVisible = !donationTooltipVisible;
      if (donationTooltipVisible) {
        // Calculate position above the donate icon
        const iconRect = donateIconLink.getBoundingClientRect();

        // Center horizontally in the screen
        const tooltipWidth = window.innerWidth-20; // Approximate width
        const tooltipHeight = window.innerHeight-150; // Approximate height
        let left = (window.innerWidth - tooltipWidth);
        let top = (window.innerHeight - tooltipHeight);


        // Ensure tooltip stays within viewport
        if (left < 10) left = 10;
        if (left + tooltipWidth > window.innerWidth - 10) left = window.innerWidth - tooltipWidth - 10;
        if (top < 10) top = iconRect.bottom + 10; // Show below if no space above

        donationTooltip.style.left = left + 'px';
        donationTooltip.style.top = top + 'px';
        donationTooltip.style.bottom = 'auto';
        donationTooltip.classList.add('active');
      } else {
        donationTooltip.classList.remove('active');
      }
    }

    function closeDonationTooltip() {
      donationTooltipVisible = false;
      donationTooltip.classList.remove('active');
    }

    function downloadQRCode() {
      const qrImg = document.querySelector('.qr-code');
      const imgSrc = qrImg.src;

      // Create download link
      const link = document.createElement('a');
      link.href = imgSrc;
      link.download = 'qr-donar-a-resonate-por-nequi.jpg';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      // Show success message
      showStatus('QR descargado exitosamente', 'info', 2000);
    }

    // Add event listeners when DOM is loaded
    document.addEventListener('DOMContentLoaded', function() {
      // Click on donate icon
      if (donateIconLink) {
        donateIconLink.addEventListener('click', function(e) {
          e.preventDefault();
          toggleDonationTooltip();
        });
      }

      // Close button
      if (tooltipCloseBtn) {
        tooltipCloseBtn.addEventListener('click', closeDonationTooltip);
      }

      // Download button
      if (downloadBtn) {
        downloadBtn.addEventListener('click', downloadQRCode);
      }

      // Close tooltip when clicking outside
      document.addEventListener('click', function(e) {
        if (!donationTooltip.contains(e.target) &&
            !donateIconLink.contains(e.target) &&
            donationTooltipVisible) {
          closeDonationTooltip();
        }
      });

      // Close tooltip on escape key
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && donationTooltipVisible) {
          closeDonationTooltip();
        }
      });
    });
  </script>
