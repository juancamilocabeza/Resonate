<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Resonate Player</title>
  <meta name="description"
    content="Reproductor multimedia, que te permite descubrir y disfrutar contenidos libre y privada">
  <meta name="keywords" content="Resonate, reproductor multimedia, online, PWA, gratis, offline">
  <meta name="robots" content="index, follow">
  <meta name="author" content="Juan Cabeza">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="icons/favicon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="msapplication-TileColor" content="#000000">
  <link rel="stylesheet" href="css/resonate.css" />
  <link rel="manifest" href="manifest.json" />
</head>

<body>
  <header>
    <h1>&nbsp;Resonate</h1>
  </header>

  <!-- Search and Discovery Section -->
  <div class="discovery-section">
    <div class="search-section">
      <div class="search-container">
        <input type="text" id="search-input" class="search-input" placeholder="Buscar">
      </div>
      <div id="search-results" class="search-results">
        <div id="search-results-list" class="search-results-list"></div>
      </div>
    </div>
  </div>

  <!-- Main Player Section -->
  <div class="app" id="app">
    <!-- Favorites Section -->
    <div class="favorites-section">
      <div class="favorites-header">
        <div id="favorites-toggle" class="favorites-label">▼ ❤️</div>
      </div>
      <div id="favorites-list" class="favorites-list"></div>
    </div>
    <div class="main-player-section">
      <div class="player-container">
        <div class="player-content" id="player-content">
          <div class="art" id="art">
            <span class="hint"></span>
          </div>
          <div class="current-track-info">
            <div class="title" id="title"></div>
            <div class="creator" id="creator"></div>
          </div>
          <div class="controls">
            <button id="shuffle-favorites-btn" class="shuffle-favorites-btn">⇄</button>
            <button id="prev-btn" class="prev-btn" aria-label="Anterior">⏮</button>
            <button id="play-btn" class="play-btn" aria-label="Reproducir/Pausar">▶</button>
            <button id="next-btn" class="next-btn" aria-label="Siguiente">⏭</button>
            <button id="favorite-btn" class="favorite-btn" aria-label="Favorito">🩶</button>
            <div class="adaptive-quality-indicator" id="quality-indicator" title="Calidad adaptativa">
              <span id="quality-text">auto</span>
            </div>
          </div>
          <div id="play-all-favorites-btn" class="favorites-label">▶❤️</div>
          <div class="progress-section">
            <div class="progress-bar" id="progress-bar">
              <span class="current-time" id="current-time">0:00</span>
              <div class="progress" id="progress"></div>
              <span class="total-time" id="total-time">0:00</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <audio id="audio" crossorigin="anonymous" preload="metadata"></audio>
  <footer class="footer">
    <div>&copy; 2025 Resonate Player</div>
    <div>Todos los derechos reservados. Prohibida la reproducción total o parcial sin autorización</div>
  </footer>
  <div id="status-messages"></div>
  <script src="js/resonate.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then((registration) => {
          console.log('Service Worker registrado:', registration);

          // Verificar actualizaciones cada 60 segundos
          setInterval(() => {
            registration.update();
          }, 60000);

          // Notificar cuando hay una nueva versión disponible
          registration.addEventListener('updatefound', () => {
            const newWorker = registration.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'activated') {
                // Mostrar notificación de actualización
                if (confirm('Nueva versión disponible. ¿Deseas actualizar?')) {
                  window.location.reload();
                }
              }
            });
          });
        })
        .catch((error) => {
          console.error('Error al registrar Service Worker:', error);
        });
    }
  </script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BM0DX9WY1D"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-BM0DX9WY1D');
  </script>
</body>

</html>
