<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Resonate</title>
  <meta name="application-name" content="Resonate">
  <meta name="resonate-version" content="17">
  <meta name="description" content="Enjoy content freely from https://archive.org">
  <meta name="keywords" content="Resonate, player, music, free, online, offline, PWA">
  <meta name="robots" content="index, follow">
  <meta name="author" content="Juan Cabeza">
  <meta name="copyright" content="2026 Resonate">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Resonate">
  <meta property="og:description" content="Enjoy content freely from https://archive.org">
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:title" content="Resonate">
  <meta property="twitter:description" content="Enjoy content freely from https://archive.org">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" id="meta-theme-color" content="#3da9ff">
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
  <link rel="apple-touch-icon" href="/icons/maskable_icon_x192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Resonate">
  <meta name="cast-app-id" content="855FC5BE" data-allow-production="true">
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://archive.org" crossorigin>
  <link rel="preload" href="css/resonate-bundle.css" as="style" />
  <link rel="stylesheet" href="css/resonate-bundle.css" />
</head>
<body>
  <div class="app" id="app" data-nosnippet>
    <a class="skip-link" href="#content-layout">Skip to main content</a>
    <header id="app-header">
      <h1 id="app-title">
        <button id="app-title-action" class="app-title-action" type="button">
          <span class="app-logo" aria-hidden="true">
            <svg class="app-logo-svg" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
              <circle cx="256" cy="256" r="200" stroke="currentColor" stroke-width="32" fill="none"/>
              <path d="M96 256 C140 256, 180 180, 220 180 C260 180, 300 332, 340 332 C380 332, 416 256, 416 256" stroke="currentColor" stroke-width="32" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="app-title-text">Resonate</span>
        </button>
      </h1>
      <!-- Global app menu trigger; player-specific actions live near the track info block -->
      <nav class="header-controls" aria-label="Header actions">
        <button id="header-resontes-btn" class="header-resontes-btn" type="button"
                aria-label="View resonates (0 saved)" aria-expanded="false"
                aria-controls="resontes-list" title="My Resonates">
          <span class="header-resontes-icon" aria-hidden="true">
            <svg class="header-resontes-svg" viewBox="0 0 512 512" aria-hidden="true" focusable="false">
              <use href="/icons/sprite.svg?v=2#resonate-icon"></use>
            </svg>
          </span>
          <span class="header-resontes-count" id="header-resontes-count" aria-hidden="true">0</span>
        </button>
        <button class="app-menu-btn" id="app-menu-btn" type="button"
                aria-label="Open app menu" aria-expanded="false"
                aria-controls="app-options-sheet"
                title="App menu"
                data-sheet-target="app-options-sheet">
          <span class="menu-trigger-icon" aria-hidden="true">
            <svg class="menu-trigger-svg" viewBox="0 0 24 24" focusable="false" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </span>
        </button>
      </nav>
    </header>

    <!-- Archive.org maintenance banner — shown by archive-monitor.js when archive.org is unreachable -->
    <div id="archive-maintenance-banner"
         class="archive-maintenance-banner"
         role="alert"
         aria-live="assertive"
         aria-atomic="true"
         hidden>
      <div class="archive-banner-inner">
        <div class="archive-banner-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        </div>
        <div class="archive-banner-body">
          <p class="archive-banner-title">archive.org is temporarily unavailable</p>
          <p class="archive-banner-subtitle">We're monitoring the service and will notify you when it's back online.</p>
          <p class="archive-banner-notice" hidden aria-live="polite"></p>
        </div>
        <div class="archive-banner-actions">
          <button class="archive-banner-play-btn" type="button" disabled
                  aria-label="Play a random cached track from your resonates">
            <span class="archive-banner-play-icon" aria-hidden="true">&#9654;</span>
            <span class="archive-banner-play-label">
              Play from cache<br>
              <small class="archive-banner-cache-count">Loading…</small>
            </span>
          </button>
          <button class="archive-banner-retry-btn" type="button"
                  aria-label="Check if archive.org is back online">Check again</button>
          <button class="archive-banner-dismiss-btn" type="button"
                  aria-label="Dismiss this notification">✕</button>
        </div>
      </div>
    </div>

    <main class="content-layout" id="content-layout" tabindex="-1">
      <div class="discovery-section">
        <div id="tracks-list-container" class="tracks-container tracklist"></div>

        <div class="search-section">
          <div class="search-container">
            <div class="search-input-wrapper">
              <span class="search-input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
              </span>
              <input id="search-input"
                class="search-input"
                type="search"
                placeholder="Search for songs, artists, albums..."
                aria-label="Search for songs, artists, albums"
                autocomplete="off"
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
                inputmode="search"
                enterkeyhint="search">
            </div>
            <button id="search-clear" class="search-clear-btn" type="button" aria-label="Clear search" title="Clear" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
          <div id="search-results" class="search-results panel-overlay">
            <div id="search-results-header" class="search-results-header panel-header" hidden>
              <div class="search-results-summary" aria-live="polite">
                <span id="search-results-count">Results:</span>
              </div>
              <div class="search-results-controls" aria-label="Search results controls">
                <div id="search-type-filters" class="filter-pills" aria-label="Filter by type"></div>
                <button id="search-results-close" class="search-control-btn" type="button" title="Close" aria-label="Close search results">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                  </svg>
                </button>
              </div>
            </div>
            <div id="search-results-list" class="search-results-list content-list" role="list" aria-label="Search results"></div>
          </div>
        </div>
      </div>
      <div id="resontes-list" class="resontes-list" role="region" aria-label="Resonates">
        <div class="resontes-filter-bar" aria-label="Resonates filter">
          <div class="search-container">
            <div class="search-input-wrapper">
              <span class="search-input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
              </span>
              <input id="resontes-filter" class="search-input" type="search" placeholder="Filter resonates" aria-label="Filter resonates" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="search" enterkeyhint="search">
            </div>
            <button id="resontes-clear" class="search-clear-btn" type="button" aria-label="Clear filter" title="Clear" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>
        <div class="resontes-panel-inner" role="presentation">
          <div id="resontes-header" class="search-results-header resontes-results-header panel-header" hidden>
            <div class="search-results-summary" aria-live="polite">
              <span id="resontes-count-label">Resonates</span>
            </div>
            <div class="search-results-controls" aria-label="Resonates controls">
              <div id="resontes-type-filters" class="filter-pills" aria-label="Filter by type"></div>
              <button id="resontes-close" class="search-control-btn" type="button" title="Close" aria-label="Close resonates panel">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>
          </div>
          <div id="resontes-list-content" class="resontes-list-content content-list" role="list" aria-label="Resonates list"></div>
        </div>
      </div>

      <!-- ============================================================
           PLAYLISTS PANEL
           ============================================================ -->
      <div id="playlists-list" class="playlists-list" role="region" aria-label="Playlists">
        <div class="playlists-panel-header">
          <span class="playlists-panel-title">Playlists</span>
          <div class="playlists-panel-actions">
            <button id="playlists-import-btn" class="playlists-import-btn" type="button"
                    aria-label="Import playlist from Grayjay JSON">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" width="16" height="16">
                <path d="M12 3v13"/><path d="M8 13l4 4 4-4"/><path d="M5 19h14"/>
              </svg>
              Import
            </button>
            <button id="playlists-new-btn" class="playlists-new-btn" type="button"
                    aria-label="Create new playlist">
              + New
            </button>
            <button id="playlists-close-btn" class="playlists-panel-close-btn" type="button"
                    aria-label="Close playlists panel">&#x2715;</button>
          </div>
        </div>
        <div id="playlists-panel-body" class="playlists-panel-body" role="list" aria-label="Playlists list"></div>
      </div>
      <!-- Hidden file input for Grayjay import -->
      <input type="file" id="playlist-import-input" accept=".json" hidden aria-hidden="true">

      <div class="main-player-section">
      <div class="player-container">
        <div class="player-content" id="player-content">
          <div class="art" id="art">
            <span class="hint"></span>
          </div>
          <div class="current-track-info">
            <div class="title-share-container">
              <div class="title" id="title"></div>
            </div>
            <div class="creator" id="creator"></div>
            <div id="description-container">
              <span id="player-menu-btn" class="icon-control player-menu-btn" role="button" tabindex="0"
                    aria-label="More track options" aria-expanded="false"
                    aria-controls="player-options-sheet"
                    data-sheet-target="player-options-sheet">
                <span class="btn-icon" aria-hidden="true">
                  <svg class="btn-svg" viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                    <circle cx="6" cy="12" r="1.75" fill="currentColor" stroke="none"></circle>
                    <circle cx="12" cy="12" r="1.75" fill="currentColor" stroke="none"></circle>
                    <circle cx="18" cy="12" r="1.75" fill="currentColor" stroke="none"></circle>
                  </svg>
                </span>
              </span>
            </div>
          </div>
          <div class="progress-section">
            <div class="progress-bar" 
                 id="progress-bar"
                 role="slider"
                 aria-label="Playback position"
                 aria-valuemin="0"
                 aria-valuemax="100"
                 aria-valuenow="0"
                 aria-valuetext="0 segundos de 0 segundos"
                 tabindex="0">
              <span class="current-time" id="current-time">0:00</span>
              <div class="progress-buffered" id="progress-buffered"></div>
              <div class="progress" id="progress"></div>
              <div class="progress-tooltip" id="progress-tooltip">0:00</div>
              <span class="total-time" id="total-time">0:00</span>
            </div>
          </div>
          <div class="controls">
            <button id="shuffle-favorites-btn" class="shuffle-favorites-btn" aria-label="Shuffle" title="Shuffle">
              <svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="M16 3h5v5"/>
                <path d="M4 20L21 3"/>
                <path d="M21 16v5h-5"/>
                <path d="M15 15l6 6"/>
              </svg>
            </button>
            <button id="prev-btn" class="prev-btn" aria-label="Previous">
              <svg class="control-icon" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true" focusable="false">
                <polygon points="19,20 9,12 19,4"/>
                <rect x="5" y="4" width="2.5" height="16" rx="1"/>
              </svg>
            </button>
            <button id="play-btn" class="play-btn" aria-label="Play" data-state="play">
              <span class="transport-icon" aria-hidden="true"></span>
            </button>
            <button id="next-btn" class="next-btn" aria-label="Next">
              <svg class="control-icon" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true" focusable="false">
                <polygon points="5,4 15,12 5,20"/>
                <rect x="16.5" y="4" width="2.5" height="16" rx="1"/>
              </svg>
            </button>
            <button id="favorite-btn" class="additional-btn" aria-label="Add to resonates" title="Add to resonates"></button>
          </div>
        </div>
      </div>

      <!-- ============================================================
           BOTTOM SHEET OVERLAY — backdrop for the secondary options menu
           ============================================================ -->
      <div class="bottom-sheet-overlay" id="bottom-sheet-overlay" aria-hidden="true"></div>

      <!-- ============================================================
           CARD CONTEXT MENU SHEET — opened programmatically by the More (⋯)
           button on search result and resonates cards.
           ============================================================ -->
      <div class="bottom-sheet" id="card-context-sheet"
           role="dialog" aria-modal="true" aria-label="Track options" aria-hidden="true">

        <div class="sheet-drag-handle" aria-hidden="true"></div>

        <div class="sheet-header">
          <span class="sheet-title" id="card-context-title">Options</span>
          <span class="sheet-subtitle" id="card-context-subtitle"></span>
        </div>

        <div class="sheet-content">

          <button id="card-ctx-play" class="sheet-action-item" type="button"
                  data-close-sheet-on-activate="true">
            <span class="sheet-item-icon" aria-hidden="true">
              <svg class="sheet-item-svg" viewBox="0 0 24 24" fill="currentColor" stroke="none"
                   focusable="false" aria-hidden="true">
                <polygon points="5,3 19,12 5,21"></polygon>
              </svg>
            </span>
            <span class="sheet-item-label" id="card-ctx-play-label">Play</span>
          </button>

          <button id="card-ctx-resonate" class="sheet-action-item" type="button"
                  data-close-sheet-on-activate="true">
            <span class="sheet-item-icon" aria-hidden="true">
              <svg class="resonate-icon sheet-item-svg" viewBox="0 0 512 512" fill="none"
                   focusable="false" aria-hidden="true">
                <use href="/icons/sprite.svg?v=2#resonate-icon"></use>
              </svg>
            </span>
            <span class="sheet-item-label" id="card-ctx-resonate-label">Add to Resonates</span>
          </button>

          <button id="card-ctx-tracks" class="sheet-action-item" type="button"
                  data-close-sheet-on-activate="true" hidden>
            <span class="sheet-item-icon" aria-hidden="true">
              <svg class="sheet-item-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                   focusable="false" aria-hidden="true">
                <use href="/icons/sprite.svg?v=2#tracks-icon"></use>
              </svg>
            </span>
            <span class="sheet-item-label">Show Tracks</span>
          </button>

          <button id="card-ctx-share" class="sheet-action-item" type="button"
                  data-close-sheet-on-activate="true">
            <span class="sheet-item-icon" aria-hidden="true">
              <svg class="sheet-item-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                   focusable="false" aria-hidden="true">
                <path d="M12 3v10"></path>
                <path d="M8 7l4-4 4 4"></path>
                <path d="M5 11v7a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-7"></path>
              </svg>
            </span>
            <span class="sheet-item-label">Share</span>
          </button>

        </div>

        <div class="sheet-footer">
          <button class="sheet-cancel-btn" type="button">Close</button>
        </div>

      </div><!-- /#card-context-sheet -->

      <!-- ============================================================
           APP MENU SHEET — app-level actions triggered from the header
           Existing element IDs are preserved so current JS integrations
           (theme.js, ui.js, initialization.js) continue to work.
           ============================================================ -->
      <div class="bottom-sheet" id="app-options-sheet"
           role="dialog" aria-modal="true" aria-label="App menu" aria-hidden="true">

        <div class="sheet-drag-handle" aria-hidden="true"></div>

        <div class="sheet-header">
          <span class="sheet-title">App Menu</span>
        </div>

        <div class="sheet-content">

            <button id="resontes-toggle" class="theme-selector resontes-toggle sheet-action-item"
                  type="button" aria-label="View resonates"
              aria-expanded="false" aria-controls="resontes-list" aria-live="polite"
              data-close-sheet-on-activate="true">
            <span class="sheet-item-icon resontes-icon" aria-hidden="true">
              <svg class="resonate-icon sheet-item-svg" viewBox="0 0 512 512" aria-hidden="true" focusable="false">
                <use href="/icons/sprite.svg?v=2#resonate-icon"></use>
              </svg>
            </span>
            <span class="resontes-label">Resonates</span>
            <span class="resontes-count" id="resontes-count">0</span>
          </button>

          <button id="playlists-toggle" class="theme-selector playlists-toggle sheet-action-item"
                  type="button" aria-label="View playlists"
              aria-expanded="false" aria-controls="playlists-list"
              data-close-sheet-on-activate="true">
            <span class="sheet-item-icon" aria-hidden="true">
              <svg class="sheet-item-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <line x1="8" y1="6" x2="21" y2="6"/>
                <line x1="8" y1="12" x2="21" y2="12"/>
                <line x1="8" y1="18" x2="21" y2="18"/>
                <polyline points="3 6 4 7 6 4"/>
                <polyline points="3 12 4 13 6 10"/>
                <polyline points="3 18 4 19 6 16"/>
              </svg>
            </span>
            <span class="sheet-item-label">Playlists</span>
            <span class="playlists-count" id="playlists-count"></span>
          </button>

          <button id="theme-toggle" class="theme-selector sheet-action-item" type="button"
                  aria-label="Theme toggle" aria-current="page">
            <span class="sheet-item-icon theme-icon" aria-hidden="true">
              <svg class="sheet-item-svg theme-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <use href="/icons/sprite.svg?v=2#theme-moon"></use>
              </svg>
            </span>
            <span class="sheet-item-label">Brightness</span>
            <span class="theme-label" aria-hidden="true">Eco</span>
          </button>

        </div>

        <div class="sheet-footer">
          <button class="sheet-cancel-btn" type="button">Close</button>
        </div>

      </div><!-- /#app-options-sheet -->

      <!-- ============================================================
           PLAYER MENU SHEET — contextual track actions triggered from the
           track information block.
           ============================================================ -->
      <div class="bottom-sheet" id="player-options-sheet"
           role="dialog" aria-modal="true" aria-label="Track options" aria-hidden="true">

        <div class="sheet-drag-handle" aria-hidden="true"></div>

        <div class="sheet-header">
          <span class="sheet-title">Track Options</span>
        </div>

        <div class="sheet-content">

            <button id="toggle-description-btn" class="sheet-action-item" type="button"
              data-close-sheet-on-activate="true"
              aria-label="Show track description" style="display:none">
            <span class="sheet-item-icon" aria-hidden="true">
              <svg class="sheet-item-svg" viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                <use href="/icons/sprite.svg?v=2#info-icon"></use>
              </svg>
            </span>
            <span class="sheet-item-label">Track info</span>
          </button>

          <button id="toggle-tracks-btn" class="sheet-action-item" type="button"
              data-close-sheet-on-activate="true"
              aria-label="Show album tracks" style="display:none">
            <span class="sheet-item-icon" aria-hidden="true">
              <svg class="sheet-item-svg" viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                <use href="/icons/sprite.svg?v=2#tracks-icon"></use>
              </svg>
            </span>
            <span class="sheet-item-label">Album tracks</span>
          </button>

            <button id="current-track-cast" class="theme-selector sheet-action-item" type="button"
              data-close-sheet-on-activate="true"
                  aria-label="Cast current track">
            <span class="sheet-item-icon header-icon" aria-hidden="true">
              <svg class="header-svg sheet-item-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"
                   fill="none" stroke="currentColor" stroke-width="1.8"
                   stroke-linecap="round" stroke-linejoin="round">
                <rect x="13" y="4" width="8" height="6" rx="1" />
                <path d="M2 18a4 4 0 0 1 4 4" />
                <path d="M2 14a8 8 0 0 1 8 8" />
                <path d="M2 10a12 12 0 0 1 12 12" />
              </svg>
            </span>
            <span class="sheet-item-label">Cast to device</span>
            <span class="cast-badge" aria-hidden="true">!</span>
          </button>

              <span id="current-track-share" class="theme-selector sheet-action-item"
