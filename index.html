<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Resonate Player</title>
  <meta name="application-name" content="Resonate Player">
  <meta name="description"content="Disfruta contenido libremente desde https://archive.org">
  <meta name="keywords" content="Resonate, player, reproductor, multimedia, música, gratis, online, offline, PWA">
  <meta name="robots" content="index, follow">
  <meta name="author" content="Juan Cabeza">
  <meta name="copyright" content="2025 Resonate Player">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.resonateplayer.com">
  <meta property="og:title" content="Resonate Player">
  <meta property="og:description" content="Disfruta contenido libremente desde https://archive.org">
  <meta property="og:image" content="https://www.resonateplayer.com/icons/maskable_icon_x512.png">
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://www.resonateplayer.com">
  <meta property="twitter:title" content="Resonate Player">
  <meta property="twitter:description" content="Disfruta contenido libremente desde https://archive.org">
  <meta property="twitter:image" content="https://www.resonateplayer.com/icons/maskable_icon_x512.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
  <link rel="apple-touch-icon" href="icons/maskable_icon_x192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Resonate Player">
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/resonate.css" />
</head>
<body>
  <div class="app" id="app">
    <header>
      <h1>
        <a href="https://www.resonateplayer.com" style="text-decoration: none; color: inherit;">&nbsp;Resonate</a>
      </h1>
      <div class="stage">&nbsp;&nbsp;Early stage</div>
    </header>
    <div class="discovery-section">
      <div class="search-section">
        <div class="search-container">
          <input type="text" id="search-input" class="search-input" placeholder="Buscar pistas">
          <div class="favorites-section">
            <div class="favorites-header">
              <button id="favorites-toggle" class="favorites-toggle" aria-label="Ver lista de favoritos">
                <span class="favorites-icon">❤️</span>
                <span class="favorites-count" id="favorites-count">(0)</span>
              </button>
            </div>
          </div>
        </div>
        <div id="search-results" class="search-results">
          <div id="search-loader" class="search-loader" style="display: none;">
            <div class="loader"></div>
            <span class="loader-text">Buscando...</span>
          </div>
          <div id="search-results-list" class="search-results-list"></div>
        </div>
      </div>
    </div>
    <div id="favorites-list" class="favorites-list"></div>
    <div class="main-player-section">
      <div class="player-container">
        <div class="player-content" id="player-content">
            <div class="art" id="art">
            <span class="hint"></span>
          </div>
          <div class="current-track-info">
            <div class="title" id="title"></div>
            <div class="creator" id="creator"></div>
            <div id="status-messages"></div>
          </div>
          <div class="progress-section">
            <div class="progress-bar" id="progress-bar">
              <span class="current-time" id="current-time">0:00</span>
              <div class="progress" id="progress"></div>
              <span class="total-time" id="total-time">0:00</span>
            </div>
          </div>
          <div class="controls">
            <button id="shuffle-favorites-btn" class="shuffle-favorites-btn">⇄</button>
            <button id="prev-btn" class="prev-btn" aria-label="Anterior">⏮</button>
            <button id="play-btn" class="play-btn" aria-label="Reproducir/Pausar">▶</button>
            <button id="next-btn" class="next-btn" aria-label="Siguiente">⏭</button>
          </div>
          <div class="controls">
            <button id="current-track-share" class="additional-btn" title="Compartir pista actual">🔗</button>
            <button id="favorite-btn" class="additional-btn" aria-label="Favorito">🩶</button>
          </div>
        </div>
      </div>
    </div>
    <footer class="footer">
      <div class="contact-section">
        <a href="https://wa.me/573126907942" target="_blank" aria-label="WhatsApp" style="color: #25d366; text-decoration: none;">&nbspWhatsApp</a><a href="#" aria-label="Donar" style="color: var(--accent-alt); text-decoration: none;">&nbspDonar</a>
      </div>
      <div style="font-weight: bold;">&copy; 2025 Resonate Player - Early Stage</div>
      <div>Todos los derechos reservados.</div>
    </footer>
  </div>
  <div id="donation-tooltip" class="donation-tooltip">
    <div class="tooltip-content">
      <button class="tooltip-close" aria-label="Cerrar">×</button>
      <h3>Apoya donando a Resonate</h3>
      <p>Escanea el código QR para donar desde Nequi (solo Colombia)</p>
      <img src="utils/nequi-qr.jpeg" alt="QR para donar desde Nequi" class="qr-code">
      <button class="download-qr-btn"><a href="utils/nequi-qr.jpeg" style="text-decoration: none;">Descargar QR</a></button>
    </div>
  </div> 
  <audio id="audio" preload="metadata"></audio>  
  <script src="js/logger.js"></script>
  <script src="js/cache.js"></script>
  <script src="js/playback.js"></script>
  <script src="js/search.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/offline.js"></script>
  <script src="js/initialization.js"></script>
  <script src="js/donation-tooltip.js" defer></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BM0DX9WY1D"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-BM0DX9WY1D');
    </script>    
  </body>
</html>
