<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
  <link rel="apple-touch-icon" href="icons/maskable_icon_x192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Resonate Player">
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/resonate.css" />
</head>
<body>
  <div class="app" id="app">
    <header>
      <h1>
        <a href="https://www.resonateplayer.com" style="text-decoration: none; color: inherit;">&nbsp;Resonate</a>
      </h1>
      <div id="favorites-toggle" aria-label="See your favorites list">
        <span class="favorites-icon">❤️</span>
        <span class="favorites-count" id="favorites-count">(0)</span>
      </div>
    </header>
    <div class="discovery-section">
      <div class="search-section">
        <div class="search-container">
          <input type="text" id="search-input" class="search-input" placeholder="Search">
        </div>
        <div id="search-results" class="search-results">
          <div id="search-loader" class="search-loader" style="display: none;">
            <div class="loader"></div>
            <span class="loader-text">Searching...</span>
          </div>
          <div id="search-results-list" class="search-results-list"></div>
        </div>
      </div>
    </div>
    <div id="favorites-list" class="favorites-list"></div>
    <div class="main-player-section">
      <div class="player-container">
        <div class="player-content" id="player-content">
            <div class="art" id="art">
            <span class="hint"></span>
          </div>
          <div class="current-track-info">
            <div class="title" id="title"></div>
            <div class="creator" id="creator"></div>
            <span id="current-track-share" title="Share">🔗</span>
            <div id="status-messages"></div>
          </div>
          <div class="progress-section">
            <div class="progress-bar" id="progress-bar">
              <span class="current-time" id="current-time">0:00</span>
              <div class="progress" id="progress"></div>
              <span class="total-time" id="total-time">0:00</span>
            </div>
          </div>
          <div class="controls">
            <button id="shuffle-favorites-btn" class="shuffle-favorites-btn">⇄</button>
            <button id="favorite-btn" class="additional-btn" aria-label="Favorite">🩶</button>
            <button id="play-btn" class="play-btn" aria-label="Play/Pause">▶</button>
            <button id="next-btn" class="next-btn" aria-label="Next">⏭</button>
          </div>
        </div>
      </div>
    </div>
    <footer class="footer">
      <div>&copy; 2025 Resonate Player - Early Stage - All rights reserved.</div>
      <div class="contact-section">
        <a href="https://wa.me/573126907942" target="_blank" aria-label="Contact" style="color: #25d366; text-decoration: none;">&nbspWhatsApp</a>
      </div>
    </footer>
  </div>
  <audio id="audio" preload="metadata"></audio>  
  <script src="js/logger.js"></script>
  <script src="js/cache.js"></script>
  <script src="js/playback.js"></script>
  <script src="js/search.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/offline.js"></script>
  <script src="js/initialization.js"></script>
  <script src="js/donation-tooltip.js" defer></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BM0DX9WY1D"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-BM0DX9WY1D');
    </script>    
  </body>
</html>
