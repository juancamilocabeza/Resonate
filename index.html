<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Resonate Player</title>
  <meta name="description"
    content="Reproductor multimedia, que te permite descubrir y disfrutar contenidos libre y privada">
  <meta name="keywords" content="Resonate, reproductor multimedia, online, PWA, gratis, offline">
  <meta name="robots" content="index, follow">
  <meta name="author" content="Juan Cabeza">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="icons/favicon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="msapplication-TileColor" content="#000000">
  <link rel="stylesheet" href="css/resonate.css" />
  <link rel="manifest" href="manifest.json" />
</head>

<body>
  <header>
    <h1><img src="icons/favicon.svg" height="20px">&nbsp;Resonate</h1>
  </header>
  <div class="app" id="app">
    <div class="favorites-section">
      <div class="favorites-header">
        <button id="favorites-toggle" class="favorites-toggle">Ver favoritos ❤️</button>
      </div>
      <div id="favorites-list" class="favorites-list"></div>
    </div>
    <div class="search-section">
      <div class="search-container">
        <input type="text" id="search-input" class="search-input" placeholder="Buscar ">
      </div>
    </div>
    <div id="search-results" class="search-results">
      <div id="search-results-list" class="search-results-list"></div>
    </div>
    <div class="player-container">
      <div class="player-content" id="player-content">
        <div class="art" id="art">
          <span class="hint"></span>
        </div>
        <div class="current-track-info">
          <div class="title" id="title"></div>
          <div class="creator" id="creator"></div>
          <div class="description-container">
            <div class="description" id="description" style="display: none"></div>
          </div>
        </div>
        <div class="controls">
          <button id="prev-btn" class="prev-btn" aria-label="Anterior">⏮</button>
          <button id="play-btn" class="play-btn" aria-label="Reproducir/Pausar">▶</button>
          <button id="next-btn" class="next-btn" aria-label="Siguiente">⏭</button>
          <button id="favorite-btn" class="favorite-btn" aria-label="Favorito">🩶</button>
          <button id="shuffle-favorites-btn" class="shuffle-favorites-btn">⇄</button>
        </div>
        <div class="progress-section">
          <div class="progress-bar" id="progress-bar">
            <div class="progress" id="progress"></div>
          </div>
          <div class="time-controls">
            <span class="current-time" id="current-time">0:00</span>
            <span class="total-time" id="total-time">0:00</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <audio id="audio" crossorigin="anonymous" preload="metadata"></audio>
  <footer class="footer">
    <div>&copy; 2025 Resonate Player. Todos los derechos reservados</div>
    <div>Prohibida la reproducción total o parcial sin autorización</div>
  </footer>
  <div id="status-messages"></div>
  <script src="js/resonate.js"></script>
  
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then((registration) => {
          console.log('Service Worker registrado:', registration);

          // Verificar actualizaciones cada 60 segundos
          setInterval(() => {
            registration.update();
          }, 60000);

          // Notificar cuando hay una nueva versión disponible
          registration.addEventListener('updatefound', () => {
            const newWorker = registration.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'activated') {
                // Mostrar notificación de actualización
                if (confirm('Nueva versión disponible. ¿Deseas actualizar?')) {
                  window.location.reload();
                }
              }
            });
          });
        })
        .catch((error) => {
          console.error('Error al registrar Service Worker:', error);
        });
    }
  </script>
</body>

</html>
