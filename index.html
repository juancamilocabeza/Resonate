<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Resonate Player</title>
  <meta name="application-name" content="Resonate Player">
  <meta name="resonate-version" content="17">
  <meta name="description" content="Enjoy content freely from https://archive.org">
  <meta name="keywords" content="Resonate, player, music, free, online, offline, PWA">
  <meta name="robots" content="index, follow">
  <meta name="author" content="Juan Cabeza">
  <meta name="copyright" content="2026 Resonate Player">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Resonate Player">
  <meta property="og:description" content="Enjoy content freely from https://archive.org">
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:title" content="Resonate Player">
  <meta property="twitter:description" content="Enjoy content freely from https://archive.org">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" id="meta-theme-color" content="#3da9ff">
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
  <link rel="apple-touch-icon" href="/icons/maskable_icon_x192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Resonate Player">
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="css/resonate.css" />
</head>
<body>
  <div class="app" id="app" data-nosnippet>
    <header>
      <h1 id="app-title">
        Resonate
      </h1>
      <div class="header-controls">
        <button id="theme-toggle" class="theme-selector" type="button" aria-label="Theme toggle" aria-current="page" title="Switch theme">
          Eco
        </button>
        <button id="resontes-toggle" class="theme-selector resontes-toggle" type="button" aria-label="View resonates" aria-expanded="false" aria-controls="resontes-list" aria-live="polite" title="Click to view your saved resonates">
          <span class="resontes-icon"><svg class="resonate-icon" viewBox="0 0 512 512" aria-hidden="true" focusable="false"><use href="/icons/sprite.svg#resonate-icon"></use></svg></span>
          <span class="resontes-count" id="resontes-count">0</span>
        </button>
        <span id="current-track-share" class="theme-selector" role="button" tabindex="0" aria-label="Share current track" title="Share this track">🔗</span>
      </div>
    </header>
    <div class="content-layout" id="content-layout">
      <div class="discovery-section">
        <div class="search-section">
          <div class="search-container">
          <input
            type="search"
            id="search-input"
            class="search-input"
            placeholder="Discover something new to play"
            aria-label="Discover something new to play"
            autocomplete="off"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            inputmode="search"
            enterkeyhint="search">
          <button id="search-clear" class="search-clear-btn" type="button" aria-label="Clear search" title="Clear" hidden>✕</button>
          </div>
          <div id="search-results" class="search-results">
            <div id="search-results-header" class="search-results-header" hidden>
              <div class="search-results-summary" aria-live="polite">
                <span id="search-results-count">Results:</span>
              </div>
              <div class="search-results-controls" aria-label="Search results controls">
                <button id="search-results-close" class="search-clear-btn search-results-close-btn" type="button" title="Close">✕</button>
              </div>
            </div>
            <div id="search-results-list" class="search-results-list" role="list" aria-label="Search results"></div>
          </div>
        </div>
      </div>
      <div id="resontes-list" class="resontes-list" role="region" aria-label="Resonates">
        <div class="resontes-filter-bar" aria-label="Resonates filter">
          <div class="search-container">
            <input id="resontes-filter" class="search-input" type="search" placeholder="Filter resonates" aria-label="Filter resonates" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="search" enterkeyhint="search">
            <button id="resontes-clear" class="search-clear-btn" type="button" aria-label="Clear filter" title="Clear" hidden>✕</button>
          </div>
        </div>
        <div class="resontes-panel-inner" role="presentation">
          <div id="resontes-header" class="search-results-header resontes-results-header" hidden>
            <div class="search-results-summary" aria-live="polite">
              <span id="resontes-count-label">Resonates</span>
            </div>
            <div class="search-results-controls" aria-label="Resonates controls">
              <button id="resontes-close" class="search-control-btn" type="button" title="Close">✕</button>
            </div>
          </div>
          <div id="resontes-list-content" class="resontes-list-content" role="list" aria-label="Resonates list"></div>
        </div>
      </div>
      <div class="main-player-section">
      <div class="player-container">
        <div class="player-content" id="player-content">
          <div class="art" id="art">
            <span class="hint"></span>
          </div>
          <div class="current-track-info">
            <div class="title-share-container">
              <div class="title" id="title"></div>
            </div>
            <div class="creator" id="creator"></div>
            <div id="description-container">
              <button id="toggle-description-btn" class="btn-secondary" type="button" aria-label="Show track description" title="Show description">Info</button>
              <button id="toggle-tracks-btn" class="btn-secondary" type="button" aria-label="Show album tracks" title="Show tracks">Tracks</button>
              <div id="tracks-list-container" class="tracks-container"></div>
            </div>
          </div>
          <div class="progress-section">
            <div class="progress-bar" id="progress-bar">
              <span class="current-time" id="current-time">0:00</span>
              <div class="progress" id="progress"></div>
              <span class="total-time" id="total-time">0:00</span>
            </div>
          </div>
          <div class="controls">
            <button id="shuffle-favorites-btn" class="shuffle-favorites-btn" aria-label="Shuffle" title="Shuffle">⇄</button>
            <button id="prev-btn" class="prev-btn" aria-label="Previous">⏮</button>
            <button id="play-btn" class="play-btn" aria-label="Play/Pause">▶</button>
            <button id="next-btn" class="next-btn" aria-label="Next">⏭</button>
            <button id="favorite-btn" class="additional-btn" aria-label="Add to resonates" title="Add to resonates"></button>
          </div>
        </div>
      </div>
      <div id="description-modal" class="description-modal">
        <div class="description-modal-content">
          <button id="close-description-modal" class="close-description-modal" aria-label="Close description">X</button>
          <div id="modal-description" class="modal-description"></div>
        </div>
      </div>
    </div>
    </div>
    <footer class="footer">
      &copy; 2026 Resonate Player - Early Stage - All rights reserved.
    </footer>
  </div>
  <audio id="audio" preload="metadata"></audio>
  <script>
    // Production console silencer (early, before any app scripts).
    // Debug can be explicitly enabled with ?debug=true or ?log=DEBUG (or localStorage overrides).
    (function () {
      try {
        var loc = window.location;
        var isDev =
          loc.protocol === 'file:' ||
          loc.hostname === 'localhost' ||
          loc.hostname === '127.0.0.1' ||
          (loc.hostname && loc.hostname.indexOf('dev.') !== -1) ||
          loc.port === '3000' ||
          loc.port === '8080' ||
          (loc.hash && loc.hash.indexOf('#dev') !== -1);

        var params = null;
        try { params = new URLSearchParams(loc.search || ''); } catch (e) { params = null; }
        var debugParam = params ? params.get('debug') : null;
        var logParam = params ? params.get('log') : null;

        var storedDebug = null;
        var storedLevel = null;
        try { storedDebug = localStorage.getItem('resonate_debug'); } catch (e) {}
        try { storedLevel = localStorage.getItem('resonate_log_level'); } catch (e) {}

        var isTruthy = function (v) {
          v = String(v || '').trim().toLowerCase();
          return v === '1' || v === 'true' || v === 'yes' || v === 'on';
        };

        var debugEnabled =
          isTruthy(debugParam) ||
          isTruthy(storedDebug) ||
          (typeof logParam === 'string' && logParam.length > 0) ||
          (typeof storedLevel === 'string' && storedLevel.length > 0 && String(storedLevel).toUpperCase() !== 'NONE');

        if (!isDev && !debugEnabled && window.console) {
          var c = window.console;
          if (!window.__resonate_original_console__) {
            window.__resonate_original_console__ = {
              debug: typeof c.debug === 'function' ? c.debug.bind(c) : (typeof c.log === 'function' ? c.log.bind(c) : function () {}),
              log: typeof c.log === 'function' ? c.log.bind(c) : function () {},
              info: typeof c.info === 'function' ? c.info.bind(c) : (typeof c.log === 'function' ? c.log.bind(c) : function () {}),
              warn: typeof c.warn === 'function' ? c.warn.bind(c) : (typeof c.log === 'function' ? c.log.bind(c) : function () {}),
              error: typeof c.error === 'function' ? c.error.bind(c) : (typeof c.log === 'function' ? c.log.bind(c) : function () {})
            };
          }
          var noop = function () {};
          c.debug = noop;
          c.log = noop;
          c.info = noop;
          c.warn = noop;
          c.error = noop;
        }
      } catch (e) {
        // ignore
      }
    })();
  </script>
  <script src="js/theme.js"></script>
  <script src="js/description-utils.js"></script>
  <script src="js/logger.js"></script>
  <script src="js/cover-manager.js"></script>
  <script src="js/cache.js"></script>
  <script src="js/loaders.js"></script>
  <script src="js/playback.js"></script>
  <script src="js/search.js"></script>
  <script src="js/tracklist.js"></script>
  <script src="js/ui.js" defer></script>
  <script src="js/offline.js"></script>
  <script src="js/battery.js"></script>
  <script src="js/initialization.js" defer></script>
  <script>
    if (window.location.hostname !== 'localhost' && !window.location.hostname.startsWith('127.')) {
      (function() {
        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-BM0DX9WY1D';
        document.head.appendChild(script);
      })();
      
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-BM0DX9WY1D');
    }
  </script>    
  </body>
</html>
