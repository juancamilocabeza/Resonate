<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Resonate Player</title>
  <meta name="application-name" content="Resonate Player">
  <meta name="resonate-version" content="16">
  <meta name="description" content="Enjoy content freely from https://archive.org">
  <meta name="keywords" content="Resonate, player, music, free, online, offline, PWA">
  <meta name="robots" content="index, follow">
  <meta name="author" content="Juan Cabeza">
  <meta name="copyright" content="2025 Resonate Player">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.resonateplayer.com">
  <meta property="og:title" content="Resonate Player">
  <meta property="og:description" content="Enjoy content freely from https://archive.org">
  <meta property="og:image" content="https://www.resonateplayer.com/icons/maskable_icon_x512.png">
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://www.resonateplayer.com">
  <meta property="twitter:title" content="Resonate Player">
  <meta property="twitter:description" content="Enjoy content freely from https://archive.org">
  <meta property="twitter:image" content="https://www.resonateplayer.com/icons/maskable_icon_x512.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" id="meta-theme-color" content="#3da9ff">
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
  <link rel="apple-touch-icon" href="/icons/maskable_icon_x192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Resonate Player">
  <script>
    // Production canonicalization: keep a single install origin for the PWA.
    // This improves the odds that shared links open in the installed app.
    (function () {
      try {
        var host = String(window.location.hostname || '').toLowerCase();
        var isProdHost = host === 'resonateplayer.com' || host === 'www.resonateplayer.com';
        if (!isProdHost) return;

        var canonicalHost = 'www.resonateplayer.com';
        var needsHttps = window.location.protocol !== 'https:';
        var needsWww = host === 'resonateplayer.com';
        if (needsHttps || needsWww) {
          // If coming from apex, tag the navigation so the canonical origin can show
          // the same banner UX as a shared-link entry.
          var targetUrl = new URL('https://' + canonicalHost + window.location.pathname + window.location.search + window.location.hash);
          if (needsWww && !targetUrl.searchParams.has('src')) {
            targetUrl.searchParams.set('src', 'apex');
          }
          window.location.replace(String(targetUrl));
        }
      } catch (e) {
        // ignore
      }
    })();
  </script>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="css/resonate.css" />
</head>
<body>
  <div class="app" id="app">
    <header>
      <h1 id="app-title" style="cursor: pointer;">
        Resonate
      </h1>
      <div class="header-controls">
        <button id="theme-toggle" class="theme-selector" type="button" aria-label="Theme toggle" aria-current="page" title="Switch theme">
          Eco
        </button>
        <button id="favorites-toggle" class="theme-selector favorites-toggle" type="button" aria-label="View favorites" aria-expanded="false" aria-controls="favorites-list" aria-live="polite" title="Click to view your saved favorites">
          <span class="favorites-icon">❤️</span>
          <span class="favorites-count" id="favorites-count">0</span>
        </button>
        <span id="current-track-share" class="theme-selector" role="button" tabindex="0" aria-label="Share current track" title="Share this track">🔗</span>
      </div>
    </header>
    <div class="content-layout" id="content-layout">
      <div class="discovery-section">
        <div class="search-section">
          <div class="search-container">
          <input
            type="search"
            id="search-input"
            class="search-input"
            placeholder="Discover something new to play"
            aria-label="Discover something new to play"
            autocomplete="off"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            inputmode="search"
            enterkeyhint="search">
          <button id="search-clear" class="search-clear-btn" type="button" aria-label="Clear search" title="Clear" hidden>✕</button>
          </div>
          <div id="search-results" class="search-results">
            <div id="search-results-header" class="search-results-header" hidden>
              <div class="search-results-summary" aria-live="polite">
                <span id="search-results-count">Results</span>
              </div>
              <div class="search-results-controls" aria-label="Search results controls">
                <button id="search-results-close" class="search-control-btn" type="button" title="Close">✕</button>
              </div>
            </div>
            <div id="search-results-list" class="search-results-list" role="list" aria-label="Search results"></div>
          </div>
        </div>
      </div>
      <div id="favorites-list" class="favorites-list" role="region" aria-label="Favorites">
        <div id="favorites-header" class="favorites-results-header" hidden>
          <div class="favorites-results-summary" aria-live="polite">
            <span id="favorites-count-label">Favorites</span>
          </div>
          <div class="favorites-results-controls" aria-label="Favorites controls">
            <input id="favorites-filter" class="favorites-filter" type="search" placeholder="Filter favorites" aria-label="Filter favorites" />
            <button id="favorites-close" class="search-clear-btn" type="button" title="Close">✕</button>
          </div>
        </div>
        <div id="favorites-list-content" class="favorites-list-content" role="list" aria-label="Favorites list"></div>
      </div>
      <div class="main-player-section">
      <div class="player-container">
        <div class="player-content" id="player-content">
          <div class="art" id="art">
            <span class="hint"></span>
          </div>
          <div class="current-track-info">
            <div class="title-share-container">
              <div class="title" id="title"></div>
            </div>
            <div class="creator" id="creator"></div>
            <div id="description-container">
              <button id="toggle-description-btn" class="btn-secondary" type="button" aria-label="Show track description" title="Show description">Info</button>
            </div>
          </div>
          <div class="progress-section">
            <div class="progress-bar" id="progress-bar">
              <span class="current-time" id="current-time">0:00</span>
              <div class="progress" id="progress"></div>
              <span class="total-time" id="total-time">0:00</span>
            </div>
          </div>
          <div class="controls">
            <button id="shuffle-favorites-btn" class="shuffle-favorites-btn" aria-label="Shuffle" title="Shuffle">⇄</button>
            <button id="prev-btn" class="prev-btn" aria-label="Previous">⏮</button>
            <button id="play-btn" class="play-btn" aria-label="Play/Pause">▶</button>
            <button id="next-btn" class="next-btn" aria-label="Next">⏭</button>
            <button id="favorite-btn" class="additional-btn" aria-label="Favorite">🩶</button>
          </div>
        </div>
      </div>
      <!-- Modal para descripción -->
      <div id="description-modal" class="description-modal" style="display:none;">
        <div class="description-modal-content">
          <button id="close-description-modal" class="close-description-modal" aria-label="Close description">X</button>
          <div id="modal-description" class="modal-description"></div>
        </div>
      </div>
    </div>
    </div>
    <footer class="footer">
      &copy; 2025 Resonate Player - Early Stage - All rights reserved.
    </footer>
  </div>
  <audio id="audio" preload="metadata"></audio>
  <script src="js/theme.js"></script>
  <script src="js/description-utils.js"></script>
  <script src="js/logger.js"></script>
  <script src="js/cache.js"></script>
  <script src="js/loaders.js"></script>
  <script src="js/playback.js"></script>
  <script src="js/search.js"></script>
  <script src="js/tracklist.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/offline.js"></script>
  <script src="js/battery.js"></script>
  <script src="js/initialization.js"></script>
  <script>
    // Solo cargar Google Analytics en producción
    if (window.location.hostname !== 'localhost' && !window.location.hostname.startsWith('127.')) {
      (function() {
        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-BM0DX9WY1D';
        document.head.appendChild(script);
      })();
      
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-BM0DX9WY1D');
    }
  </script>    
  </body>
</html>
