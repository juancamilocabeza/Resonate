<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Resonate Player</title>
  <meta name="application-name" content="Resonate Player">
  <meta name="description"
    content="Resonate reproduce libremente contenido desde https://archive.org/">
  <meta name="keywords" content="Resonate, reproductor multimedia, online, PWA, gratis, offline">
  <meta name="robots" content="index, follow">
  <meta name="author" content="Juan Cabeza">
  <meta name="copyright" content="2025 Resonate Player">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
  <link rel="apple-touch-icon" href="icons/maskable_icon_x192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Resonate Player">

  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/resonate.css" />

</head>

<body>
  <header>
    <h1><a href="https://www.resonateplayer.com" style="text-decoration: none; color: inherit;">&nbsp;Resonate</a></h1>
    <!-- Search and Discovery Section -->
    <div class="stage">&nbsp;&nbsp;Early stage</div>  
  </header>


  <!-- Search and Discovery Section -->
  <div class="discovery-section">
    <div class="search-section">
      <div class="search-container">
        <input type="text" id="search-input" class="search-input" placeholder="Buscar">
      </div>
      <div id="search-results" class="search-results">
        <div id="search-results-list" class="search-results-list"></div>
      </div>
    </div>
  </div>

  <div class="app" id="app">
    <!-- Favorites Section -->
    <div class="favorites-section">
      <div class="favorites-header">
        <div id="favorites-toggle" class="favorites-label">ver ❤️</div>
      </div>
      <div id="favorites-list" class="favorites-list"></div>
    </div>
    <!-- Main Player Section -->
    <div class="main-player-section">
      <div class="player-container">
        <div class="player-content" id="player-content">
            <div class="art" id="art">
            <img src="icons/favicon.svg" alt="Ícono de Resonate" style="max-width: 192px; border-radius: 8px;">
            <span class="hint"></span>
          </div>
          <div class="current-track-info">
            <div class="title" id="title"></div>
            <div class="creator" id="creator"></div>
            <div class="creator" id="quality-text" style="display: none;">auto</div>
          </div>
          <div class="progress-section">
            <div class="progress-bar" id="progress-bar">
              <span class="current-time" id="current-time">0:00</span>
              <div class="progress" id="progress"></div>
              <span class="total-time" id="total-time">0:00</span>
            </div>
          </div>
          <div class="controls">
            <button id="shuffle-favorites-btn" class="shuffle-favorites-btn">⇄</button>
            <button id="prev-btn" class="prev-btn" aria-label="Anterior">⏮</button>
            <button id="play-btn" class="play-btn" aria-label="Reproducir/Pausar">▶</button>
            <button id="next-btn" class="next-btn" aria-label="Siguiente">⏭</button>
            <button id="favorite-btn" class="favorite-btn" aria-label="Favorito">🩶</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <audio id="audio" preload="metadata"></audio>
  <footer class="footer">
    <div style="font-weight: bold;">&copy; 2025 Resonate Player - Evolución Continua ...</div>
    <div>Todos los derechos reservados. Prohibida la reproducción total o parcial sin
      autorización</div>
  </footer>
  <div id="status-messages"></div>



  <!-- Logger JS -->
  <script src="js/logger.js"></script>

  <!-- Cache JS -->
  <script src="js/cache.js"></script>

  <!-- Playback JS -->
  <script src="js/playback.js"></script>

  <!-- Search JS -->
  <script src="js/search.js"></script>

  <!-- UI JS -->
  <script src="js/ui.js"></script>

  <!-- Initialization JS -->
  <script src="js/initialization.js"></script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BM0DX9WY1D">
  </script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-BM0DX9WY1D');
  </script>
</body>

</html>
