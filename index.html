<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="description" content="Reproductor multimedia">
    <meta name="keywords" content="HTML, CSS, JavaScript">
    <meta name="author" content="Juan Cabeza">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="keywords" content="Resonate, reproductor multimedia, música online, streaming de audio, PWA música, reproductor web, música gratis, playlists, canciones, artistas, álbumes, audio de alta calidad, música sin interrupciones, reproductor responsive, aplicación de música, música en cualquier dispositivo, música offline, experiencia musical, música digital, música interactiva, música moderna, música global, música personalizada">
    <title>Resonate</title>
    <!-- PWA Manifest -->
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000" />
    <style>
      :root {
        --bg: #000;
        --fg: #e7e9ee;
        --muted: #888;
        --accent: #6ee7b7;
        --card: #1a1a1a;
        --btn: #222;
        --error: #ff6b6b;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html, body {
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        overflow: hidden;
      }

      .app {
        display: flex;
        flex-direction: column;
        /*height: 100%;*/
        padding: 10px;
        position: relative;
        overflow: hidden;
      }

      header {
        flex-shrink: 0;
        display: flex;
        justify-content: left;
        align-items: center;
      }

      h1 {
        font-size: 20px;
        font-weight: 600;
        text-align: left;
        padding: 8px;
        color: var(--accent);
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .player-container {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
        -webkit-overflow-scrolling: touch;
      }

      .player-container::-webkit-scrollbar {
        width: 4px;
      }

      .player-container::-webkit-scrollbar-track {
        background: transparent;
      }

      .player-container::-webkit-scrollbar-thumb {
        background: var(--muted);
        border-radius: 2px;
      }

      .player-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 10px;
      }

      .app.active .player-content {
        opacity: 1;
      }

      .art {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        max-width: 280px;
        aspect-ratio: 1;
        margin: 0 auto;
        margin-top: 30px;
        border-radius: 8px;
        background: var(--card);
        overflow: hidden;
        flex-shrink: 0;
      }

      .art img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .art .hint {
        color: var(--muted);
        font-size: 13px;
        text-align: center;
        padding: 0 10px;
      }

      .current-track-info {
        text-align: center;
        width: 100%;
        flex-shrink: 0;
        padding: 0 10px;
      }

      .title {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .creator {
        color: var(--muted);
        font-size: 15px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .progress-section {
        width: 100%;
        margin: 5% 0;
        flex-shrink: 0;
      }

      .progress-bar {
        width: 100%;
        height: 6px;
        background: var(--card);
        border-radius: 3px;
        overflow: hidden;
        cursor: pointer;
        position: relative;
        transition: height 0.2s;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
      }

      .progress-bar:hover {
        height: 10px;
      }

      .progress {
        height: 100%;
        background: var(--accent);
        border-radius: 3px;
        width: 0%;
        will-change: width;
        transition: width 0.1s linear;
        position: relative;
      }

      .progress::after {
        content: '';
        position: absolute;
        right: -5px;
        top: 50%;
        transform: translateY(-50%);
        width: 10px;
        height: 10px;
        background: var(--accent);
        border-radius: 50%;
        opacity: 0;
        transition: opacity 0.2s;
      }

      .progress-bar:hover .progress::after {
        opacity: 1;
      }

      .progress-bar.dragging .progress::after {
        opacity: 1;
      }

      .time-controls {
        display: flex;
        justify-content: space-between;
        margin-top: 4px;
      }

      .current-time, .total-time {
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        font-size: 11px;
      }

      .controls {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin: 7% 2px;
        flex-shrink: 0;
      }

      button {
        height: 40px;
        border: none;
        border-radius: 10px;
        background: var(--btn);
        color: var(--accent);
        font-size: 19px;
        cursor: pointer;
        padding: 0 14px;
        transition: transform 0.1s, background-color 0.2s;
        touch-action: manipulation;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      button:active:not(:disabled) {
        transform: scale(0.96);
        border: none;
      }

      .play-btn {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: var(--accent);
        color: #000;
        font-weight: bold;
        font-size: 19px;
      }

      .prev-btn {
        min-width: 68px;
        min-height: 40px;
      } 
      
      .next-btn {
        min-width: 68px;
        min-height: 40px;
      }

      .favorite-btn {
        background: var(--btn);
        color: var(--muted);
        font-size: 19px;
        width: 68px;
        height: 40px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .favorite-btn.active {
        color: #ff6b6b;
      }

      .shuffle-favorites-btn {
        background: var(--btn);
        color: var(--muted);
        font-size: 19px;
        width: 68px;
        height: 40px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .shuffle-favorites-btn.active {
        color: var(--accent);
        background: var(--btn);
        outline: 2px solid var(--accent);
      }

      .shuffle-favorites-btn svg {
        width: 19px;
        height: 19px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .shuffle-favorites-btn.active svg {
        stroke:var(--accent);
      }

      .cast-btn {
        background: var(--btn);
        color: var(--muted);
        font-size: 19px;
        width: 68px;
        height: 40px;
        padding: 0;
        align-items: center;
        justify-content: center;
      }

      .cast-btn.active {
        color: var(--accent);
        background: var(--btn);
        outline: 2px solid var(--accent);
      }

      .cast-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .genre-section {
        margin: 6px 0;
        flex-shrink: 0;
        width: 100%;
        padding: 0 5px;
        display: none;
      }

      .genre-label {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 5px;
      }

      select {
        width: 100%;
        height: 38px;
        border: none;
        border-radius: 10px;
        background: var(--btn);
        color: var(--fg);
        font-size: 13px;
        cursor: pointer;
        padding: 0 10px;
      }

      select:focus {
        outline: 2px solid var(--accent);
      }
      
      .favorites-section {
        flex-shrink: 0;
        width: 100%;
        padding: 0 5px;
      }

      .favorites-header {
        display: none;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 5px;
        padding: 5px 0;
      }

      .favorites-label {
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
      }

      .favorites-toggle {
        background: var(--btn);
        border: none;
        color: var(--accent);
        font-size: 12px;
        cursor: pointer;
        padding: 6px 10px;
        border-radius: 8px;
        height: auto;
        font-weight: 500;
      }

      .favorites-toggle:active {
        background: var(--card);
      }

      .favorites-list {
        max-height: 300px;
        overflow-y: auto;
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 8px;
        margin-top: 6px;
        display: none;
        background: var(--card);
      }

      .favorites-list.active {
        display: block;
      }

      .favorite-item {
        padding: 12px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: background-color 0.2s;
      }

      .favorite-item:last-child {
        border-bottom: none;
      }

      .favorite-item:hover {
        background: rgba(255,255,255,0.05);
      }

      .favorite-item:active {
        background: #111;
      }

      .favorite-info {
        flex: 1;
        min-width: 0;
        text-align: left;
      }

      .favorite-title {
        font-weight: 600;
        font-size: 13px;
        margin-bottom: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .favorite-creator {
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .favorite-actions {
        display: flex;
        gap: 5px;
      }

      .favorite-play {
        background: var(--accent);
        border: none;
        color: #000;
        font-size: 10px;
        cursor: pointer;
        padding: 4px 7px;
        border-radius: 5px;
        font-weight: bold;
        height: auto;
      }

      .favorite-remove {
        background: transparent;
        border: none;
        color: var(--error);
        font-size: 13px;
        cursor: pointer;
        padding: 4px;
        border-radius: 5px;
        height: auto;
      }

      .favorite-remove:active {
        background: rgba(255,107,107,0.1);
      }

      .album-indicator {
        background: rgba(110, 231, 183, 0.2);
        color: var(--accent);
        font-size: 9px;
        padding: 2px 6px;
        border-radius: 4px;
        margin-left: 6px;
        font-weight: bold;
      }

      .tracks-list {
        margin-top: 8px;
        border-radius: 6px;
        overflow: hidden;
        background: rgba(255,255,255,0.03);
      }

      .track-item {
        padding: 10px 12px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: background-color 0.2s;
        text-align: left;
      }

      .track-item:last-child {
        border-bottom: none;
      }

      .track-item:hover {
        background: rgba(255,255,255,0.05);
      }

      .track-item-info {
        flex: 1;
        min-width: 0;
        text-align: left;
      }

      .track-title {
        width: 100%;
        font-weight: 500;
        font-size: 12px;
        margin-bottom: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .track-creator {
        color: var(--muted);
        font-size: 10px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .track-actions {
        display: flex;
        gap: 5px;
        align-items: center;
      }

      .track-play {
        background: var(--accent);
        border: none;
        color: #000;
        font-size: 9px;
        cursor: pointer;
        padding: 3px 6px;
        border-radius: 4px;
        font-weight: bold;
        height: auto;
      }

      .track-favorite {
        background: transparent;
        border: none;
        color: var(--muted);
        font-size: 12px;
        cursor: pointer;
        padding: 3px;
        border-radius: 4px;
        height: auto;
      }

      .track-favorite.active {
        color: #ff6b6b;
      }

      .track-number {
        color: var(--muted);
        font-size: 10px;
        margin-right: 8px;
        min-width: 20px;
        text-align: right;
      }

      .expand-tracks {
        background: transparent;
        border: none;
        color: var(--accent);
        font-size: 11px;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 4px;
        margin-top: 8px;
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .expand-tracks:active {
        background: rgba(110, 231, 183, 0.1);
      }

      .tracks-container {
        overflow-x: clip;
        overflow-x: hidden;
        max-width: 100%;
        box-sizing: border-box;
      }
      
      .search-section {
        padding: 2px 4px;
      }

      .search-container {
        position: relative;
        display: flex;
        margin: 0 2px;
      }

      .search-input {
        flex: 1;
        height: 40px;
        background: var(--card);
        border: none;
        border-radius: 10px;
        color: var(--fg);
        font-size: 14px;
        font-style: oblique;
        padding: 0 8px;
      }

      .search-input:focus {
        outline: 2px solid var(--accent);
        position: relative;
        color: var(--fg);
      }

      .search-input::placeholder {
        color: var(--muted);
      }

      .search-button {
        display: none;
      }

      .search-results {
        border-radius: 10px;
        max-height: 75vh;
        overflow-y: auto;
      }

      .search-results.active {
        display: block;
        opacity: 1;
        margin-top: 5px;
        background: var(--card);
        margin-left: 10px;
      }

      .search-results-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
      }

      .search-results-controls {
        display: flex;
        gap: 8px;
      }

      .search-control-btn {
        background: var(--btn);
        border: none;
        color: var(--accent);
        font-size: 11px;
        cursor: pointer;
        padding: 6px 10px;
        border-radius: 6px;
        height: auto;
        font-weight: 500;
      }

      .search-control-btn:active {
        background: var(--card);
      }

      .search-results-list {
        overflow-y: auto;
      }

      .search-result {
        padding: 12px;
        border-bottom: 1px solid rgba(226, 29, 29, 0.06);
        cursor: pointer;
        display: flex;
        justify-content: flex-start;
        align-items: flex-start;
        transition: background-color 0.2s;
        text-align: left;
        flex-direction: column;
        flex-wrap: wrap;
      }

      .search-result:last-child {
        border-bottom: none;
      }

      .search-result:hover {
        background: rgba(255,255,255,0.05);
      }

      .search-result:active {
        background: #111;
      }

      .result-actions {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
        width: 100%;
      }

      .result-play-btn {
        background: var(--accent);
        color: #000;
        border: none;
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 4px;
        transition: transform 0.1s;
      }

      .result-play-btn:active {
        transform: scale(0.95);
      }

      .play-icon {
        font-size: 10px;
      }

      .play-text {
        font-size: 11px;
      }

      .result-favorite {
        background: var(--btn);
        border: none;
        border-radius: 6px;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 14px;
        transition: background-color 0.2s;
      }

        .result-expand {
        background: var(--btn);
        border: none;
        border-radius: 6px;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 14px;
        transition: background-color 0.2s;
        display: none;
      }

      .result-favorite.active {
        color: #ff6b6b;
      }

      .result-favorite:active, .result-expand:active {
        background: var(--card);
      }

      .expand-icon {
        transition: transform 0.2s;
      }

      .expand-icon.expanded {
        transform: rotate(180deg);
      }

      .result-info {
        flex: 1;
        min-width: 0;
        text-align: left;
        width: 100%;
      }

      .result-title {
        font-weight: 600;
        font-size: 13px;
        margin-bottom: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .result-creator {
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .result-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 4px;
      }

      .result-album-indicator {
        background: var(--accent);
        color: #000;
        font-size: 9px;
        padding: 2px 6px;
        border-radius: 4px;
        font-weight: bold;
      }

      .no-results {
        padding: 5px;
        text-align: center;
        color: var(--error);
        font-size: 15px;
        font-weight: bold;
      }

      .search-loading {
        padding: 5px;
        text-align: center;
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .load-more {
        text-align: center;
        padding: 12px;
        border-top: 1px solid rgba(255,255,255,0.06);
      }

      .load-more-btn {
        background: var(--accent);
        color: #000;
        border: none;
        border-radius: 6px;
        padding: 8px 16px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.1s;    
        text-align: center;
        display: inline-block;
      }

      .load-more-btn:active {
        transform: scale(0.95);
      }

      .status-messages {
        margin: 0;
        min-height: 5px;
        text-align: left;
      }

      .status-message {
        background: var(--card);
        border-radius: 7px;
        font-size: 12px;
        padding: 8px 10px;
        margin: 3px 0;
        display: none;
      }

      .status-info {
        border-left: 3px solid var(--accent);
      }

      .status-error {
        border-left: 3px solid var(--error);
      }

      .loader {
        display: inline-flex;
        width: 15px;
        height: 15px;
        border: 2px solid var(--muted);
        border-radius: 50%;
        border-top-color: var(--accent);
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .start-view {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: var(--bg);
        z-index: 1000;
        transition: opacity 0.4s, visibility 0.4s;
      }

      .start-view.hidden {
        opacity: 0;
        visibility: hidden;
      }

      .start-title {
        font-size: 1.8rem;
        font-weight: 700;
        color: var(--accent);
        margin-bottom: 0.8rem;
        text-align: center;
      }

      .start-subtitle {
        font-size: 0.9rem;
        color: var(--muted);
        margin-bottom: 1.8rem;
        text-align: center;
        max-width: 80%;
      }

      .start-button {
        background: var(--accent);
        color: #000;
        border: none;
        border-radius: 14px;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        padding: 12px 24px;
        box-shadow: 0 6px 20px rgba(110, 231, 183, 0.25);
      }

      .start-button:active {
        transform: scale(0.97);
      }

      .footer {
        color: var(--muted);
        font-size: 9px;
        text-align: center;
      }

      .lazy-load-observer {
        pointer-events: none;
        height: 1px;
        visibility: hidden;
      }

      .loading-indicator {
        text-align: center;
        padding: 10px;
        color: var(--muted);
        font-size: 12px;
      }

      /* Mejoras responsive */
      @media (max-width: 768px) {
        .result-actions {
          gap: 6px;
        }
        
        .result-play-btn {
          padding: 5px 10px;
          font-size: 11px;
        }
        
        .play-text {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1><img src="icons/favicon.svg" height="20px">&nbsp;Resonate</h1>
    </header>
    <div class="start-view" id="start-view">
      <button id="start-button" class="start-button">Iniciar Resonate</button>
    </div>
    <div class="app" id="app">
     
      <div class="favorites-section">
        <div class="favorites-header">
          <div class="favorites-label">Favoritos</div>
          <button id="favorites-toggle" class="favorites-toggle">Mostrar favoritos</button>
        </div>
        <div id="favorites-list" class="favorites-list"></div>
      </div>

      <div class="search-section">
        <div class="search-container">
          <input type="text" id="search-input" class="search-input" placeholder="Buscar ">
        </div>
      </div>
      
      <div id="search-results" class="search-results">
        <div id="search-results-list" class="search-results-list"></div>
      </div>

  <script>
// ==================== CONFIGURACIÓN PRINCIPAL ====================
const SEARCH_CONFIG = {
  maxResults: 50, // Reducido para mejor rendimiento
  resultsPerPage: 8, // Reducido para menos carga
  timeout: 10000, // Aumentado a 10 segundos
  enableLazyLoading: true,
  cacheDuration: 10 * 60 * 1000, // 10 minutos
  preloadMetadata: true
};
// ==================== SISTEMA DE CACHÉ AVANZADO ====================
class AdvancedAudioCache {
  constructor() {
    this.dbName = 'ResonateAudioCache';
    this.dbVersion = 4;
    this.storeName = 'audioFiles';
    this.maxSize = 10 * 1024 * 1024 * 1024; // 10GB máximo
    this.currentSize = 0;
    this.db = null;
    this.initialized = false;
    this.listenStats = new Map();
    this.favoritesQueue = []; // Cola FIFO para favoritos precargados
    this.maxFavorites = 5; // Máximo de favoritos precargados
    this.favoritesQueueLock = false; // Bloqueo para evitar conflictos
  }

  async init() {
    if (this.initialized) return;
    
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(this.dbName, this.dbVersion);
      
      request.onerror = () => {
        console.error('Error abriendo IndexedDB:', request.error);
        reject(request.error);
      };
      
      request.onsuccess = () => {
        this.db = request.result;
        this.initialized = true;
        this.calculateSize().then(resolve);
      };
      
      request.onupgradeneeded = (event) => {
        const db = event.target.result;
        if (!db.objectStoreNames.contains(this.storeName)) {
          const store = db.createObjectStore(this.storeName, { keyPath: 'url' });
          store.createIndex('timestamp', 'timestamp', { unique: false });
          store.createIndex('size', 'size', { unique: false });
          store.createIndex('playCount', 'playCount', { unique: false });
          store.createIndex('lastPlayed', 'lastPlayed', { unique: false });
          store.createIndex('fullyListened', 'fullyListened', { unique: false });
          store.createIndex('isFavorite', 'isFavorite', { unique: false });
        } else {
          const store = event.currentTarget.transaction.objectStore(this.storeName);
          if (!store.indexNames.contains('playCount')) {
            store.createIndex('playCount', 'playCount', { unique: false });
          }
          if (!store.indexNames.contains('lastPlayed')) {
            store.createIndex('lastPlayed', 'lastPlayed', { unique: false });
          }
          if (!store.indexNames.contains('fullyListened')) {
            store.createIndex('fullyListened', 'fullyListened', { unique: false });
          }
          if (!store.indexNames.contains('isFavorite')) {
            store.createIndex('isFavorite', 'isFavorite', { unique: false });
          }
        }
      };
    });
  }

  async calculateSize() {
    if (!this.db) return 0;
    
    return new Promise((resolve) => {
      const transaction = this.db.transaction([this.storeName], 'readonly');
      const store = transaction.objectStore(this.storeName);
      const request = store.getAll();
      
      request.onsuccess = () => {
        this.currentSize = request.result.reduce((total, item) => total + (item.size || 0), 0);
        console.log(`Tamaño actual de caché: ${(this.currentSize / 1024 / 1024).toFixed(2)}MB`);
        
        if (this.currentSize > this.maxSize * 0.9) {
          this.showStorageWarning();
        }
        
        resolve(this.currentSize);
      };
    });
  }

  async get(url) {
    if (!this.initialized) await this.init();
    
    return new Promise((resolve) => {
      const transaction = this.db.transaction([this.storeName], 'readwrite');
      const store = transaction.objectStore(this.storeName);
      const request = store.get(url);
      
      request.onsuccess = () => {
        if (request.result) {
          request.result.lastAccessed = Date.now();
          request.result.playCount = (request.result.playCount || 0) + 1;
          store.put(request.result);
          resolve(request.result.blob);
        } else {
          resolve(null);
        }
      };
      
      request.onerror = () => resolve(null);
    });
  }
  
  async put(url, blob, updateSize = true, isFavorite = false) {
    if (!this.initialized) await this.init();
    if (!blob) return;
    
    const existing = await this.get(url);
    if (existing) {
      console.log('Pista ya existe en caché, actualizando:', url);
      if (isFavorite) {
        await this.markAsFavorite(url);
      }
      return true;
    }
    
    const item = {
      url: url,
      blob: blob,
      size: blob.size,
      timestamp: Date.now(),
      lastAccessed: Date.now(),
      playCount: 0,
      fullyListened: false,
      lastPlayed: null,
      isFavorite: isFavorite
    };
    
    return new Promise(async (resolve) => {
      if (updateSize) {
        this.currentSize += blob.size;
        await this.ensureSpace();
      }
      
      const transaction = this.db.transaction([this.storeName], 'readwrite');
      const store = transaction.objectStore(this.storeName);
      const request = store.put(item);
      
      request.onsuccess = () => {
        console.log('Pista almacenada en caché:', url, `(${(blob.size / 1024 / 1024).toFixed(2)}MB)`);
        
        if (isFavorite) {
          this.addToFavoritesQueue(url);
        }
        
        resolve(true);
      };
      request.onerror = () => resolve(false);
    });
  }

  async markAsFullyListened(url) {
    if (!this.initialized) await this.init();
    
    return new Promise((resolve) => {
      const transaction = this.db.transaction([this.storeName], 'readwrite');
      const store = transaction.objectStore(this.storeName);
      const request = store.get(url);
      
      request.onsuccess = () => {
        if (request.result) {
          const item = request.result;
          item.fullyListened = true;
          item.lastPlayed = Date.now();
          store.put(item);
          console.log('Pista marcada como escuchada completamente:', url);
          resolve(true);
        } else {
          resolve(false);
        }
      };
      
      request.onerror = () => resolve(false);
    });
  }

  async markAsFavorite(url) {
    if (!this.initialized) await this.init();
    
    return new Promise((resolve) => {
      const transaction = this.db.transaction([this.storeName], 'readwrite');
      const store = transaction.objectStore(this.storeName);
      const request = store.get(url);
      
      request.onsuccess = () => {
        if (request.result) {
          const item = request.result;
          item.isFavorite = true;
          item.lastAccessed = Date.now();
          store.put(item);
          
          this.addToFavoritesQueue(url);
          
          console.log('Pista marcada como favorita:', url);
          resolve(true);
        } else {
          resolve(false);
        }
      };
      
      request.onerror = () => resolve(false);
    });
  }

  async remove(url) {
    if (!this.initialized) await this.init();
    
    return new Promise((resolve) => {
      const transaction = this.db.transaction([this.storeName], 'readwrite');
      const store = transaction.objectStore(this.storeName);
      const request = store.get(url);
      
      request.onsuccess = () => {
        if (request.result) {
          this.currentSize -= request.result.size;
          store.delete(url);
          
          this.removeFromFavoritesQueue(url);
          
          console.log('Pista eliminada de caché:', url);
          resolve(true);
        } else {
          resolve(false);
        }
      };
      
      request.onerror = () => resolve(false);
    });
  }

  // ==================== GESTIÓN DE COLA FIFO PARA FAVORITOS ====================
  
  addToFavoritesQueue(url) {
    // Evitar duplicados
    this.removeFromFavoritesQueue(url);
    
    // Agregar al final de la cola
    this.favoritesQueue.push(url);
    
    console.log(`Favorito agregado a cola FIFO: ${url} (${this.favoritesQueue.length}/${this.maxFavorites})`);
  }
  
  removeFromFavoritesQueue(url) {
    const index = this.favoritesQueue.indexOf(url);
    if (index !== -1) {
      this.favoritesQueue.splice(index, 1);
      console.log(`Favorito removido de cola FIFO: ${url}`);
    }
  }
  
  getFavoritesQueue() {
    return [...this.favoritesQueue];
  }

  // MÉTODO MEJORADO: Reemplazar favorito en cola FIFO basado en contexto
  async replaceFavoritesQueueItem(oldUrl, newUrl, favorites) {
    if (this.favoritesQueueLock) {
      console.log('Cola FIFO bloqueada, esperando...');
      return false;
    }
    
    this.favoritesQueueLock = true;
    
    try {
      // Remover el favorito antiguo
      this.removeFromFavoritesQueue(oldUrl);
      
      // Seleccionar un favorito aleatorio para reemplazo
      if (!newUrl && favorites && favorites.length > 0) {
        const availableFavorites = favorites.filter(fav => 
          fav && fav.url && !this.favoritesQueue.includes(fav.url)
        );
        
        if (availableFavorites.length > 0) {
          const randomIndex = Math.floor(Math.random() * availableFavorites.length);
          newUrl = availableFavorites[randomIndex].url;
          console.log(`Seleccionado favorito aleatorio para reemplazo: ${newUrl}`);
          
          // Agregar Favorito a cola FIFO
          this.addToFavoritesQueue(newUrl);
          
          // Almacenar pista en caché
          await this.prefetchAudio(newUrl, true);
          
          console.log(`Reemplazo completado: ${oldUrl} -> ${newUrl}`);
          return true;
        }
      } else if (newUrl) {
        // Agregar Favorito a cola FIFO
        this.addToFavoritesQueue(newUrl);
        
        // Almacenar pista en caché
        await this.prefetchAudio(newUrl, true);
        
        console.log(`Reemplazo completado: ${oldUrl} -> ${newUrl}`);
        return true;
      } else {
        console.log('No hay favoritos disponibles para reemplazo');
        return false;
      }
    } catch (error) {
      console.error('Error en replaceFavoritesQueueItem:', error);
      return false;
    } finally {
      this.favoritesQueueLock = false;
    }
  }

  // ==================== SISTEMA DE SEGURIDAD PARA STATE.LOADING ====================

// Método para resetear state.isLoading si se queda bloqueado
setupLoadingSafety() {
  // Resetear state.isLoading cada 30 segundos por seguridad
  setInterval(() => {
    if (state.isLoading) {
      console.warn('state.isLoading estaba bloqueado, reseteando...');
      state.isLoading = false;
      elements.playBtn.disabled = false;
      elements.playBtn.textContent = '▶';
    }
  }, 30000);
}
  
  // MÉTODO: Cargar cola FIFO completa desde favoritos
  async loadFavoritesQueue(favorites, shuffle = true) {
    console.log(`Cargando cola FIFO desde favoritos (shuffle: ${shuffle})`);
    
    // Limpiar cola actual
    this.favoritesQueue = [];
    
    if (!favorites || favorites.length === 0) {
      console.log('No hay favoritos para cargar en cola FIFO');
      return;
    }
    
    let favoritesToLoad;
    
    if (shuffle) {
      // Modo aleatorio: seleccionar 10 favoritos aleatorios
      favoritesToLoad = this.shuffleArray([...favorites]).slice(0, this.maxFavorites);
    } else {
      // Modo secuencial: tomar los siguientes 10 favoritos
      const currentIndex = state.playbackHistory.length;
      favoritesToLoad = favorites.slice(currentIndex, currentIndex + this.maxFavorites);
    }
    
    console.log(`Cargando ${favoritesToLoad.length} favoritos en cola FIFO`);
    
    const preloadPromises = [];
    
    for (const favorite of favoritesToLoad) {
      if (favorite && favorite.url) {
        this.addToFavoritesQueue(favorite.url);
        preloadPromises.push(this.prefetchAudio(favorite.url, true));
      }
    }
    
    await Promise.allSettled(preloadPromises);
    console.log(`Cola FIFO cargada: ${this.favoritesQueue.length}/${this.maxFavorites} favoritos`);
  }

  // ==================== PRECARGA ALEATORIA DE FAVORITOS ====================
  
  async preloadFavorites(favorites) {
    if (!this.initialized) await this.init();
    
    console.log('Precargando favoritos en cola FIFO...');
    
    // Usar el nuevo método para cargar la cola
    await this.loadFavoritesQueue(favorites, state.shuffleFavorites);
  }
  
  async prefetchFavorite(favorite) {
    try {
      // Verificar si ya está en caché
      const existing = await this.get(favorite.url);
      if (!existing) {
        // Precargar en segundo plano
        const success = await this.prefetchAudio(favorite.url, true);
        if (success) {
          console.log('Favorito precargado:', favorite.title);
        }
      } else {
        // Ya está en caché, agregar a la cola
        this.addToFavoritesQueue(favorite.url);
        await this.markAsFavorite(favorite.url);
        console.log('Favorito ya estaba en caché:', favorite.title);
      }
    } catch (error) {
      console.log('Error precargando favorito:', error);
    }
  }
  
  // Función para mezclar array aleatoriamente (Fisher-Yates)
  shuffleArray(array) {
    const newArray = [...array];
    for (let i = newArray.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
    }
    return newArray;
  }
  
  async ensureSpace() {
    if (this.currentSize <= this.maxSize) return;
    
    console.log('Liberando espacio en caché...');
    
    const transaction = this.db.transaction([this.storeName], 'readwrite');
    const store = transaction.objectStore(this.storeName);
    const index = store.index('lastAccessed');
    
    const request = index.getAll();
    
    request.onsuccess = async () => {
      const items = request.result.sort((a, b) => {
        if (a.isFavorite !== b.isFavorite) {
          return a.isFavorite ? 1 : -1;
        }
        if (a.fullyListened !== b.fullyListened) {
          return a.fullyListened ? 1 : -1;
        }
        return a.lastAccessed - b.lastAccessed;
      });
      
      let freedSpace = 0;
      const targetSize = this.maxSize * 0.85;
      
      for (const item of items) {
        if (this.currentSize - freedSpace <= targetSize) break;
        
        if (this.favoritesQueue.includes(item.url)) {
          continue;
        }
        
        const deleteRequest = store.delete(item.url);
        freedSpace += item.size;
        
        deleteRequest.onsuccess = () => {
          this.currentSize -= item.size;
        };
      }
      
      console.log(`Espacio liberado: ${(freedSpace / 1024 / 1024).toFixed(2)}MB`);
      
      if (this.currentSize > this.maxSize * 0.9) {
        this.showStorageWarning();
      }
    };
  }

  showStorageWarning() {
    if (document.hidden || !state.userInteracted) return;
    
    showStatus('El almacenamiento está casi lleno. ¿Desea aumentar el límite en 3GB?', 'error', 10000);
    
    setTimeout(() => {
      if (confirm('El almacenamiento de Resonate está casi lleno. ¿Desea aumentar el límite en 3GB para continuar almacenando pistas?')) {
        this.increaseStorageLimit(3 * 1024 * 1024 * 1024);
        showStatus('Límite aumentado exitosamente', 'info', 3000);
      }
    }, 1000);
  }

  increaseStorageLimit(additionalBytes) {
    this.maxSize += additionalBytes;
    console.log(`Nuevo límite de almacenamiento: ${(this.maxSize / 1024 / 1024 / 1024).toFixed(2)}GB`);
  }

  async preloadTracks(tracks, isInitial = false) {
    if (!this.initialized) await this.init();
    
    if (isInitial) {
      console.log('Precargando 10 pistas iniciales en caché...');
    }
    
    const count = isInitial ? 10 : 1;
    const preloadPromises = [];
    
    for (const track of tracks.slice(0, count)) {
      if (track && track.url) {
        try {
          const existing = await this.get(track.url);
          if (!existing) {
            preloadPromises.push(this.prefetchAudio(track.url));
          }
        } catch (error) {
          console.log('Error precargando pista:', error);
        }
      }
    }
    
    await Promise.allSettled(preloadPromises);
    if (isInitial) {
      console.log(`Precarga inicial completada: ${preloadPromises.length} pistas`);
    }
  }

  async prefetchAudio(url, isFavorite = false) {
    try {
      const response = await fetch(url);
      if (response.ok) {
        const blob = await response.blob();
        await this.put(url, blob, true, isFavorite);
        return true;
      }
    } catch (error) {
      console.log('Error en prefetch:', error);
    }
    return false;
  }

  async getUsageStats() {
    if (!this.initialized) await this.init();
    
    return new Promise((resolve) => {
      const transaction = this.db.transaction([this.storeName], 'readonly');
      const store = transaction.objectStore(this.storeName);
      const request = store.getAll();
      
      request.onsuccess = () => {
        const items = request.result;
        const stats = {
          totalTracks: items.length,
          totalSize: this.currentSize,
          fullyListened: items.filter(item => item.fullyListened).length,
          favorites: items.filter(item => item.isFavorite).length,
          favoritesPreloaded: this.favoritesQueue.length,
          maxSize: this.maxSize,
          usagePercentage: (this.currentSize / this.maxSize) * 100
        };
        resolve(stats);
      };
      
      request.onerror = () => resolve(null);
    });
  }
}

// ==================== SISTEMA DE CACHÉ MEJORADO ====================
class EnhancedSearchCache {
  constructor() {
    this.searchCache = new Map();
    this.metadataCache = new Map();
    this.audioCache = new Map();
    this.maxSize = 100;
  }

  // Método genérico para obtener cualquier tipo de dato
  get(type, key) {
    const cache = this[`${type}Cache`];
    if (!cache) return null;
    
    const item = cache.get(key);
    if (!item) return null;
    
    if (Date.now() > item.expiry) {
      cache.delete(key);
      return null;
    }
    
    return item.data;
  }

  // Método genérico para almacenar cualquier tipo de dato
  set(type, key, data, ttl = SEARCH_CONFIG.cacheDuration) {
    const cache = this[`${type}Cache`];
    if (!cache) return;
    
    if (cache.size >= this.maxSize) {
      const firstKey = cache.keys().next().value;
      cache.delete(firstKey);
    }
    
    cache.set(key, {
      data,
      expiry: Date.now() + ttl
    });
  }

  clear(type = null) {
    if (type) {
      const cache = this[`${type}Cache`];
      if (cache) cache.clear();
    } else {
      this.searchCache.clear();
      this.metadataCache.clear();
      this.audioCache.clear();
    }
  }
}

function setupMediaSession() {
  if (!('mediaSession' in navigator)) {
    console.log('Media Session API no está disponible');
    return;
  }

  // Configurar acciones de Media Session
  try {
    navigator.mediaSession.setActionHandler('play', () => {
      togglePlay();
    });

    navigator.mediaSession.setActionHandler('pause', () => {
      togglePlay();
    });

    navigator.mediaSession.setActionHandler('previoustrack', () => {
      playPrevious();
    });

    navigator.mediaSession.setActionHandler('nexttrack', () => {
      playNext();
    });

    navigator.mediaSession.setActionHandler('seekbackward', (details) => {
      const skipTime = details.seekOffset || 10;
      elements.audio.currentTime = Math.max(0, elements.audio.currentTime - skipTime);
    });

    navigator.mediaSession.setActionHandler('seekforward', (details) => {
      const skipTime = details.seekOffset || 10;
      elements.audio.currentTime = Math.min(elements.audio.duration, elements.audio.currentTime + skipTime);
    });

    navigator.mediaSession.setActionHandler('seekto', (details) => {
      if (details.fastSeek && 'fastSeek' in elements.audio) {
        elements.audio.fastSeek(details.seekTime);
      } else {
        elements.audio.currentTime = details.seekTime;
      }
    });

    console.log('Media Session API configurada correctamente');
  } catch (error) {
    console.log('Algunas acciones de Media Session no están disponibles:', error);
  }
}

function updateMediaSessionMetadata(track, identifier) {
  if (!('mediaSession' in navigator)) return;

  try {
    const artwork = [];
    const archiveCoverUrl = `https://archive.org/services/img/${identifier}`;
    
    // Agregar diferentes tamaños de artwork para compatibilidad
    artwork.push({ src: archiveCoverUrl, sizes: '300x300', type: 'image/jpeg' });
    artwork.push({ src: archiveCoverUrl, sizes: '512x512', type: 'image/jpeg' });

    navigator.mediaSession.metadata = new MediaMetadata({
      title: track.title || 'Sin título',
      artist: track.creator || 'Desconocido',
      album: track.album || identifier,
      artwork: artwork
    });

    // Actualizar posición y duración
    updateMediaPositionState();

    console.log('Metadatos de Media Session actualizados:', track.title);
  } catch (error) {
    console.log('Error actualizando Media Session:', error);
  }
}

function updateMediaPositionState() {
  if (!('mediaSession' in navigator) || !elements.audio.duration) return;

  try {
    navigator.mediaSession.setPositionState({
      duration: elements.audio.duration,
      playbackRate: elements.audio.playbackRate,
      position: elements.audio.currentTime
    });
  } catch (error) {
    console.log('Error actualizando posición de Media Session:', error);
  }
}

// ==================== SISTEMA DE REPRODUCCIÓN CONTINUA ====================
class ContinuousPlaybackManager {
  constructor() {
    this.currentContext = null;
    this.contextData = {
      genre: { currentIndex: -1, items: [] },
      search: { currentIndex: -1, items: [] },
      favorites: { currentIndex: -1, items: [] },
      album: { currentIndex: -1, items: [], currentAlbumId: null },
      searchPlaylist: { currentIndex: -1, items: [] }
    };
  }
  
  setContext(context, items, startIndex = 0, albumId = null) {
    this.currentContext = context;
    this.contextData[context] = {
      currentIndex: startIndex,
      items: items || [],
      currentAlbumId: albumId
    };
  }
  
  getNextTrack() {
    if (!this.currentContext || !this.contextData[this.currentContext].items.length) {
      return null;
    }
    
    const context = this.contextData[this.currentContext];
    
    if (this.currentContext === 'favorites' && state.shuffleFavorites) {
      context.currentIndex = Math.floor(Math.random() * context.items.length);
    } else {
      context.currentIndex = (context.currentIndex + 1) % context.items.length;
    }
    
    return context.items[context.currentIndex];
  }
  
  getCurrentContext() {
    return this.currentContext;
  }
  
  hasNextTrack() {
    const context = this.contextData[this.currentContext];
    return context && context.items.length > 0 && 
           context.currentIndex < context.items.length - 1;
  }
  
  setAlbumPlaylist(albumId, tracks, startIndex = 0) {
    this.setContext('album', tracks, startIndex, albumId);
  }
  
  getCurrentAlbumId() {
    return this.contextData.album.currentAlbumId;
  }
  
  isPlayingAlbum(albumId = null) {
    if (albumId) {
      return this.currentContext === 'album' && this.contextData.album.currentAlbumId === albumId;
    }
    return this.currentContext === 'album';
  }

  setSearchPlaylist(tracks, startIndex = 0) {
    this.setContext('searchPlaylist', tracks, startIndex);
  }
  
  getPreviousTrack() {
    if (!this.currentContext || !this.contextData[this.currentContext].items.length) {
      return null;
    }
    
    const context = this.contextData[this.currentContext];
    context.currentIndex = (context.currentIndex - 1 + context.items.length) % context.items.length;
    
    return context.items[context.currentIndex];
  }
}

function isTrackFavorite(track) {
  if (!track || !track.url) return false;
  return state.favorites.some(fav => fav.url === track.url);
}

function toggleFavorite(track) {
  if (!track || !track.url) return;
  
  const isFavorite = isTrackFavorite(track);
  
  if (isFavorite) {
    state.favorites = state.favorites.filter(fav => fav.url !== track.url);
    
    // Reemplazar en cola FIFO si se elimina un favorito
    if (state.playbackQueue.some(item => item.url === track.url)) {
      const availableFavorites = state.favorites.filter(fav => 
        !state.playbackQueue.some(item => item.url === fav.url)
      );
      
      if (availableFavorites.length > 0) {
        const randomIndex = Math.floor(Math.random() * availableFavorites.length);
        const newFavorite = availableFavorites[randomIndex];
        
        // Reemplazar en la cola
        const queueIndex = state.playbackQueue.findIndex(item => item.url === track.url);
        if (queueIndex !== -1) {
          state.playbackQueue[queueIndex] = newFavorite;
          console.log(`Favorito reemplazado en cola FIFO: ${track.url} -> ${newFavorite.url}`);
        }
        
        // Precargar el nuevo favorito
        audioCache.prefetchAudio(newFavorite.url, true);
      }
    }
    
    audioCache.remove(track.url).then(removed => {
      if (removed) {
        console.log('Pista eliminada de caché al quitar de favoritos:', track.url);
      }
    });
    showStatus('Eliminado de favoritos', 'info');
  } else {
    const favoriteTrack = {
      id: track.id,
      title: track.title || 'Sin título',
      creator: track.creator || 'Desconocido',
      url: track.url,
      isAlbumTrack: track.isAlbumTrack || false,
      albumId: track.albumId || track.id,
      trackIndex: track.trackIndex || 0,
      totalTracks: track.totalTracks || 1,
      albumTitle: track.album || track.title
    };
    state.favorites.push(favoriteTrack);
    
    // Precargar el favorito en caché
    audioCache.prefetchAudio(track.url, true);
    
    showStatus('Agregado a favoritos', 'info');
  }
  
  saveFavorites();
  updateFavoriteButton();
  updateFavoritesList();
}

// FUNCIÓN: Agregar todas las pistas de un álbum a favoritos
function addAlbumToFavorites(albumId, files) {
  if (!files || files.length === 0) return;
  
  let addedCount = 0;
  
  files.forEach((track, index) => {
    // Verificar si la pista ya está en favoritos
    if (!state.favorites.some(fav => fav.url === track.url)) {
      const favoriteTrack = {
        id: track.id,
        title: track.title || 'Sin título',
        creator: track.creator || 'Desconocido',
        url: track.url,
        isAlbumTrack: true,
        albumId: albumId,
        trackIndex: index,
        totalTracks: files.length,
        albumTitle: track.album || files[0]?.album || 'Álbum'
      };
      state.favorites.push(favoriteTrack);
      addedCount++;
      
      // Precargar cada favorito en caché
      audioCache.prefetchAudio(track.url, true);
    }
  });
  
  if (addedCount > 0) {
    saveFavorites();
    updateFavoriteButton();
    updateFavoritesList();
    showStatus(`Álbum agregado a favoritos (${addedCount} pistas)`, 'info');
  } else {
    showStatus('Todas las pistas del álbum ya están en favoritos', 'info');
  }
}

// FUNCIÓN: Remover álbum completo de favoritos
function removeAlbumFromFavorites(albumId) {
  const initialCount = state.favorites.length;
  state.favorites = state.favorites.filter(fav => fav.albumId !== albumId);
  const removedCount = initialCount - state.favorites.length;
  
  // Remover de la cola FIFO de favoritos
  const favoritesQueue = audioCache.getFavoritesQueue();
  favoritesQueue.forEach(url => {
    const favTrack = state.favorites.find(f => f.url === url);
    if (!favTrack) {
      audioCache.removeFromFavoritesQueue(url);
    }
  });
  
  saveFavorites();
  updateFavoriteButton();
  updateFavoritesList();
  
  if (removedCount > 0) {
    showStatus(`Álbum removido de favoritos (${removedCount} pistas)`, 'info');
  }
}

// FUNCIÓN: Cargar cola FIFO según el contexto actual
async function loadPlaybackQueue(context, items, startIndex = 0) {
  state.playbackQueue = [];
  
  if (!items || items.length === 0) {
    console.log('No hay items para cargar en cola FIFO');
    return;
  }
  
  const queueSize = 10;
  
  if (context === 'favorites' && state.shuffleFavorites) {
    // Modo aleatorio: seleccionar 10 items aleatorios
    const shuffled = [...items].sort(() => Math.random() - 0.5);
    state.playbackQueue = shuffled.slice(0, queueSize);
  } else {
    // Modo secuencial: tomar los siguientes 10 items
    for (let i = 0; i < queueSize; i++) {
      const index = (startIndex + i) % items.length;
      if (items[index]) {
        state.playbackQueue.push(items[index]);
      }
    }
  }
  
  console.log(`Cola FIFO cargada: ${state.playbackQueue.length} pistas del contexto ${context}`);
  
  // Precargar las pistas de la cola
  if (state.networkOnline) {
    audioCache.preloadTracks(state.playbackQueue, true);
  }
}

function toggleShuffleFavorites() {
  state.shuffleFavorites = !state.shuffleFavorites;
  
  if (state.shuffleFavorites) {
    showStatus('Reproducción aleatoria de favoritos activada', 'info', 2000);
    
    // Recargar cola FIFO con 10 favoritos aleatorios
    if (state.favorites.length > 0) {
      loadPlaybackQueue('favorites', state.favorites, 0);
      audioCache.loadFavoritesQueue(state.favorites, true);
    }
  } else {
    showStatus('Reproducción aleatoria de favoritos desactivada', 'info', 2000);
    
    // Recargar cola FIFO con las siguientes 10 pistas
    const context = playbackManager.getCurrentContext();
    if (context && playbackManager.contextData[context].items.length > 0) {
      const ctx = playbackManager.contextData[context];
      const currentIndex = ctx.currentIndex;
      loadPlaybackQueue(context, ctx.items, currentIndex + 1);
    }
  }
  
  updateShuffleButton();
}

// ==================== FUNCIONES ASÍNCRONAS CORREGIDAS ====================
async function fetchWithTimeout(resource, options = {}) {
  const { timeout = 8000, ...fetchOptions } = options;
  
  const controller = new AbortController();
  const timeoutId = setTimeout(() => {
    controller.abort();
  }, timeout);
  
  try {
    const response = await fetch(resource, {
      ...fetchOptions,
      signal: controller.signal  
    });
    clearTimeout(timeoutId);
    return response;
  } catch (error) {
    clearTimeout(timeoutId);
    if (error.name === 'AbortError') {
      throw new Error(`Timeout: La petición tardó más de ${timeout}ms`);
    }
    throw error;
  }
}

async function performOptimizedSearch(query, page = 0) {
  if (!query.trim()) {
    hideSearchResults();
    return { results: [], hasMore: false };
  }

  const cacheKey = `search:${query}:${page}`;
  const cached = enhancedCache.get('search', cacheKey);
  
  if (cached) {
    console.log('Resultados desde caché:', cached.results.length);
    return cached;
  }

  elements.searchResults.classList.add('active');
  state.searchActive = true;

  try {
    const startTime = Date.now();
    
    // QUERY OPTIMIZADA Y COMPATIBLE - Sin sintaxis de boosting que causa errores
    // Usamos una estrategia de búsqueda por fases para mejor relevancia
    const baseQuery = `(${query}) AND mediatype:audio`;
    
    // Estrategia: buscar en title Y creator primero, luego en general
    // Esto mejora relevancia sin usar sintaxis incompatible
    const searchPhases = [
      `title:(${query}) AND creator:(${query})`, // Coincidencia exacta en ambos
      `title:(${query})`, // Luego solo en título
      `creator:(${query})`, // Luego solo en creador
      baseQuery // Finalmente búsqueda general
    ];
    
    // Construir query OR para cubrir todas las fases
    const optimizedQuery = searchPhases.join(' OR ');
    const encodedQuery = encodeURIComponent(optimizedQuery);
    
    const url = `https://archive.org/advancedsearch.php?q=${encodedQuery}&fl[]=identifier,title,creator,description&rows=${SEARCH_CONFIG.resultsPerPage}&page=${page + 1}&output=json&sort[]=downloads+desc`;
    
    console.log('Realizando búsqueda optimizada:', url);
    
    const response = await fetchWithTimeout(url, { 
      timeout: SEARCH_CONFIG.timeout,
      headers: {
        'Accept': 'application/json'
      }
    });
    
    if (!response.ok) throw new Error('Error de red');
    
    const data = await response.json();
    const results = data.response?.docs || [];
    
    // Post-procesamiento para mejorar relevancia en el cliente
    const processedResults = results.map(item => ({
      identifier: item.identifier,
      title: item.title || 'Sin título',
      creator: item.creator || 'Desconocido',
      description: item.description || '',
      isAlbum: null,
      trackCount: null,
      // Calculamos score de relevancia local
      relevanceScore: calculateRelevanceScore(item, query)
    }));

    // Ordenar por relevancia calculada (si hay muchos resultados)
    if (processedResults.length > 1) {
      processedResults.sort((a, b) => b.relevanceScore - a.relevanceScore);
    }

    const hasMore = results.length === SEARCH_CONFIG.resultsPerPage;
    
    const searchResult = {
      results: processedResults,
      hasMore,
      total: data.response?.numFound || 0
    };
    
    enhancedCache.set('search', cacheKey, searchResult);
    
    console.log(`Búsqueda optimizada completada en ${Date.now() - startTime}ms. Resultados: ${results.length}`);
    
    return searchResult;
    
  } catch (error) {
    console.error('Error en búsqueda optimizada:', error);
    
    // Fallback: intentar con query simple si la optimizada falla
    try {
      console.log('Intentando búsqueda simple como fallback...');
      const simpleQuery = encodeURIComponent(`(${query}) AND mediatype:audio`);
      const fallbackUrl = `https://archive.org/advancedsearch.php?q=${simpleQuery}&fl[]=identifier,title,creator&rows=${SEARCH_CONFIG.resultsPerPage}&page=${page + 1}&output=json&sort[]=downloads+desc`;
      
      const fallbackResponse = await fetchWithTimeout(fallbackUrl, { 
        timeout: SEARCH_CONFIG.timeout 
      });
      
      if (fallbackResponse.ok) {
        const fallbackData = await fallbackResponse.json();
        const fallbackResults = fallbackData.response?.docs || [];
        
        const processedFallbackResults = fallbackResults.map(item => ({
          identifier: item.identifier,
          title: item.title || 'Sin título',
          creator: item.creator || 'Desconocido',
          description: '',
          isAlbum: null,
          trackCount: null,
          relevanceScore: 0.5 // Score neutral para resultados de fallback
        }));
        
        const searchResult = {
          results: processedFallbackResults,
          hasMore: fallbackResults.length === SEARCH_CONFIG.resultsPerPage,
          total: fallbackData.response?.numFound || 0
        };
        
        enhancedCache.set('search', cacheKey, searchResult);
        return searchResult;
      }
    } catch (fallbackError) {
      console.error('Fallback también falló:', fallbackError);
    }
    
    elements.searchResultsList.innerHTML = '<div class="no-results">Error en la búsqueda. Intenta con otros términos.</div>';
    return { results: [], hasMore: false };
  }
}

// Función auxiliar para calcular relevancia en el cliente
function calculateRelevanceScore(item, query) {
  let score = 0;
  const queryLower = query.toLowerCase();
  const titleLower = (item.title || '').toLowerCase();
  const creatorLower = (item.creator || '').toLowerCase();
  const descriptionLower = (item.description || '').toLowerCase();
  
  // Puntos por coincidencia exacta en título
  if (titleLower.includes(queryLower)) {
    score += 3;
  }
  
  // Puntos por coincidencia exacta en creador
  if (creatorLower.includes(queryLower)) {
    score += 2;
  }
  
  // Puntos por coincidencia en descripción
  if (descriptionLower.includes(queryLower)) {
    score += 1;
  }
  
  // Bonus por coincidencia al inicio del título
  if (titleLower.startsWith(queryLower)) {
    score += 2;
  }
  
  // Bonus por título y creador que coinciden con la query
  if (titleLower.includes(queryLower) && creatorLower.includes(queryLower)) {
    score += 2;
  }
  
  return score;
}






















async function fetchOptimizedPlayableFiles(identifier) {
  const cached = enhancedCache.get('metadata', identifier);
  
  if (cached) {
    return cached;
  }
  
  const url = `https://archive.org/metadata/${identifier}`;
  
  try {
    const response = await fetchWithTimeout(url, { timeout: 10000 });
    if (!response.ok) throw new Error('Error al cargar metadatos');
    const metadata = await response.json();
    
    if (!metadata?.files) {
      throw new Error('Metadatos inválidos');
    }
    
    const audioFiles = metadata.files.filter(file => 
      isPlayableAudioFile(file)
    ).sort((a, b) => {
      const aIsMp3 = a.name.toLowerCase().endsWith('.mp3');
      const bIsMp3 = b.name.toLowerCase().endsWith('.mp3');
      
      if (aIsMp3 && !bIsMp3) return -1;
      if (!aIsMp3 && bIsMp3) return 1;
      
      return (a.size || 0) - (b.size || 0);
    });
    
    if (audioFiles.length === 0) {
      throw new Error('No hay archivos de audio reproducibles');
    }
    
    const playableFiles = createPlayableFiles(audioFiles, identifier, metadata);
    
    enhancedCache.set('metadata', identifier, playableFiles);
    
    return playableFiles;
    
  } catch (error) {
    console.error('Error al cargar archivos optimizados:', error);
    throw error;
  }
}

// ==================== FUNCIONES DE UTILIDAD SINCRÓNICAS ====================
function isPlayableAudioFile(file) {
  if (!file.name) return false;
  
  const excludePatterns = [
    /_files\.xml$/i,
    /_meta\.xml$/i,
    /_reviews\.xml$/i,
    /_archive\.torrent$/i,
    /_meta\.sqlite$/i,
    /\.png$/i,
    /\.jpg$/i,
    /\.jpeg$/i,
    /\.gif$/i,
    /_thumb\./i,
    /spectrogram/i,
    /preview/i,
    /sample/i,
    /demo/i,
    /\.rar$/i,
    /\.zip$/i,
    /\.7z$/i,
    /\.tar$/i,
    /\.gz$/i
  ];
  
  const hasExcludedPattern = excludePatterns.some(pattern => 
    pattern.test(file.name)
  );
  
  if (hasExcludedPattern) return false;
  
  const audioFormats = ['.mp3', '.ogg', '.wav', '.flac', '.m4a', '.aac'];
  const isAudioFile = audioFormats.some(format => 
    file.name.toLowerCase().endsWith(format)
  );
  
  if (!isAudioFile) return false;
  
  const fileSize = file.size || 0;
  if (fileSize < 50000) return false;
  if (fileSize > 500000000) return false;
  
  return true;
}

function createPlayableFiles(audioFiles, identifier, metadata) {
  let playableFiles;
  
  if (audioFiles.length > 1) {
    playableFiles = audioFiles
      .map((file, index) => {
        const trackInfo = extractTrackInfo(file, metadata.metadata);
        
        return {
          url: `https://archive.org/download/${identifier}/${encodeURIComponent(file.name)}`,
          title: trackInfo.title || metadata.metadata?.title || file.name || identifier,
          creator: trackInfo.artist || metadata.metadata?.creator || 'Artista desconocido',
          id: identifier,
          format: file.name.split('.').pop()?.toUpperCase() || 'MP3',
          trackNumber: trackInfo.trackNumber,
          duration: file.length || 0,
          album: metadata.metadata?.title || identifier,
          isAlbumTrack: true,
          albumId: identifier,
          trackIndex: index,
          totalTracks: audioFiles.length
        };
      })
      .sort((a, b) => {
        if (a.trackNumber !== undefined && b.trackNumber !== undefined) {
          return a.trackNumber - b.trackNumber;
        }
        return (a.title || '').localeCompare(b.title || '');
      });
  } else {
    const audioFile = audioFiles[0];
    const trackInfo = extractTrackInfo(audioFile, metadata.metadata);
    
    playableFiles = [{
      url: `https://archive.org/download/${identifier}/${encodeURIComponent(audioFile.name)}`,
      title: trackInfo.title || metadata.metadata?.title || audioFile.name || identifier,
      creator: trackInfo.artist || metadata.metadata?.creator || 'Artista desconocido',
      id: identifier,
      format: audioFile.name.split('.').pop()?.toUpperCase() || 'MP3',
      album: metadata.metadata?.title || identifier,
      isAlbumTrack: false,
      trackIndex: 0,
      totalTracks: 1
    }];
  }
  
  return playableFiles;
}

function extractTrackInfo(file, itemMetadata) {
  const result = {
    title: null,
    artist: null,
    trackNumber: null
  };
  
  if (file.title) result.title = file.title;
  if (file.artist) result.artist = file.artist;
  if (file.creator) result.artist = file.creator;
  if (file.track && !isNaN(parseInt(file.track))) {
    result.trackNumber = parseInt(file.track);
  }
  
  if (!result.title) {
    const baseName = file.name.replace(/\.[^/.]+$/, "");
    
    const patterns = [
      /^(\d+)[\s\.\-]+\s*(.+?)\s*$/,
      /^(.+?)\s*-\s*(\d+)[\s\.\-]+\s*(.+?)\s*$/,
      /^(.+?)\s*-\s*(.+?)\s*$/
    ];
    
    for (const pattern of patterns) {
      const match = baseName.match(pattern);
      if (match) {
        if (match.length === 3) {
          result.trackNumber = parseInt(match[1]);
          result.title = match[2].trim();
        } else if (match.length === 4) {
          result.artist = match[1].trim();
          result.trackNumber = parseInt(match[2]);
          result.title = match[3].trim();
        } else if (match.length === 3 && pattern === patterns[2]) {
          result.artist = match[1].trim();
          result.title = match[2].trim();
        }
        
        if (result.title) break;
      }
    }
    
    if (!result.title) {
      result.title = itemMetadata?.title || baseName;
    }
  }
  
  if (!result.artist) {
    result.artist = itemMetadata?.creator;
  }
  
  return result;
}

// ==================== CACHE DE AUDIO MEJORADO ====================
async function loadAudioWithCache(track) {
  if (!track || !track.url) {
    throw new Error('URL de audio no disponible');
  }

  try {
    // Intentar obtener de la caché primero
    const cachedBlob = await audioCache.get(track.url);
    
    if (cachedBlob) {
      console.log('Reproduciendo desde caché:', track.title);
      const blobUrl = URL.createObjectURL(cachedBlob);
      return blobUrl;
    }

    // Si no está en caché y no hay conexión, no podemos cargarlo
    if (!state.networkOnline) {
      throw new Error('Sin conexión y audio no disponible en caché');
    }

    // Cargar desde la red
    console.log('Descargando audio:', track.title);
    showStatus('Descargando audio...', 'info', 0);
    elements.playBtn.innerHTML = '<span class="loader"></span>';
    
    const response = await fetchWithTimeout(track.url, { timeout: 15000 });
    
    if (!response.ok) {
      throw new Error(`Error HTTP: ${response.status}`);
    }

    const blob = await response.blob();
    
    // Guardar en caché para uso futuro (en segundo plano)
    const isFavorite = isTrackFavorite(track);
    audioCache.put(track.url, blob, true, isFavorite).catch(error => {
      console.log('Error guardando en caché:', error);
    });

    const blobUrl = URL.createObjectURL(blob);
    
    showStatus('Audio cargado', 'info', 1000);
    return blobUrl;

  } catch (error) {
    console.error('Error cargando audio:', error);
    
    // Intentar estrategias de fallback
    if (!state.networkOnline) {
      // Precargar pistas siguientes si estamos en un contexto
      preloadNextTrack();
    }
    
    throw error;
  }
}

function preloadNextTrack() {
  if (state.playbackQueue.length > 0) {
    const nextTrack = state.playbackQueue[0];
    if (nextTrack && nextTrack.url) {
      audioCache.prefetchAudio(nextTrack.url).catch(console.error);
    }
  }
}

// ==================== SEGUIMIENTO DE ESCUCHAS ====================
function setupListenTracking() {
  let endedHandlerExecuted = false;

  elements.audio.addEventListener('play', () => {
    endedHandlerExecuted = false;
    if (state.currentTrack) {
      state.currentTrackListenStart = Date.now();
      console.log('Iniciando seguimiento de escucha para:', state.currentTrack.title);
    }
  });

  elements.audio.addEventListener('ended', async () => {
    // PREVENIR EJECUCIÓN MÚLTIPLE
    if (endedHandlerExecuted) {
      console.log('Evento ended ya ejecutado, ignorando...');
      return;
    }
    endedHandlerExecuted = true;

    if (state.currentTrack) {
      const listenDuration = Date.now() - state.currentTrackListenStart;
      const trackDuration = elements.audio.duration * 1000; // Convertir a ms
      
      // Si se escuchó al menos el 90% de la pista, marcarla como escuchada completamente
      if (listenDuration >= trackDuration * 0.9) {
        await audioCache.markAsFullyListened(state.currentTrack.url);
        console.log('Pista marcada como escuchada completamente:', state.currentTrack.title);
        
        // Reemplazar en cola FIFO cuando se completa la reproducción
        if (isTrackFavorite(state.currentTrack)) {
          console.log('Reemplazando favorito en cola FIFO por reproducción completada');
          await audioCache.replaceFavoritesQueueItem(state.currentTrack.url, null, state.favorites);
        }
        
        // Actualizar estadísticas de uso
        const stats = await audioCache.getUsageStats();
        if (stats && stats.usagePercentage > 90) {
          showStatus(`Almacenamiento: ${stats.usagePercentage.toFixed(1)}% utilizado`, 'info', 3000);
        }
      } else {
        // Registrar que se saltó temprano
        const skipCount = state.tracksSkippedEarly.get(state.currentTrack.url) || 0;
        state.tracksSkippedEarly.set(state.currentTrack.url, skipCount + 1);
        console.log(`Pista saltada temprano: ${state.currentTrack.title} (${skipCount + 1} veces)`);
      }
      
      state.currentTrackListenStart = 0;
    }

    // CORRECCIÓN: Pequeño delay antes de reproducir siguiente canción
    // para evitar conflictos con el sistema de caché
    setTimeout(() => {
      playNextInContext();
    }, 100);
  });

  elements.audio.addEventListener('seeked', () => {
    // Si el usuario busca hacia atrás, reiniciar el contador de escucha
    if (state.currentTrackListenStart > 0) {
      state.currentTrackListenStart = Date.now();
    }
  });
}

// ==================== FUNCIONES DE INTERFAZ ====================
function setupSearchOnEnter() {
  elements.searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      state.currentSearchPage = 0;
      state.currentSearchQuery = elements.searchInput.value.trim();
      if (state.currentSearchQuery) {
        performOptimizedSearch(state.currentSearchQuery, 0)
          .then(result => displaySearchResults(result, true));
      } else {
        hideSearchResults();
      }
    } else if (e.key === 'Escape') {
      hideSearchResults();
    }
  });
}

function setupSearchFocusBehavior() {
  let lastSearchQuery = '';
  let isCleaning = false;
  
  elements.searchInput.addEventListener('focus', () => {
    if (isCleaning) return;
    
    // Mostrar resultados solo si hay coincidencia exacta con la última búsqueda
    if (state.searchResults.length > 0 && 
        elements.searchInput.value.trim() === state.currentSearchQuery &&
        state.currentSearchQuery.length > 0) {
      elements.searchResults.classList.add('active');
      state.searchActive = true;
    }
  });
  
  elements.searchInput.addEventListener('input', (e) => {
    const currentQuery = e.target.value.trim();
    
    // Detectar si el usuario está borrando
    if (currentQuery.length < lastSearchQuery.length) {
      isCleaning = true;
      
      // Realizar limpieza completa inmediatamente
      performCompleteCleanup();
      
      // Si el campo no está vacío después de borrar, 
      // podrías considerar hacer una nueva búsqueda después de un delay
      if (currentQuery.length > 0) {
        setTimeout(() => {
          isCleaning = false;
        }, 100);
      }
    } else {
      isCleaning = false;
    }
    
    lastSearchQuery = currentQuery;
  });

  // También limpiar cuando el usuario pegue texto (podría ser una modificación)
  elements.searchInput.addEventListener('paste', () => {
    setTimeout(() => {
      performCompleteCleanup();
    }, 50);
  });

  // Limpiar cuando se use el botón "x" nativo del input en algunos navegadores
  elements.searchInput.addEventListener('search', () => {
    if (elements.searchInput.value === '') {
      performCompleteCleanup();
    }
  });
}

function performCompleteCleanup() {
  // Ocultar resultados visualmente
  hideSearchResults();
  
  // Limpiar estado de búsqueda
  state.searchResults = [];
  state.currentSearchQuery = '';
  state.currentSearchPage = 0;
  state.currentSearchHasMore = false;
  state.isLoadingMore = false;
  state.searchActive = false;
  
  // Limpiar el DOM
  elements.searchResultsList.innerHTML = '';
  
  // Limpiar timeouts
  if (state.searchTimeout) {
    clearTimeout(state.searchTimeout);
    state.searchTimeout = null;
  }
  
  // Limpiar cualquier observador de lazy loading
  const lazyObserver = elements.searchResultsList.querySelector('.lazy-load-observer');
  if (lazyObserver) {
    lazyObserver.remove();
  }
  
  console.log('✅ Limpieza completa realizada: resultados ocultos y estado resetado');
}

function hideSearchResults() {
  // Ocultar visualmente los resultados
  elements.searchResults.classList.remove('active');
  state.searchActive = false;
  
  // Limpiar el estado de búsqueda
  state.searchResults = [];
  state.currentSearchQuery = '';
  state.currentSearchPage = 0;
  state.currentSearchHasMore = false;
  
  // Limpiar el DOM
  elements.searchResultsList.innerHTML = '';
  
  // Limpiar cualquier timeout pendiente
  if (state.searchTimeout) {
    clearTimeout(state.searchTimeout);
    state.searchTimeout = null;
  }
  
  // Remover cualquier observador de lazy loading
  const lazyObserver = elements.searchResultsList.querySelector('.lazy-load-observer');
  if (lazyObserver) {
    lazyObserver.remove();
  }
  
  console.log('Resultados de búsqueda ocultos y limpiados');
}

function displaySearchResults(searchData, clearExisting = true) {
  const { results, hasMore, total } = searchData;
  
  if (clearExisting) {
    elements.searchResultsList.innerHTML = '';
    state.searchResults = results;
    state.currentSearchPage = 0;
    state.currentSearchHasMore = hasMore;
    state.currentSearchQuery = elements.searchInput.value.trim();
  } else {
    state.searchResults = [...state.searchResults, ...results];
    state.currentSearchHasMore = hasMore;
  }

  if (results.length === 0 && clearExisting) {
    elements.searchResultsList.innerHTML = '<div class="no-results">No se encontraron resultados</div>';
    elements.searchResults.classList.add('active');
    return;
  }

  const fragment = document.createDocumentFragment();
  
  results.forEach((result, index) => {
    const globalIndex = clearExisting ? index : state.searchResults.length - results.length + index;
    const resultEl = createSearchResultElement(result, globalIndex);
    fragment.appendChild(resultEl);
  });

  if (clearExisting) {
    elements.searchResultsList.appendChild(fragment);
  } else {
    // Eliminar el observador anterior si existe
    const existingObserver = elements.searchResultsList.querySelector('.lazy-load-observer');
    if (existingObserver) {
      existingObserver.remove();
    }
    
    elements.searchResultsList.appendChild(fragment);
  }

  // Configurar lazy loading si hay más resultados
  if (hasMore && SEARCH_CONFIG.enableLazyLoading) {
    setupLazyLoadingObserver();
  }

  elements.searchResults.classList.add('active');
}

function setupLazyLoadingObserver() {
  // Crear elemento observador
  const observerElement = document.createElement('div');
  observerElement.className = 'lazy-load-observer';
  elements.searchResultsList.appendChild(observerElement);

  // Configurar Intersection Observer
  const observer = new IntersectionObserver(async (entries) => {
    if (entries[0].isIntersecting && 
        state.currentSearchHasMore && 
        !state.isLoadingMore) {
      
      state.isLoadingMore = true;
      state.currentSearchPage++;
      
      try {
        const result = await performOptimizedSearch(state.currentSearchQuery, state.currentSearchPage);
        displaySearchResults(result, false);
      } catch (error) {
        console.error('Error en lazy loading:', error);
      } finally {
        state.isLoadingMore = false;
      }
    }
  }, {
    rootMargin: '100px', // Cargar antes de llegar al final
    threshold: 0.1
  });

  observer.observe(observerElement);
}

// ==================== FUNCIÓN TOGGLE ALBUM TRACKS ====================

    tracksContainer.style.display = 'block';

    expandButton.innerHTML = '▼ <span>Ver pistas</span>';

// ==================== FUNCIÓN PLAY SPECIFIC TRACK ====================
async function playSpecificTrack(track, albumId, trackIndex, totalTracks) {
  if (state.isLoading) return;
  
  state.isLoading = true;
  elements.playBtn.disabled = true;
  elements.playBtn.innerHTML = '<span class="loader"></span>';
  
  try {
    hideSearchResults();
    showStatus(`Cargando: ${track.title}`, 'info', 0);
    
    if (totalTracks > 1) {
      const files = await fetchOptimizedPlayableFiles(albumId);
      playbackManager.setAlbumPlaylist(albumId, files, trackIndex);
      state.albumOrigin = 'search';
      
      // Cargar cola FIFO con las pistas del álbum
      loadPlaybackQueue('album', files, trackIndex);
    }
    
    await playAudioTrackOptimized(track, albumId, trackIndex, totalTracks);
    
    // Ocultar resultados de búsqueda después de seleccionar una pista
    hideSearchResults();
    
  } catch (error) {
    console.error('Error en playSpecificTrack:', error);
    showStatus(`Error: ${error.message}`, 'error');
  } finally {
    state.isLoading = false;
    elements.playBtn.disabled = false;
    elements.playBtn.textContent = '||';
  }
}
