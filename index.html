<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Resonate</title>

<!-- PWA Manifest -->
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Resonate">
<link rel="apple-touch-icon" type="image/svg+xml" href="icons/favicon.svg">

<style>
  :root {
    --bg: #000;
    --fg: #e7e9ee;
    --muted: #888;
    --accent: #6ee7b7;
    --card: #1a1a1a;
    --btn: #222;
    --error: #ff6b6b;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    overflow: hidden;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 10px;
    position: relative;
    overflow: hidden;
  }

  header {
    flex-shrink: 0;
    display: flex;
    justify-content: left;
    align-items: center;
  }

  h1 {
    font-size: 20px;
    font-weight: 600;
    text-align: left;
    padding: 8px;
    color: var(--accent);
  }

  .player-container {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    -webkit-overflow-scrolling: touch;
  }

  .player-container::-webkit-scrollbar {
    width: 4px;
  }

  .player-container::-webkit-scrollbar-track {
    background: transparent;
  }

  .player-container::-webkit-scrollbar-thumb {
    background: var(--muted);
    border-radius: 2px;
  }

  .player-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 10px;
  }

  .app.active .player-content {
    opacity: 1;
  }

  .art {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    max-width: 280px;
    aspect-ratio: 1;
    margin: 0 auto;
    margin-top: 30px;
    border-radius: 8px;
    background: var(--card);
    overflow: hidden;
    flex-shrink: 0;
  }

  .art img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .art .hint {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 0 10px;
  }

  .current-track-info {
    text-align: center;
    width: 100%;
    flex-shrink: 0;
    padding: 0 10px;
  }

  .title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .creator {
    color: var(--muted);
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .progress-section {
    width: 100%;
    margin: 5% 0;
    flex-shrink: 0;
  }

  .progress-bar {
    width: 100%;
    height: 6px;
    background: var(--card);
    border-radius: 3px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    transition: height 0.2s;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }

  .progress-bar:hover {
    height: 10px;
  }

  .progress {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    width: 0%;
    will-change: width;
    transition: width 0.1s linear;
    position: relative;
  }

  .progress::after {
    content: '';
    position: absolute;
    right: -5px;
    top: 50%;
    transform: translateY(-50%);
    width: 10px;
    height: 10px;
    background: var(--accent);
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .progress-bar:hover .progress::after {
    opacity: 1;
  }

  .progress-bar.dragging .progress::after {
    opacity: 1;
  }

  .time-controls {
    display: flex;
    justify-content: space-between;
    margin-top: 4px;
  }

  .current-time, .total-time {
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    font-size: 11px;
  }

  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin: 7% 2px;
    flex-shrink: 0;
  }

  button {
    height: 40px;
    border: none;
    border-radius: 10px;
    background: var(--btn);
    color: var(--accent);
    font-size: 19px;
    cursor: pointer;
    padding: 0 14px;
    transition: transform 0.1s, background-color 0.2s;
    touch-action: manipulation;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  button:active:not(:disabled) {
    transform: scale(0.96);
    border: none;
  }

  .play-btn {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: var(--accent);
    color: #000;
    font-weight: bold;
    font-size: 19px;
  }

  .prev-btn {
    min-width: 68px;
    min-height: 40px;
  } 
  
  .next-btn {
    min-width: 68px;
    min-height: 40px;
  }

  .favorite-btn {
    background: var(--btn);
    color: var(--muted);
    font-size: 19px;
    width: 68px;
    height: 40px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .favorite-btn.active {
    color: #ff6b6b;
  }

  .shuffle-favorites-btn {
    background: var(--btn);
    color: var(--muted);
    font-size: 19px;
    width: 68px;
    height: 40px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .shuffle-favorites-btn.active {
    color: var(--accent);
    background: var(--btn);
    outline: 2px solid var(--accent);
  }

  .shuffle-favorites-btn svg {
    width: 19px;
    height: 19px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .shuffle-favorites-btn.active svg {
    stroke:var(--accent);
  }

  .genre-section {
    margin: 6px 0;
    flex-shrink: 0;
    width: 100%;
    padding: 0 5px;
    display: none;
  }

  .genre-label {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 5px;
  }

  select {
    width: 100%;
    height: 38px;
    border: none;
    border-radius: 10px;
    background: var(--btn);
    color: var(--fg);
    font-size: 13px;
    cursor: pointer;
    padding: 0 10px;
  }

  select:focus {
    outline: 2px solid var(--accent);
  }
  
  .favorites-section {
    flex-shrink: 0;
    width: 100%;
    padding: 0 5px;
  }

  .favorites-header {
    display: none;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 5px;
    padding: 5px 0;
  }

  .favorites-label {
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
  }

  .favorites-toggle {
    background: var(--btn);
    border: none;
    color: var(--accent);
    font-size: 12px;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 8px;
    height: auto;
    font-weight: 500;
  }

  .favorites-toggle:active {
    background: var(--card);
  }

  .favorites-list {
    max-height: 300px;
    overflow-y: auto;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    margin-top: 6px;
    display: none;
    background: var(--card);
  }

  .favorites-list.active {
    display: block;
  }

  .favorite-item {
    padding: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background-color 0.2s;
  }

  .favorite-item:last-child {
    border-bottom: none;
  }

  .favorite-item:hover {
    background: rgba(255,255,255,0.05);
  }

  .favorite-item:active {
    background: #111;
  }

  .favorite-info {
    flex: 1;
    min-width: 0;
    text-align: left;
  }

  .favorite-title {
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .favorite-creator {
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .favorite-actions {
    display: flex;
    gap: 5px;
  }

  .favorite-play {
    background: var(--accent);
    border: none;
    color: #000;
    font-size: 10px;
    cursor: pointer;
    padding: 4px 7px;
    border-radius: 5px;
    font-weight: bold;
    height: auto;
  }

  .favorite-remove {
    background: transparent;
    border: none;
    color: var(--error);
    font-size: 13px;
    cursor: pointer;
    padding: 4px;
    border-radius: 5px;
    height: auto;
  }

  .favorite-remove:active {
    background: rgba(255,107,107,0.1);
  }

  .album-indicator {
    background: rgba(110, 231, 183, 0.2);
    color: var(--accent);
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 6px;
    font-weight: bold;
  }

  .tracks-list {
    margin-top: 8px;
    border-radius: 6px;
    overflow: hidden;
    background: rgba(255,255,255,0.03);
  }

  .track-item {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background-color 0.2s;
    text-align: left;
  }

  .track-item:last-child {
    border-bottom: none;
  }

  .track-item:hover {
    background: rgba(255,255,255,0.05);
  }

  .track-item-info {
    flex: 1;
    min-width: 0;
    text-align: left;
  }

  .track-title {
    width: 100%;
    font-weight: 500;
    font-size: 12px;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .track-creator {
    color: var(--muted);
    font-size: 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .track-actions {
    display: flex;
    gap: 5px;
    align-items: center;
  }

  .track-play {
    background: var(--accent);
    border: none;
    color: #000;
    font-size: 9px;
    cursor: pointer;
    padding: 3px 6px;
    border-radius: 4px;
    font-weight: bold;
    height: auto;
  }

  .track-favorite {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    padding: 3px;
    border-radius: 4px;
    height: auto;
  }

  .track-favorite.active {
    color: #ff6b6b;
  }

  .track-number {
    color: var(--muted);
    font-size: 10px;
    margin-right: 8px;
    min-width: 20px;
    text-align: right;
  }

  .expand-tracks {
    background: transparent;
    border: none;
    color: var(--accent);
    font-size: 11px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .expand-tracks:active {
    background: rgba(110, 231, 183, 0.1);
  }

  .tracks-container {
    overflow-x: clip;
    overflow-x: hidden;
    max-width: 100%;
    box-sizing: border-box;
  }
  
  .search-section {
    padding: 2px 4px;
  }

  .search-container {
    position: relative;
    display: flex;
    margin: 0 2px;
  }

  .search-input {
    flex: 1;
    height: 40px;
    background: var(--card);
    border: none;
    border-radius: 10px;
    color: var(--fg);
    font-size: 15px;
    padding: 0 8px;
  }

  .search-input:focus {
    outline: 2px solid var(--accent);
    position: relative;
    color: var(--fg);
  }

  .search-input::placeholder {
    color: var(--muted);
  }

  .search-button {
    display: none;
  }

  .search-results {
    border-radius: 10px;
    overflow-y: auto;
    display: none;
  }

  .search-results.active {
    display: block;
    opacity: 1;
    margin-top: 5px;
    background: var(--card);
    margin-left: 10px;
  }

  .search-results-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  .search-results-controls {
    display: flex;
    gap: 8px;
  }

  .search-control-btn {
    background: var(--btn);
    border: none;
    color: var(--accent);
    font-size: 11px;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 6px;
    height: auto;
    font-weight: 500;
  }

  .search-control-btn:active {
    background: var(--card);
  }

  .search-results-list {
    max-height: 400px;
    overflow-y: auto;
  }

  .search-result {
    padding: 12px;
    border-bottom: 1px solid rgba(226, 29, 29, 0.06);
    cursor: pointer;
    display: flex;
    justify-content: flex-start;
    align-items: baseline;
    transition: background-color 0.2s;
    text-align: left;
    flex-direction: row;
    flex-wrap: wrap;
  }

  .search-result:last-child {
    border-bottom: none;
  }

  .search-result:hover {
    background: rgba(255,255,255,0.05);
  }

  .search-result:active {
    background: #111;
  }

  .result-info {
    flex: 1;
    min-width: 0;
    text-align: left;
  }

  .result-title {
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .result-creator {
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .result-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
  }

  .result-album-indicator {
    background: var(--accent);
    color: #000;
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: bold;
  }

  .result-favorite {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    padding: 5px;
    margin-left: 5px;
    border-radius: 5px;
    transition: background-color 0.2s;
  }

  .result-favorite:active {
    background: rgba(255,255,255,0.1);
  }

  .result-favorite.active {
    color: #ff6b6b;
  }

  .no-results {
    padding: 5px;
    text-align: center;
    color: var(--error);
    font-size: 15px;
    font-weight: bold;
  }

  .search-loading {
    padding: 5px;
    text-align: center;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .load-more {
    text-align: center;
    padding: 12px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  .load-more-btn {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s;    
    text-align: center;
    display: inline-block;
  }

  .load-more-btn:active {
    transform: scale(0.95);
  }

  .status-messages {
    margin: 0;
    min-height: 5px;
    text-align: left;
    display: none;
  }

  .status-message {
    background: var(--card);
    border-radius: 7px;
    font-size: 12px;
    padding: 8px 10px;
    margin: 3px 0;
  }

  .status-info {
    border-left: 3px solid var(--accent);
  }

  .status-error {
    border-left: 3px solid var(--error);
  }

  .loader {
    display: inline-flex;
    width: 15px;
    height: 15px;
    border: 2px solid var(--muted);
    border-radius: 50%;
    border-top-color: var(--accent);
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .start-view {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: var(--bg);
    z-index: 1000;
    transition: opacity 0.4s, visibility 0.4s;
  }

  .start-view.hidden {
    opacity: 0;
    visibility: hidden;
  }

  .start-title {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 0.8rem;
    text-align: center;
  }

  .start-subtitle {
    font-size: 0.9rem;
    color: var(--muted);
    margin-bottom: 1.8rem;
    text-align: center;
    max-width: 80%;
  }

  .start-button {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 14px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    padding: 12px 24px;
    box-shadow: 0 6px 20px rgba(110, 231, 183, 0.25);
  }

  .start-button:active {
    transform: scale(0.97);
  }

  .footer {
    color: var(--muted);
    font-size: 9px;
    text-align: center;
  }
</style>
</head>

<body>
<div class="start-view" id="start-view">
  <button id="start-button" class="start-button" onclick="startApp()">Iniciar Resonate</button>
</div>

<div id="status-messages"></div>

<div class="app" id="app">
  <header>
      <h1>Resonate</h1>
  </header>

  <div class="favorites-section">
    <div class="favorites-header">
      <div class="favorites-label">Favoritos</div>
      <button id="favorites-toggle" class="favorites-toggle">Mostrar favoritos</button>
    </div>
    <div id="favorites-list" class="favorites-list"></div>
  </div>

  <div class="search-section">
    <div class="search-container">
      <input type="text" id="search-input" class="search-input" placeholder="Buscar">
    </div>
  </div>
  <div id="search-results" class="search-results">
    <div class="search-results-header">
      <div class="search-results-controls">
        <button id="play-random-search" class="search-control-btn">Reproducir Aleatorio</button>
        <button id="hide-results-btn" class="search-control-btn">Ocultar Resultados</button>
      </div>
    </div>
    <div id="search-results-list" class="search-results-list"></div>
  </div>

  <div class="player-container">
    <div class="player-content" id="player-content">
      <div class="art" id="art">
        <span class="hint"></span>
      </div>
      
      <div class="current-track-info">
        <div class="title" id="title"></div>
        <div class="creator" id="creator"></div>
      </div>

      <div class="controls">
        <button id="prev-btn" class="prev-btn" aria-label="Anterior">⏮</button>
        <button id="play-btn" class="play-btn" aria-label="Reproducir/Pausar">▶</button>
        <button id="next-btn" class="next-btn" aria-label="Siguiente">⏭</button>
        <button id="favorite-btn" class="favorite-btn" aria-label="Favorito">🩶</button>
        <button id="shuffle-favorites-btn" class="shuffle-favorites-btn" aria-label="Desactivar reproducción aleatoria de favoritos">
          <svg viewBox="0 0 24 24">
            <path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>
          </svg>
        </button>
      </div>
      
      <div class="progress-section">
        <div class="progress-bar" id="progress-bar">
          <div class="progress" id="progress"></div>
        </div>
        <div class="time-controls">
          <span class="current-time" id="current-time">0:00</span>
          <span class="total-time" id="total-time">0:00</span>
        </div>
      </div>
      
      <div class="genre-section">
        <select id="genre-select">
            <option value="classical">Clásica</option>
            <option value="jazz">Jazz</option>
            <option value="rock" selected>Rock</option>
            <option value="electronic">Electrónica</option>
            <option value="reggae">Reggae</option>
            <option value="blues">Blues</option>
            <option value="hiphop">Hip Hop</option>
            <option value="pop">Pop</option>
            <option value="metal">Metal</option>
            <option value="folk">Folk</option>
            <option value="country">Country</option>
            <option value="rnb">R&B</option>
            <option value="latin">Latina</option>
            <option value="ambient">Ambient</option>
            <option value="punk">Punk</option>
            <option value="funk">Funk</option>
            <option value="soul">Soul</option>
            <option value="disco">Disco</option>
            <option value="indie">Indie</option>
            <option value="alternative">Alternativa</option>
        </select>
      </div>
    </div>
  </div>

<script>

// ==================== CONFIGURACIÓN PRINCIPAL ====================
const SEARCH_CONFIG = {
  maxResults: 50,
  resultsPerPage: 5,
  timeout: 8000,
  enableLazyLoading: true,
  cacheDuration: 10 * 60 * 1000,
  preloadMetadata: false
};

// ==================== SISTEMA DE CACHÉ AVANZADO ====================
class AdvancedAudioCache {
  constructor() {
    this.dbName = 'ResonateAudioCache';
    this.dbVersion = 4;
    this.storeName = 'audioFiles';
    this.maxSize = 10 * 1024 * 1024 * 1024; // 10GB máximo
    this.currentSize = 0;
    this.db = null;
    this.initialized = false;
    this.listenStats = new Map();
    this.favoritesQueue = []; // Cola FIFO para favoritos precargados
    this.maxFavorites = 10; // Máximo de favoritos precargados
    this.favoritesQueueLock = false; // Bloqueo para evitar conflictos
  }

  async init() {
    if (this.initialized) return;
    
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(this.dbName, this.dbVersion);
      
      request.onerror = () => {
        console.error('Error abriendo IndexedDB:', request.error);
        reject(request.error);
      };
      
      request.onsuccess = () => {
        this.db = request.result;
        this.initialized = true;
        this.calculateSize().then(resolve);
      };
      
      request.onupgradeneeded = (event) => {
        const db = event.target.result;
        if (!db.objectStoreNames.contains(this.storeName)) {
          const store = db.createObjectStore(this.storeName, { keyPath: 'url' });
          store.createIndex('timestamp', 'timestamp', { unique: false });
          store.createIndex('size', 'size', { unique: false });
          store.createIndex('playCount', 'playCount', { unique: false });
          store.createIndex('lastPlayed', 'lastPlayed', { unique: false });
          store.createIndex('fullyListened', 'fullyListened', { unique: false });
          store.createIndex('isFavorite', 'isFavorite', { unique: false });
        } else {
          const store = event.currentTarget.transaction.objectStore(this.storeName);
          if (!store.indexNames.contains('playCount')) {
            store.createIndex('playCount', 'playCount', { unique: false });
          }
          if (!store.indexNames.contains('lastPlayed')) {
            store.createIndex('lastPlayed', 'lastPlayed', { unique: false });
          }
          if (!store.indexNames.contains('fullyListened')) {
            store.createIndex('fullyListened', 'fullyListened', { unique: false });
          }
          if (!store.indexNames.contains('isFavorite')) {
            store.createIndex('isFavorite', 'isFavorite', { unique: false });
          }
        }
      };
    });
  }

  async calculateSize() {
    if (!this.db) return 0;
    
    return new Promise((resolve) => {
      const transaction = this.db.transaction([this.storeName], 'readonly');
      const store = transaction.objectStore(this.storeName);
      const request = store.getAll();
      
      request.onsuccess = () => {
        this.currentSize = request.result.reduce((total, item) => total + (item.size || 0), 0);
        console.log(`Tamaño actual de caché: ${(this.currentSize / 1024 / 1024).toFixed(2)}MB`);
        
        if (this.currentSize > this.maxSize * 0.9) {
          this.showStorageWarning();
        }
        
        resolve(this.currentSize);
      };
    });
  }

  async get(url) {
    if (!this.initialized) await this.init();
    
    return new Promise((resolve) => {
      const transaction = this.db.transaction([this.storeName], 'readwrite');
      const store = transaction.objectStore(this.storeName);
      const request = store.get(url);
      
      request.onsuccess = () => {
        if (request.result) {
          request.result.lastAccessed = Date.now();
          request.result.playCount = (request.result.playCount || 0) + 1;
          store.put(request.result);
          resolve(request.result.blob);
        } else {
          resolve(null);
        }
      };
      
      request.onerror = () => resolve(null);
    });
  }

  async put(url, blob, updateSize = true, isFavorite = false) {
    if (!this.initialized) await this.init();
    if (!blob) return;
    
    const existing = await this.get(url);
    if (existing) {
      console.log('Pista ya existe en caché, actualizando:', url);
      if (isFavorite) {
        await this.markAsFavorite(url);
      }
      return true;
    }
    
    const item = {
      url: url,
      blob: blob,
      size: blob.size,
      timestamp: Date.now(),
      lastAccessed: Date.now(),
      playCount: 0,
      fullyListened: false,
      lastPlayed: null,
      isFavorite: isFavorite
    };
    
    return new Promise(async (resolve) => {
      if (updateSize) {
        this.currentSize += blob.size;
        await this.ensureSpace();
      }
      
      const transaction = this.db.transaction([this.storeName], 'readwrite');
      const store = transaction.objectStore(this.storeName);
      const request = store.put(item);
      
      request.onsuccess = () => {
        console.log('Pista almacenada en caché:', url, `(${(blob.size / 1024 / 1024).toFixed(2)}MB)`);
        
        if (isFavorite) {
          this.addToFavoritesQueue(url);
        }
        
        resolve(true);
      };
      request.onerror = () => resolve(false);
    });
  }

  async markAsFullyListened(url) {
    if (!this.initialized) await this.init();
    
    return new Promise((resolve) => {
      const transaction = this.db.transaction([this.storeName], 'readwrite');
      const store = transaction.objectStore(this.storeName);
      const request = store.get(url);
      
      request.onsuccess = () => {
        if (request.result) {
          const item = request.result;
          item.fullyListened = true;
          item.lastPlayed = Date.now();
          store.put(item);
          console.log('Pista marcada como escuchada completamente:', url);
          resolve(true);
        } else {
          resolve(false);
        }
      };
      
      request.onerror = () => resolve(false);
    });
  }

  async markAsFavorite(url) {
    if (!this.initialized) await this.init();
    
    return new Promise((resolve) => {
      const transaction = this.db.transaction([this.storeName], 'readwrite');
      const store = transaction.objectStore(this.storeName);
      const request = store.get(url);
      
      request.onsuccess = () => {
        if (request.result) {
          const item = request.result;
          item.isFavorite = true;
          item.lastAccessed = Date.now();
          store.put(item);
          
          this.addToFavoritesQueue(url);
          
          console.log('Pista marcada como favorita:', url);
          resolve(true);
        } else {
          resolve(false);
        }
      };
      
      request.onerror = () => resolve(false);
    });
  }

  async remove(url) {
    if (!this.initialized) await this.init();
    
    return new Promise((resolve) => {
      const transaction = this.db.transaction([this.storeName], 'readwrite');
      const store = transaction.objectStore(this.storeName);
      const request = store.get(url);
      
      request.onsuccess = () => {
        if (request.result) {
          this.currentSize -= request.result.size;
          store.delete(url);
          
          this.removeFromFavoritesQueue(url);
          
          console.log('Pista eliminada de caché:', url);
          resolve(true);
        } else {
          resolve(false);
        }
      };
      
      request.onerror = () => resolve(false);
    });
  }

  // ==================== GESTIÓN DE COLA FIFO PARA FAVORITOS ====================
  
  addToFavoritesQueue(url) {
    // Evitar duplicados
    this.removeFromFavoritesQueue(url);
    
    // Agregar al final de la cola
    this.favoritesQueue.push(url);
    
    console.log(`Favorito agregado a cola FIFO: ${url} (${this.favoritesQueue.length}/${this.maxFavorites})`);
  }
  
  removeFromFavoritesQueue(url) {
    const index = this.favoritesQueue.indexOf(url);
    if (index !== -1) {
      this.favoritesQueue.splice(index, 1);
      console.log(`Favorito removido de cola FIFO: ${url}`);
    }
  }
  
  getFavoritesQueue() {
    return [...this.favoritesQueue];
  }

  // NUEVO MÉTODO: Reemplazar favorito en cola FIFO basado en contexto
  async replaceFavoritesQueueItem(oldUrl, newUrl, favorites) {
    if (this.favoritesQueueLock) {
      console.log('Cola FIFO bloqueada, esperando...');
      return false;
    }
    
    this.favoritesQueueLock = true;
    
    try {
      // Remover el favorito antiguo
      this.removeFromFavoritesQueue(oldUrl);
      
      // Si newUrl no está especificado, elegir uno aleatorio de los favoritos
      if (!newUrl && favorites && favorites.length > 0) {
        const availableFavorites = favorites.filter(fav => 
          fav && fav.url && !this.favoritesQueue.includes(fav.url)
        );
        
        if (availableFavorites.length > 0) {
          const randomIndex = Math.floor(Math.random() * availableFavorites.length);
          newUrl = availableFavorites[randomIndex].url;
          console.log(`Seleccionado favorito aleatorio para reemplazo: ${newUrl}`);
        }
      }
      
      // Agregar el nuevo favorito si está disponible
      if (newUrl) {
        this.addToFavoritesQueue(newUrl);
        
        // Precargar el nuevo favorito
        await this.prefetchAudio(newUrl, true);
        
        console.log(`Reemplazo completado: ${oldUrl} -> ${newUrl}`);
        return true;
      } else {
        console.log('No hay favoritos disponibles para reemplazo');
        return false;
      }
    } catch (error) {
      console.error('Error en replaceFavoritesQueueItem:', error);
      return false;
    } finally {
      this.favoritesQueueLock = false;
    }
  }

  // ==================== PRECARGA ALEATORIA DE FAVORITOS ====================
  
  async preloadFavorites(favorites) {
    if (!this.initialized) await this.init();
    
    console.log('Precargando favoritos aleatoriamente en cola FIFO...');
    
    // Limpiar cola actual
    this.favoritesQueue = [];
    
    if (favorites.length === 0) {
      console.log('No hay favoritos para precargar');
      return;
    }
    
    // SELECCIÓN COMPLETAMENTE ALEATORIA - Sin criterios
    const shuffledFavorites = this.shuffleArray([...favorites]);
    const favoritesToPreload = shuffledFavorites.slice(0, this.maxFavorites);
    
    console.log(`Seleccionados ${favoritesToPreload.length} favoritos aleatorios para precargar`);
    
    const preloadPromises = [];
    
    for (const favorite of favoritesToPreload) {
      if (favorite && favorite.url) {
        preloadPromises.push(this.prefetchFavorite(favorite));
      }
    }
    
    // Esperar a que todas las precargas se completen
    await Promise.allSettled(preloadPromises);
    console.log(`Precarga de favoritos aleatorios completada: ${this.favoritesQueue.length}/${this.maxFavorites}`);
  }
  
  async prefetchFavorite(favorite) {
    try {
      // Verificar si ya está en caché
      const existing = await this.get(favorite.url);
      if (!existing) {
        // Precargar en segundo plano
        const success = await this.prefetchAudio(favorite.url, true);
        if (success) {
          console.log('Favorito aleatorio precargado:', favorite.title);
        }
      } else {
        // Ya está en caché, agregar a la cola
        this.addToFavoritesQueue(favorite.url);
        await this.markAsFavorite(favorite.url);
        console.log('Favorito aleatorio ya estaba en caché:', favorite.title);
      }
    } catch (error) {
      console.log('Error precargando favorito aleatorio:', error);
    }
  }
  
  // Función para mezclar array aleatoriamente (Fisher-Yates)
  shuffleArray(array) {
    const newArray = [...array];
    for (let i = newArray.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
    }
    return newArray;
  }
  
  async ensureSpace() {
    if (this.currentSize <= this.maxSize) return;
    
    console.log('Liberando espacio en caché...');
    
    const transaction = this.db.transaction([this.storeName], 'readwrite');
    const store = transaction.objectStore(this.storeName);
    const index = store.index('lastAccessed');
    
    const request = index.getAll();
    
    request.onsuccess = async () => {
      const items = request.result.sort((a, b) => {
        if (a.isFavorite !== b.isFavorite) {
          return a.isFavorite ? 1 : -1;
        }
        if (a.fullyListened !== b.fullyListened) {
          return a.fullyListened ? 1 : -1;
        }
        return a.lastAccessed - b.lastAccessed;
      });
      
      let freedSpace = 0;
      const targetSize = this.maxSize * 0.85;
      
      for (const item of items) {
        if (this.currentSize - freedSpace <= targetSize) break;
        
        if (this.favoritesQueue.includes(item.url)) {
          continue;
        }
        
        const deleteRequest = store.delete(item.url);
        freedSpace += item.size;
        
        deleteRequest.onsuccess = () => {
          this.currentSize -= item.size;
        };
      }
      
      console.log(`Espacio liberado: ${(freedSpace / 1024 / 1024).toFixed(2)}MB`);
      
      if (this.currentSize > this.maxSize * 0.9) {
        this.showStorageWarning();
      }
    };
  }

  showStorageWarning() {
    if (document.hidden || !state.userInteracted) return;
    
    showStatus('El almacenamiento está casi lleno. ¿Desea aumentar el límite en 3GB?', 'error', 10000);
    
    setTimeout(() => {
      if (confirm('El almacenamiento de Resonate está casi lleno. ¿Desea aumentar el límite en 3GB para continuar almacenando pistas?')) {
        this.increaseStorageLimit(3 * 1024 * 1024 * 1024);
        showStatus('Límite aumentado exitosamente', 'info', 3000);
      }
    }, 1000);
  }

  increaseStorageLimit(additionalBytes) {
    this.maxSize += additionalBytes;
    console.log(`Nuevo límite de almacenamiento: ${(this.maxSize / 1024 / 1024 / 1024).toFixed(2)}GB`);
  }

  async preloadTracks(tracks, isInitial = false) {
    if (!this.initialized) await this.init();
    
    if (isInitial) {
      console.log('Precargando 10 pistas iniciales en caché...');
    }
    
    const count = isInitial ? 10 : 1;
    const preloadPromises = [];
    
    for (const track of tracks.slice(0, count)) {
      if (track && track.url) {
        try {
          const existing = await this.get(track.url);
          if (!existing) {
            preloadPromises.push(this.prefetchAudio(track.url));
          }
        } catch (error) {
          console.log('Error precargando pista:', error);
        }
      }
    }
    
    await Promise.allSettled(preloadPromises);
    if (isInitial) {
      console.log(`Precarga inicial completada: ${preloadPromises.length} pistas`);
    }
  }

  async prefetchAudio(url, isFavorite = false) {
    try {
      const response = await fetch(url);
      if (response.ok) {
        const blob = await response.blob();
        await this.put(url, blob, true, isFavorite);
        return true;
      }
    } catch (error) {
      console.log('Error en prefetch:', error);
    }
    return false;
  }

  async getUsageStats() {
    if (!this.initialized) await this.init();
    
    return new Promise((resolve) => {
      const transaction = this.db.transaction([this.storeName], 'readonly');
      const store = transaction.objectStore(this.storeName);
      const request = store.getAll();
      
      request.onsuccess = () => {
        const items = request.result;
        const stats = {
          totalTracks: items.length,
          totalSize: this.currentSize,
          fullyListened: items.filter(item => item.fullyListened).length,
          favorites: items.filter(item => item.isFavorite).length,
          favoritesPreloaded: this.favoritesQueue.length,
          maxSize: this.maxSize,
          usagePercentage: (this.currentSize / this.maxSize) * 100
        };
        resolve(stats);
      };
      
      request.onerror = () => resolve(null);
    });
  }
}

// ==================== SISTEMA DE CACHÉ ====================
class FastSearchCache {
  constructor() {
    this.cache = new Map();
    this.maxSize = 50;
  }

  get(key) {
    const item = this.cache.get(key);
    if (!item) return null;
    
    if (Date.now() > item.expiry) {
      this.cache.delete(key);
      return null;
    }
    
    return item.data;
  }

  set(key, data, ttl = SEARCH_CONFIG.cacheDuration) {
    if (this.cache.size >= this.maxSize) {
      const firstKey = this.cache.keys().next().value;
      this.cache.delete(firstKey);
    }
    
    this.cache.set(key, {
      data,
      expiry: Date.now() + ttl
    });
  }

  clear() {
    this.cache.clear();
  }
}

// ==================== SISTEMA DE REPRODUCCIÓN CONTINUA ====================
class ContinuousPlaybackManager {
  constructor() {
    this.currentContext = null;
    this.contextData = {
      genre: { currentIndex: -1, items: [] },
      search: { currentIndex: -1, items: [] },
      favorites: { currentIndex: -1, items: [] },
      album: { currentIndex: -1, items: [], currentAlbumId: null },
      searchPlaylist: { currentIndex: -1, items: [] }
    };
  }
  
  setContext(context, items, startIndex = 0, albumId = null) {
    this.currentContext = context;
    this.contextData[context] = {
      currentIndex: startIndex,
      items: items || [],
      currentAlbumId: albumId
    };
  }
  
  getNextTrack() {
    if (!this.currentContext || !this.contextData[this.currentContext].items.length) {
      return null;
    }
    
    const context = this.contextData[this.currentContext];
    
    if (this.currentContext === 'favorites' && state.shuffleFavorites) {
      context.currentIndex = Math.floor(Math.random() * context.items.length);
    } else {
      context.currentIndex = (context.currentIndex + 1) % context.items.length;
    }
    
    return context.items[context.currentIndex];
  }
  
  getCurrentContext() {
    return this.currentContext;
  }
  
  hasNextTrack() {
    const context = this.contextData[this.currentContext];
    return context && context.items.length > 0 && 
           context.currentIndex < context.items.length - 1;
  }
  
  setAlbumPlaylist(albumId, tracks, startIndex = 0) {
    this.setContext('album', tracks, startIndex, albumId);
  }
  
  getCurrentAlbumId() {
    return this.contextData.album.currentAlbumId;
  }
  
  isPlayingAlbum(albumId = null) {
    if (albumId) {
      return this.currentContext === 'album' && this.contextData.album.currentAlbumId === albumId;
    }
    return this.currentContext === 'album';
  }

  setSearchPlaylist(tracks, startIndex = 0) {
    this.setContext('searchPlaylist', tracks, startIndex);
  }
  
  getPreviousTrack() {
    if (!this.currentContext || !this.contextData[this.currentContext].items.length) {
      return null;
    }
    
    const context = this.contextData[this.currentContext];
    context.currentIndex = (context.currentIndex - 1 + context.items.length) % context.items.length;
    
    return context.items[context.currentIndex];
  }
}

function loadFavorites() {
  try {
    const favorites = localStorage.getItem('resonate_favorites');
    if (favorites) {
      state.favorites = JSON.parse(favorites);
      
      // Precargar favoritos aleatoriamente
      audioCache.preloadFavorites(state.favorites);
    }
  } catch (e) {
    state.favorites = [];
  }
}

function saveFavorites() {
  try {
    localStorage.setItem('resonate_favorites', JSON.stringify(state.favorites));
    
    // Actualizar precarga de favoritos aleatoriamente
    audioCache.preloadFavorites(state.favorites);
  } catch (e) {
    console.log('Error guardando favoritos');
  }
}

function isTrackFavorite(track) {
  if (!track || !track.url) return false;
  return state.favorites.some(fav => fav.url === track.url);
}

function toggleFavorite(track) {
  if (!track || !track.url) return;
  
  const isFavorite = isTrackFavorite(track);
  
  if (isFavorite) {
    state.favorites = state.favorites.filter(fav => fav.url !== track.url);
    audioCache.remove(track.url).then(removed => {
      if (removed) {
        console.log('Pista eliminada de caché al quitar de favoritos:', track.url);
      }
    });
    showStatus('Eliminado de favoritos', 'info');
  } else {
    const favoriteTrack = {
      id: track.id,
      title: track.title || 'Sin título',
      creator: track.creator || 'Desconocido',
      url: track.url,
      isAlbumTrack: track.isAlbumTrack || false,
      albumId: track.albumId || track.id,
      trackIndex: track.trackIndex || 0,
      totalTracks: track.totalTracks || 1,
      albumTitle: track.album || track.title
    };
    state.favorites.push(favoriteTrack);
    
    // Precargar el favorito en caché
    audioCache.prefetchAudio(track.url, true);
    
    showStatus('Agregado a favoritos', 'info');
  }
  
  saveFavorites();
  updateFavoriteButton();
  updateFavoritesList();
}

// NUEVA FUNCIÓN: Agregar todas las pistas de un álbum a favoritos
function addAlbumToFavorites(albumId, files) {
  if (!files || files.length === 0) return;
  
  let addedCount = 0;
  
  files.forEach((track, index) => {
    // Verificar si la pista ya está en favoritos
    if (!state.favorites.some(fav => fav.url === track.url)) {
      const favoriteTrack = {
        id: track.id,
        title: track.title || 'Sin título',
        creator: track.creator || 'Desconocido',
        url: track.url,
        isAlbumTrack: true,
        albumId: albumId,
        trackIndex: index,
        totalTracks: files.length,
        albumTitle: track.album || files[0]?.album || 'Álbum'
      };
      state.favorites.push(favoriteTrack);
      addedCount++;
      
      // Precargar cada favorito en caché
      audioCache.prefetchAudio(track.url, true);
    }
  });
  
  if (addedCount > 0) {
    saveFavorites();
    updateFavoriteButton();
    updateFavoritesList();
    showStatus(`Álbum agregado a favoritos (${addedCount} pistas)`, 'info');
  } else {
    showStatus('Todas las pistas del álbum ya están en favoritos', 'info');
  }
}

// NUEVA FUNCIÓN: Verificar si todas las pistas de un álbum están en favoritos
function isAlbumInFavorites(albumId) {
  // Buscar cualquier pista del álbum en favoritos
  return state.favorites.some(fav => fav.albumId === albumId);
}

function updateFavoriteButton() {
  if (state.currentTrack && state.currentTrack.url) {
    const isFavorite = isTrackFavorite(state.currentTrack);
    elements.favoriteBtn.classList.toggle('active', isFavorite);
    elements.favoriteBtn.textContent = isFavorite ? '❤️' : '🩶';
  } else {
    elements.favoriteBtn.classList.remove('active');
    elements.favoriteBtn.textContent = '🩶';
  }
}

function formatTime(seconds) {
  if (!isFinite(seconds) || seconds < 0) return '0:00';
  const minutes = Math.floor(seconds / 60);
  const remainingSeconds = Math.floor(seconds % 60);
  return `${minutes}:${String(remainingSeconds).padStart(2, '0')}`;
}

function showStatus(message, type = 'info', duration = 3000) {
  elements.statusMessages.innerHTML = '';
  
  const messageEl = document.createElement('div');
  messageEl.className = `status-message status-${type}`;
  messageEl.textContent = message;
  elements.statusMessages.appendChild(messageEl);

  if (duration > 0) {
    setTimeout(() => {
      if (messageEl.parentNode) {
        messageEl.remove();
      }
    }, duration);
  }
}

// ==================== FUNCIONES ASÍNCRONAS CORREGIDAS ====================
async function fetchWithTimeout(resource, options = {}) {
  const { timeout = 8000, ...fetchOptions } = options;
  
  const controller = new AbortController();
  const timeoutId = setTimeout(() => {
    controller.abort();
  }, timeout);
  
  try {
    const response = await fetch(resource, {
      ...fetchOptions,
      signal: controller.signal  
    });
    clearTimeout(timeoutId);
    return response;
  } catch (error) {
    clearTimeout(timeoutId);
    if (error.name === 'AbortError') {
      throw new Error(`Timeout: La petición tardó más de ${timeout}ms`);
    }
    throw error;
  }
}

async function performOptimizedSearch(query, page = 0) {
  if (!query.trim()) {
    hideSearchResults();
    return { results: [], hasMore: false };
  }

  const cacheKey = `search:${query}:${page}`;
  const cached = searchCache.get(cacheKey);
  
  if (cached) {
    console.log('Resultados desde caché:', cached.results.length);
    return cached;
  }

  elements.searchResults.classList.add('active');
  state.searchActive = true;

  try {
    const startTime = Date.now();
    const encodedQuery = encodeURIComponent(`${query} AND mediatype:audio`);
    
    const url = `https://archive.org/advancedsearch.php?q=${encodedQuery}&fl[]=identifier,title,creator&rows=${SEARCH_CONFIG.resultsPerPage}&page=${page + 1}&output=json&sort[]=downloads+desc`;
    
    const response = await fetchWithTimeout(url, { 
      timeout: SEARCH_CONFIG.timeout,
      headers: {
        'Accept': 'application/json'
      }
    });
    
    if (!response.ok) throw new Error('Error de red');
    
    const data = await response.json();
    const results = data.response?.docs || [];
    
    const processedResults = results.map(item => ({
      identifier: item.identifier,
      title: item.title || 'Sin título',
      creator: item.creator || 'Desconocido',
      isAlbum: null,
      trackCount: null
    }));

    const hasMore = results.length === SEARCH_CONFIG.resultsPerPage;
    
    const searchResult = {
      results: processedResults,
      hasMore,
      total: data.response?.numFound || 0
    };
    
    searchCache.set(cacheKey, searchResult);
    
    console.log(`Búsqueda completada en ${Date.now() - startTime}ms. Resultados: ${results.length}`);
    
    return searchResult;
    
  } catch (error) {
    console.error('Error en búsqueda:', error);
    elements.searchResultsList.innerHTML = '<div class="no-results">Error en la búsqueda</div>';
    return { results: [], hasMore: false };
  }
}

async function fetchOptimizedPlayableFiles(identifier) {
  const cacheKey = `metadata:${identifier}`;
  const cached = metadataCache.get(cacheKey);
  
  if (cached) {
    return cached;
  }
  
  const url = `https://archive.org/metadata/${identifier}`;
  
  try {
    const response = await fetchWithTimeout(url, { timeout: 10000 });
    if (!response.ok) throw new Error('Error al cargar metadatos');
    const metadata = await response.json();
    
    if (!metadata?.files) {
      throw new Error('Metadatos inválidos');
    }
    
    const audioFiles = metadata.files.filter(file => 
      isPlayableAudioFile(file)
    ).sort((a, b) => {
      const aIsMp3 = a.name.toLowerCase().endsWith('.mp3');
      const bIsMp3 = b.name.toLowerCase().endsWith('.mp3');
      
      if (aIsMp3 && !bIsMp3) return -1;
      if (!aIsMp3 && bIsMp3) return 1;
      
      return (a.size || 0) - (b.size || 0);
    });
    
    if (audioFiles.length === 0) {
      throw new Error('No hay archivos de audio reproducibles');
    }
    
    const playableFiles = createPlayableFiles(audioFiles, identifier, metadata);
    
    metadataCache.set(cacheKey, playableFiles);
    
    return playableFiles;
    
  } catch (error) {
    console.error('Error al cargar archivos optimizados:', error);
    throw error;
  }
}

// ==================== FUNCIONES DE UTILIDAD SINCRÓNICAS ====================
function isPlayableAudioFile(file) {
  if (!file.name) return false;
  
  const excludePatterns = [
    /_files\.xml$/i,
    /_meta\.xml$/i,
    /_reviews\.xml$/i,
    /_archive\.torrent$/i,
    /_meta\.sqlite$/i,
    /\.png$/i,
    /\.jpg$/i,
    /\.jpeg$/i,
    /\.gif$/i,
    /_thumb\./i,
    /spectrogram/i,
    /preview/i,
    /sample/i,
    /demo/i,
    /\.rar$/i,
    /\.zip$/i,
    /\.7z$/i,
    /\.tar$/i,
    /\.gz$/i
  ];
  
  const hasExcludedPattern = excludePatterns.some(pattern => 
    pattern.test(file.name)
  );
  
  if (hasExcludedPattern) return false;
  
  const audioFormats = ['.mp3', '.ogg', '.wav', '.flac', '.m4a', '.aac'];
  const isAudioFile = audioFormats.some(format => 
    file.name.toLowerCase().endsWith(format)
  );
  
  if (!isAudioFile) return false;
  
  const fileSize = file.size || 0;
  if (fileSize < 50000) return false;
  if (fileSize > 500000000) return false;
  
  return true;
}

function createPlayableFiles(audioFiles, identifier, metadata) {
  let playableFiles;
  
  if (audioFiles.length > 1) {
    playableFiles = audioFiles
      .map((file, index) => {
        const trackInfo = extractTrackInfo(file, metadata.metadata);
        
        return {
          url: `https://archive.org/download/${identifier}/${encodeURIComponent(file.name)}`,
          title: trackInfo.title || metadata.metadata?.title || file.name || identifier,
          creator: trackInfo.artist || metadata.metadata?.creator || 'Artista desconocido',
          id: identifier,
          format: file.name.split('.').pop()?.toUpperCase() || 'MP3',
          trackNumber: trackInfo.trackNumber,
          duration: file.length || 0,
          album: metadata.metadata?.title || identifier,
          isAlbumTrack: true,
          albumId: identifier,
          trackIndex: index,
          totalTracks: audioFiles.length
        };
      })
      .sort((a, b) => {
        if (a.trackNumber !== undefined && b.trackNumber !== undefined) {
          return a.trackNumber - b.trackNumber;
        }
        return (a.title || '').localeCompare(b.title || '');
      });
  } else {
    const audioFile = audioFiles[0];
    const trackInfo = extractTrackInfo(audioFile, metadata.metadata);
    
    playableFiles = [{
      url: `https://archive.org/download/${identifier}/${encodeURIComponent(audioFile.name)}`,
      title: trackInfo.title || metadata.metadata?.title || audioFile.name || identifier,
      creator: trackInfo.artist || metadata.metadata?.creator || 'Artista desconocido',
      id: identifier,
      format: audioFile.name.split('.').pop()?.toUpperCase() || 'MP3',
      album: metadata.metadata?.title || identifier,
      isAlbumTrack: false,
      trackIndex: 0,
      totalTracks: 1
    }];
  }
  
  return playableFiles;
}

function extractTrackInfo(file, itemMetadata) {
  const result = {
    title: null,
    artist: null,
    trackNumber: null
  };
  
  if (file.title) result.title = file.title;
  if (file.artist) result.artist = file.artist;
  if (file.creator) result.artist = file.creator;
  if (file.track && !isNaN(parseInt(file.track))) {
    result.trackNumber = parseInt(file.track);
  }
  
  if (!result.title) {
    const baseName = file.name.replace(/\.[^/.]+$/, "");
    
    const patterns = [
      /^(\d+)[\s\.\-]+\s*(.+?)\s*$/,
      /^(.+?)\s*-\s*(\d+)[\s\.\-]+\s*(.+?)\s*$/,
      /^(.+?)\s*-\s*(.+?)\s*$/
    ];
    
    for (const pattern of patterns) {
      const match = baseName.match(pattern);
      if (match) {
        if (match.length === 3) {
          result.trackNumber = parseInt(match[1]);
          result.title = match[2].trim();
        } else if (match.length === 4) {
          result.artist = match[1].trim();
          result.trackNumber = parseInt(match[2]);
          result.title = match[3].trim();
        } else if (match.length === 3 && pattern === patterns[2]) {
          result.artist = match[1].trim();
          result.title = match[2].trim();
        }
        
        if (result.title) break;
      }
    }
    
    if (!result.title) {
      result.title = itemMetadata?.title || baseName;
    }
  }
  
  if (!result.artist) {
    result.artist = itemMetadata?.creator;
  }
  
  return result;
}

// ==================== CACHE DE AUDIO MEJORADO ====================
async function loadAudioWithCache(track) {
  if (!track || !track.url) {
    throw new Error('URL de audio no disponible');
  }

  // NO limpiar la URL anterior aquí - eso se hará en playAudioTrackOptimized
  try {
    // Intentar obtener de la caché primero
    const cachedBlob = await audioCache.get(track.url);
    
    if (cachedBlob) {
      console.log('Reproduciendo desde caché:', track.title);
      const blobUrl = URL.createObjectURL(cachedBlob);
      return blobUrl;
    }

    // Si no está en caché y no hay conexión, no podemos cargarlo
    if (!state.networkOnline) {
      throw new Error('Sin conexión y audio no disponible en caché');
    }

    // Cargar desde la red
    console.log('Descargando audio:', track.title);
    showStatus('Descargando audio...', 'info', 0);
    
    const response = await fetchWithTimeout(track.url, { timeout: 15000 });
    
    if (!response.ok) {
      throw new Error(`Error HTTP: ${response.status}`);
    }

    const blob = await response.blob();
    
    // Guardar en caché para uso futuro (en segundo plano)
    const isFavorite = isTrackFavorite(track);
    audioCache.put(track.url, blob, true, isFavorite).catch(error => {
      console.log('Error guardando en caché:', error);
    });

    const blobUrl = URL.createObjectURL(blob);
    
    showStatus('Audio cargado', 'info', 1000);
    return blobUrl;

  } catch (error) {
    console.error('Error cargando audio:', error);
    
    // Intentar estrategias de fallback
    if (!state.networkOnline) {
      // Precargar pistas siguientes si estamos en un contexto
      preloadNextTrack();
    }
    
    throw error;
  }
}

function preloadNextTrack() {
  const context = playbackManager.getCurrentContext();
  if (!context) return;

  const ctx = playbackManager.contextData[context];
  const currentIndex = ctx.currentIndex;
  const nextTracks = [];

  // Solo precargar la siguiente pista
  const nextIndex = (currentIndex + 1) % ctx.items.length;
  if (ctx.items[nextIndex]) {
    nextTracks.push(ctx.items[nextIndex]);
  }

  // Precargar en segundo plano si hay conexión
  if (state.networkOnline && nextTracks.length > 0) {
    audioCache.preloadTracks(nextTracks, false);
  }
}

function preloadInitialTracks() {
  const context = playbackManager.getCurrentContext();
  if (!context) return;

  const ctx = playbackManager.contextData[context];
  const currentIndex = ctx.currentIndex;
  const nextTracks = [];

  // Precargar las siguientes 10 pistas al inicio
  for (let i = 1; i <= 10; i++) {
    const nextIndex = (currentIndex + i) % ctx.items.length;
    if (ctx.items[nextIndex]) {
      nextTracks.push(ctx.items[nextIndex]);
    }
  }

  // Precargar en segundo plano si hay conexión
  if (state.networkOnline && nextTracks.length > 0) {
    audioCache.preloadTracks(nextTracks, true);
  }
}

// ==================== SEGUIMIENTO DE ESCUCHAS ====================
function setupListenTracking() {
  elements.audio.addEventListener('play', () => {
    if (state.currentTrack) {
      state.currentTrackListenStart = Date.now();
      console.log('Iniciando seguimiento de escucha para:', state.currentTrack.title);
    }
  });

  elements.audio.addEventListener('ended', async () => {
    if (state.currentTrack) {
      const listenDuration = Date.now() - state.currentTrackListenStart;
      const trackDuration = elements.audio.duration * 1000; // Convertir a ms
      
      // Si se escuchó al menos el 90% de la pista, marcarla como escuchada completamente
      if (listenDuration >= trackDuration * 0.9) {
        await audioCache.markAsFullyListened(state.currentTrack.url);
        console.log('Pista marcada como escuchada completamente:', state.currentTrack.title);
        
        // NUEVO: Reemplazar en cola FIFO cuando se completa la reproducción
        if (isTrackFavorite(state.currentTrack)) {
          console.log('Reemplazando favorito en cola FIFO por reproducción completada');
          await audioCache.replaceFavoritesQueueItem(state.currentTrack.url, null, state.favorites);
        }
        
        // Actualizar estadísticas de uso
        const stats = await audioCache.getUsageStats();
        if (stats && stats.usagePercentage > 90) {
          showStatus(`Almacenamiento: ${stats.usagePercentage.toFixed(1)}% utilizado`, 'info', 3000);
        }
      } else {
        // Registrar que se saltó temprano
        const skipCount = state.tracksSkippedEarly.get(state.currentTrack.url) || 0;
        state.tracksSkippedEarly.set(state.currentTrack.url, skipCount + 1);
        console.log(`Pista saltada temprano: ${state.currentTrack.title} (${skipCount + 1} veces)`);
      }
      
      state.currentTrackListenStart = 0;
    }
  });

  elements.audio.addEventListener('seeked', () => {
    // Si el usuario busca hacia atrás, reiniciar el contador de escucha
    if (state.currentTrackListenStart > 0) {
      state.currentTrackListenStart = Date.now();
    }
  });
}

// ==================== FUNCIONES DE INTERFAZ ====================
function setupSearchOnEnter() {
  let currentPage = 0;
  let currentQuery = '';
  let isLoadingMore = false;

  elements.searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      currentPage = 0;
      currentQuery = elements.searchInput.value.trim();
      if (currentQuery) {
        performOptimizedSearch(currentQuery, 0)
          .then(result => displaySearchResults(result, true));
      } else {
        hideSearchResults();
      }
    } else if (e.key === 'Escape') {
      hideSearchResults();
    }
  });

  window.loadMoreResults = async function() {
    if (isLoadingMore || !currentQuery) return;
    
    isLoadingMore = true;
    currentPage++;
    
    const loadMoreBtn = document.querySelector('.load-more-btn');
    if (loadMoreBtn) {
      loadMoreBtn.disabled = true;
      loadMoreBtn.textContent = 'Cargando...';
    }
    
    await loadSearchResults(currentQuery, currentPage, false);
    
    isLoadingMore = false;
  };
}

async function loadSearchResults(query, page = 0, clearExisting = true) {
  try {
    const result = await performOptimizedSearch(query, page);
    displaySearchResults(result, clearExisting);
  } catch (error) {
    console.error('Error cargando resultados:', error);
    elements.searchResultsList.innerHTML = '<div class="no-results">Error cargando resultados</div>';
  }
}

function displaySearchResults(searchData, clearExisting = true) {
  const { results, hasMore, total } = searchData;
  
  if (clearExisting) {
    elements.searchResultsList.innerHTML = '';
    state.searchResults = results;
  } else {
    state.searchResults = [...state.searchResults, ...results];
  }

  if (results.length === 0 && clearExisting) {
    elements.searchResultsList.innerHTML = '<div class="no-results">No se encontraron resultados</div>';
    elements.searchResults.classList.add('active');
    return;
  }

  const fragment = document.createDocumentFragment();
  
  results.forEach((result, index) => {
    const resultEl = createSearchResultElement(result, index + (clearExisting ? 0 : state.searchResults.length - results.length));
    fragment.appendChild(resultEl);
  });

  if (clearExisting) {
    elements.searchResultsList.appendChild(fragment);
  } else {
    const existingLoadMore = elements.searchResultsList.querySelector('.load-more');
    if (existingLoadMore) {
      existingLoadMore.remove();
    }
    
    elements.searchResultsList.appendChild(fragment);
  }

  if (hasMore) {
    const loadMoreEl = document.createElement('div');
    loadMoreEl.className = 'load-more';
    loadMoreEl.innerHTML = `
      <button class="load-more-btn" onclick="loadMoreResults()">
        Cargar más resultados
      </button>
    `;
    elements.searchResultsList.appendChild(loadMoreEl);
  }

  elements.searchResults.classList.add('active');
}

function createSearchResultElement(result, globalIndex) {
  const resultEl = document.createElement('div');
  resultEl.className = 'search-result';
  
  const hasFavoriteTrack = isAlbumInFavorites(result.identifier);
  
  resultEl.innerHTML = `
    <button class="result-favorite ${hasFavoriteTrack ? 'active' : ''}">${hasFavoriteTrack ? '❤️' : '🩶'}</button>
    <div class="result-info">
    <div class="result-title">
        ${result.title}
      </div>
      <div class="result-creator">${result.creator}</div>
      <div class="result-meta">
        <span class="result-album-indicator">🎵 Cargando información...</span>
      </div>
    </div>
  `;

  // Cargar información de álbum en segundo plano
  loadAlbumInfoBackground(result.identifier, resultEl);

  const favoriteBtn = resultEl.querySelector('.result-favorite');
  favoriteBtn.addEventListener('click', async (e) => {
    e.stopPropagation();
    
    try {
      const files = await fetchOptimizedPlayableFiles(result.identifier);
      if (files.length > 0) {
        if (files.length > 1) {
          // Es un álbum - agregar todas las pistas
          addAlbumToFavorites(result.identifier, files);
          const isNowFavorite = isAlbumInFavorites(result.identifier);
          favoriteBtn.classList.toggle('active', isNowFavorite);
          favoriteBtn.textContent = isNowFavorite ? '❤️' : '🩶';
        } else {
          // Es una pista individual
          const track = files[0];
          toggleFavorite(track);
          const isNowFavorite = isTrackFavorite(track);
          favoriteBtn.classList.toggle('active', isNowFavorite);
          favoriteBtn.textContent = isNowFavorite ? '❤️' : '🩶';
        }
      }
    } catch (error) {
      console.error('Error al obtener URL para favorito:', error);
      showStatus('Error al agregar favorito', 'error');
    }
  });

  // MODIFICADO: Solo reproducir si el usuario hace clic en la información de la pista
  const trackInfo = resultEl.querySelector('.track-item-info');
  if (trackInfo) {
    trackInfo.addEventListener('click', async (e) => {
      showStatus(`Cargando: ${result.title}`, 'info', 0);
      await playOptimizedSearchResult(result, globalIndex, state.searchResults);
    });
  }

  return resultEl;
}

async function loadAlbumInfoBackground(identifier, resultEl) {
  try {
    const metadata = await fetchOptimizedPlayableFiles(identifier);
    const isAlbum = metadata.length > 1;
    const trackCount = metadata.length;
    
    const metaElement = resultEl.querySelector('.result-meta');
    if (metaElement) {
      metaElement.innerHTML = isAlbum ? 
        `<span class="result-album-indicator">🎵 Álbum: ${trackCount} pistas</span>` :
        `<span class="result-album-indicator">🎵 Pista individual</span>`;
    }
    
    // Actualizar el estado del botón de favorito
    const favoriteBtn = resultEl.querySelector('.result-favorite');
    if (favoriteBtn) {
      const isFavorite = isAlbumInFavorites(identifier);
      favoriteBtn.classList.toggle('active', isFavorite);
      favoriteBtn.textContent = isFavorite ? '❤️' : '🩶';
    }
    
    if (isAlbum && !resultEl.querySelector('.expand-tracks')) {
      const expandButton = document.createElement('button');
      expandButton.className = 'expand-tracks';
      expandButton.innerHTML = '▼ <span>Ver pistas</span>';
      resultEl.appendChild(expandButton);
      
      const tracksContainer = document.createElement('div');
      tracksContainer.className = 'tracks-container';
      tracksContainer.style.display = 'none';
      resultEl.appendChild(tracksContainer);
      
      expandButton.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleAlbumTracks(identifier, tracksContainer, expandButton);
      });
    }
  } catch (error) {
    console.log('Error cargando información de álbum:', error);
    const metaElement = resultEl.querySelector('.result-meta');
    if (metaElement) {
      metaElement.innerHTML = '<span style="color: var(--muted); font-size: 10px;">Error cargando información</span>';
    }
  }
}

function toggleAlbumTracks(albumId, tracksContainer, expandButton) {
  if (tracksContainer.style.display === 'none') {
    displayAlbumTracks(albumId, tracksContainer);
    tracksContainer.style.display = 'block';
    expandButton.innerHTML = '▲ <span>Ocultar pistas</span>';
    state.expandedAlbums.add(albumId);
  } else {
    tracksContainer.style.display = 'none';
    expandButton.innerHTML = '▼ <span>Ver pistas</span>';
    state.expandedAlbums.delete(albumId);
  }
}

function displayAlbumTracks(albumId, tracksContainer) {
  tracksContainer.innerHTML = '<div class="search-loading"><span class="loader"></span>Cargando pistas...</div>';
  
  fetchOptimizedPlayableFiles(albumId)
    .then(files => {
      tracksContainer.innerHTML = '';
      
      if (files.length === 0) {
        tracksContainer.innerHTML = '<div class="no-results">No se encontraron pistas</div>';
        return;
      }
      
      const tracksList = document.createElement('div');
      tracksList.className = 'tracks-list';
      
      files.forEach((track, index) => {
        const trackItem = document.createElement('div');
        trackItem.className = 'track-item';
        
        const isFavorite = isTrackFavorite(track);
        const trackNumber = track.trackNumber || index + 1;
        
        trackItem.innerHTML = `
          <div class="track-actions">
            <span class="track-number">${trackNumber}</span>
            <button class="track-play" data-url="${track.url}" data-title="${track.title}">▶</button>
            <button class="track-favorite ${isFavorite ? 'active' : ''}">${isFavorite ? '❤️' : ' 🩶 '}</button>
          </div>
          <div class="track-item-info">
            <div class="track-title">${track.title || 'Sin título'}</div>
            <div class="track-creator">${track.creator || 'Desconocido'}</div>
          </div>          
        `;
        
        const playBtn = trackItem.querySelector('.track-play');
        playBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          playSpecificTrack(track, albumId, index, files.length);
        });
        
        const favoriteBtn = trackItem.querySelector('.track-favorite');
        favoriteBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleFavorite(track);
          const isNowFavorite = isTrackFavorite(track);
          favoriteBtn.classList.toggle('active', isNowFavorite);
          favoriteBtn.textContent = isNowFavorite ? '❤️' : '🩶';
        });

        // MODIFICADO: Solo reproducir si el usuario hace clic en la información de la pista
        const trackInfo = trackItem.querySelector('.track-item-info');
        trackInfo.addEventListener('click', (e) => {
          e.stopPropagation();
          playSpecificTrack(track, albumId, index, files.length);
        });
        
        tracksList.appendChild(trackItem);
      });
      
      tracksContainer.appendChild(tracksList);
    })
    .catch(error => {
      console.error('Error cargando pistas del álbum:', error);
      tracksContainer.innerHTML = '<div class="no-results">Error al cargar las pistas</div>';
    });
}

// ==================== FUNCIONES DE REPRODUCCIÓN CORREGIDAS ====================
async function playOptimizedSearchResult(result, index, allResults) {
  if (state.isLoading) return;
  
  state.isLoading = true;
  elements.playBtn.disabled = true;
  elements.playBtn.innerHTML = '<span class="loader"></span>';
  
  try {
    showStatus(`Cargando: ${result.title}`, 'info', 0);
    
    const files = await fetchOptimizedPlayableFiles(result.identifier);
    
    if (files.length > 0) {
      if (files.length > 1) {
        showStatus(`Álbum detectado: ${files.length} pistas`, 'info', 2000);
        state.albumOrigin = 'search';
        playbackManager.setAlbumPlaylist(result.identifier, files, 0);
        
        const firstTrack = files[0];
        await playAudioTrackOptimized(firstTrack, result.identifier, 0, files.length);
      } else {
        // MODIFICACIÓN: Crear lista precargada con todos los resultados
        const searchPlaylist = [];
        
        // Precargar todas las pistas de todos los resultados
        for (let i = 0; i < allResults.length; i++) {
          try {
            const resultFiles = await fetchOptimizedPlayableFiles(allResults[i].identifier);
            if (resultFiles && resultFiles.length > 0) {
              if (resultFiles.length > 1) {
                // Para álbumes, tomar solo la primera pista para simplificar
                searchPlaylist.push(resultFiles[0]);
              } else {
                searchPlaylist.push(resultFiles[0]);
              }
            }
          } catch (error) {
            console.error(`Error precargando resultado ${i}:`, error);
          }
        }
        
        // Configurar la lista precargada
        setupPreloadedPlayback(searchPlaylist, index);
        
        const track = files[0];
        await playAudioTrackOptimized(track, result.identifier);
      }
    } else {
      throw new Error('No se encontraron archivos de audio reproducibles');
    }
    
  } catch (error) {
    console.error('Error en playOptimizedSearchResult:', error);
    
    if (allResults && index < allResults.length - 1) {
      showStatus(`Error con "${result.title}", intentando siguiente...`, 'error', 2000);
      setTimeout(() => {
        playOptimizedSearchResult(allResults[index + 1], index + 1, allResults);
      }, 1500);
    } else {
      showStatus(`Error: ${error.message}`, 'error');
    }
  } finally {
    state.isLoading = false;
    elements.playBtn.disabled = false;
    elements.playBtn.textContent = '||';
  }
}

async function playSpecificTrack(track, albumId, trackIndex, totalTracks) {
  if (state.isLoading) return;
  
  state.isLoading = true;
  elements.playBtn.disabled = true;
  elements.playBtn.innerHTML = '<span class="loader"></span>';
  
  try {
    showStatus(`Cargando: ${track.title}`, 'info', 0);

      const files = await fetchOptimizedPlayableFiles(albumId);
      playbackManager.setAlbumPlaylist(albumId, files, trackIndex);
      state.albumOrigin = 'search';
    }
    
    await playAudioTrackOptimized(track, albumId, trackIndex, totalTracks);
    
    // MODIFICADO: No ocultar resultados automáticamente
  } catch (error) {
    console.error('Error en playSpecificTrack:', error);
    showStatus(`Error: ${error.message}`, 'error');
  } finally {
    state.isLoading = false;
    elements.playBtn.disabled = false;
    elements.playBtn.textContent = '||';
  }
}

async function playAudioTrackOptimized(track, identifier, trackIndex = 0, totalTracks = 1) {
  if (!track || !track.url) {
    throw new Error('Pista no disponible');
  }
  
  elements.audio.pause();
  elements.audio.currentTime = 0;
  
  // CORRECCIÓN CRÍTICA: NO limpiar la fuente anterior hasta que tengamos la nueva
  // Solo pausar y resetear el tiempo, pero mantener el src actual hasta tener el nuevo
  
  if (totalTracks > 1) {
    elements.title.textContent = `${track.title || 'Sin título'}`;
    elements.creator.textContent = `${track.creator || 'Desconocido'} (${trackIndex + 1}/${totalTracks})`;
  } else {
    elements.title.textContent = track.title;
    elements.creator.textContent = track.creator;
  }
  
  await setArtwork(track, identifier);
  
  state.currentTrack = {
    ...track,
    url: track.url,
    id: track.id || identifier,
    trackIndex: trackIndex,
    totalTracks: totalTracks,
    isAlbumTrack: totalTracks > 1,
    albumId: identifier
  };
  
  updateFavoriteButton();
  
  showStatus(`Cargando: ${track.title}`, 'info', 0);
  elements.playBtn.innerHTML = '<span class="loader"></span>';

  return new Promise((resolve, reject) => {
    const audio = elements.audio;
    let timeoutId;
    
    const onCanPlay = () => {
      cleanup();
      audio.play().then(() => {
        if (totalTracks > 1) {
          showStatus(`Reproduciendo: ${track.title} (${trackIndex + 1}/${totalTracks})`, 'info');
        } else {
          showStatus(`Reproduciendo: ${track.title}`, 'info');
        }
        
        // EJECUTAR CALLBACK ONPLAY
        if (state.onPlayCallback && typeof state.onPlayCallback === 'function') {
          try {
            state.onPlayCallback({
              title: track.title,
              creator: track.creator,
              genre: state.currentGenre,
              duration: audio.duration,
              currentTime: audio.currentTime,
              id: state.currentTrack.id
            });
          } catch (error) {
            console.error('Error ejecutando callback onplay:', error);
          }
        }
        
        // Precargar siguiente pista
        preloadNextTrack();
        
        // Precargar 10 pistas iniciales si es la primera vez
        if (!state.initialPreloadDone) {
          state.initialPreloadDone = true;
          preloadInitialTracks();
        }
        
        resolve(true);
      }).catch(reject);
    };
    
    const onError = (e) => {
      cleanup();
      reject(new Error(`Error de audio: ${e.target.error?.message || 'Fuente no compatible'}`));
    };
    
    const cleanup = () => {
      audio.removeEventListener('canplay', onCanPlay);
      audio.removeEventListener('error', onError);
      clearTimeout(timeoutId);
    };
    
    // Cargar audio con caché
    loadAudioWithCache(track)
      .then(blobUrl => {
        // CORRECCIÓN CRÍTICA: Solo ahora limpiar la URL anterior y asignar la nueva
        if (state.currentBlobUrl) {
          URL.revokeObjectURL(state.currentBlobUrl);
        }
        
        state.currentBlobUrl = blobUrl;
        audio.src = blobUrl;
        audio.load();
        audio.preload = 'auto';
        
        timeoutId = setTimeout(() => {
          if (audio.readyState < 2) {
            audio.play().then(() => {
              cleanup();
              resolve(true);
            }).catch(() => {
              cleanup();
              reject(new Error('Tiempo de espera agotado al cargar audio'));
            });
          } else {
            cleanup();
            reject(new Error('Tiempo de espera agotado al cargar audio'));
          }
        }, 20000);
        
        audio.addEventListener('canplay', onCanPlay, { once: true });
        audio.addEventListener('error', onError, { once: true });
      })
      .catch(error => {
        cleanup();
        reject(error);
      });
  });
}
