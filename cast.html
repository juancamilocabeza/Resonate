<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resonate - Transmisión</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    .player {
      max-width: 600px;
      width: 100%;
    }

    .artwork {
      width: 300px;
      height: 300px;
      margin: 0 auto 20px;
      border-radius: 10px;
      background: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
    }

    .artwork img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 10px;
    }

    .track-info {
      margin-bottom: 30px;
    }

    .title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .creator {
      font-size: 18px;
      color: #ccc;
      margin-bottom: 20px;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .control-btn {
      background: #333;
      border: none;
      color: white;
      font-size: 24px;
      padding: 15px;
      border-radius: 50%;
      cursor: pointer;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
    }

    .control-btn:hover {
      background: #555;
    }

    .control-btn:active {
      background: #777;
    }

    .play-btn {
      font-size: 30px;
      width: 80px;
      height: 80px;
    }

    .progress-container {
      width: 100%;
      max-width: 500px;
      margin-bottom: 20px;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #333;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .progress {
      height: 100%;
      background: #007bff;
      width: 0%;
      transition: width 0.1s;
    }

    .time-display {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #ccc;
    }

    .volume {
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 200px;
      margin: 0 auto;
    }

    .volume-slider {
      flex: 1;
    }

    .cast-indicator {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0,123,255,0.8);
      color: white;
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .artwork {
        width: 200px;
        height: 200px;
      }

      .controls {
        gap: 10px;
      }

      .control-btn {
        width: 50px;
        height: 50px;
        font-size: 20px;
        padding: 12px;
      }

      .play-btn {
        width: 70px;
        height: 70px;
        font-size: 26px;
      }
    }
  </style>
</head>
<body>
  <div class="cast-indicator">📺 Transmitiendo</div>

  <div class="player">
    <div class="artwork" id="artwork">🎵</div>

    <div class="track-info">
      <div class="title" id="title">Cargando...</div>
      <div class="creator" id="creator">-</div>
    </div>

    <div class="progress-container">
      <div class="progress-bar">
        <div class="progress" id="progress"></div>
      </div>
      <div class="time-display">
        <span id="current-time">0:00</span>
        <span id="total-time">0:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="control-btn" id="prev-btn">⏮</button>
      <button class="control-btn play-btn" id="play-btn">▶</button>
      <button class="control-btn" id="next-btn">⏭</button>
    </div>

    <div class="volume">
      <span>🔊</span>
      <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.1" value="1">
    </div>
  </div>

  <script>
    let presentationConnection = null;
    let currentState = {
      isPlaying: false,
      currentTime: 0,
      duration: 0,
      volume: 1,
      currentTrack: null
    };

    // Formatear tiempo
    function formatTime(seconds) {
      if (!isFinite(seconds) || seconds < 0) return '0:00';
      const minutes = Math.floor(seconds / 60);
      const remainingSeconds = Math.floor(seconds % 60);
      return `${minutes}:${String(remainingSeconds).padStart(2, '0')}`;
    }

    // Actualizar UI
    function updateUI() {
      document.getElementById('title').textContent = currentState.currentTrack ?
        currentState.currentTrack.title : 'Sin pista';
      document.getElementById('creator').textContent = currentState.currentTrack ?
        currentState.currentTrack.creator : '-';

      document.getElementById('play-btn').textContent = currentState.isPlaying ? '⏸' : '▶';

      const progressPercent = currentState.duration > 0 ?
        (currentState.currentTime / currentState.duration) * 100 : 0;
      document.getElementById('progress').style.width = `${progressPercent}%`;

      document.getElementById('current-time').textContent = formatTime(currentState.currentTime);
      document.getElementById('total-time').textContent = formatTime(currentState.duration);

      document.getElementById('volume-slider').value = currentState.volume;

      // Actualizar artwork
      const artwork = document.getElementById('artwork');
      if (currentState.currentTrack && currentState.currentTrack.artwork) {
        artwork.innerHTML = `<img src="${currentState.currentTrack.artwork}" alt="Artwork" style="width: 100%; height: 100%; object-fit: cover; border-radius: 10px;">`;
      } else {
        artwork.innerHTML = '🎵';
      }
    }

    // Enviar mensaje al controlador principal
    function sendMessage(action) {
      if (presentationConnection && presentationConnection.state === 'connected') {
        presentationConnection.send(JSON.stringify({
          type: 'controls',
          action: action
        }));
      }
    }

    // Configurar controles
    document.getElementById('prev-btn').addEventListener('click', () => sendMessage('prev'));
    document.getElementById('play-btn').addEventListener('click', () => sendMessage('pause')); // Toggle play/pause
    document.getElementById('next-btn').addEventListener('click', () => sendMessage('next'));

    document.getElementById('volume-slider').addEventListener('input', (e) => {
      currentState.volume = parseFloat(e.target.value);
    });

    // Configurar como presentación
    function setupPresentation() {
      if (!navigator.presentation) {
        document.body.innerHTML = '<h1>Error: API de Presentación no disponible</h1>';
        return;
      }

      // Escuchar conexiones entrantes (si es una página de presentación)
      navigator.presentation.receiver.addEventListener('connectionavailable', (event) => {
        presentationConnection = event.connection;
        presentationConnection.addEventListener('message', (event) => {
          try {
            const message = JSON.parse(event.data);
            if (message.type === 'state') {
              currentState = { ...currentState, ...message };
              updateUI();
            }
          } catch (e) {
            console.error('Error procesando mensaje:', e);
          }
        });

        presentationConnection.addEventListener('close', () => {
          presentationConnection = null;
          document.body.innerHTML = '<h1>Transmisión finalizada</h1>';
        });

        // Confirmar recepción
        presentationConnection.send(JSON.stringify({
          type: 'connected',
          message: 'Presentación conectada'
        }));
      });
    }

    // Inicializar
    setupPresentation();
    updateUI();

    // Auto-actualizar cada segundo para simular progreso
    // En una implementación real, esto vendría del controlador principal
    setInterval(() => {
      if (currentState.isPlaying && currentState.duration > 0) {
        currentState.currentTime = Math.min(currentState.duration, currentState.currentTime + 1);
        updateUI();
      }
    }, 1000);
  </script>
</body>
</html>
